let fps=60, fpsLast=0, fpsN=0;
/* Adaptive pixel ratio. The cap starts at MAXDPR; whenever a window of real frames averages
   under PERF.dropBelow fps the cap steps down (2 → 1.5 → 1.25 → 1) and the canvas re-rasters.
   Only ever down, never back up, so it cannot oscillate. Gaps over 100ms are pauses (a tab
   switch, a lock screen) and are not counted; a hit-stop freezes the sim, not the frames. */
let DPR_CAP=MAXDPR, perfAcc=0, perfN=0, perfLast=0, perfCool=0, fpsNow=0, frameMs=0;
const PERF={window:60, dropBelow:50, floor:1, cooldown:4000};
let showPerf=/[#&]fps\b/.test(location.hash);
function perfSample(){
  const t=performance.now(), dt=perfLast?t-perfLast:0; perfLast=t;
  if(dt<=0||dt>100) return;
  perfAcc+=dt; perfN++;
  if(perfN<PERF.window) return;
  frameMs=perfAcc/perfN; fpsNow=1000/frameMs; perfAcc=0; perfN=0;
  if(t<perfCool||fpsNow>=PERF.dropBelow||DPR_CAP<=PERF.floor) return;
  DPR_CAP = DPR_CAP>1.5 ? 1.5 : DPR_CAP>1.25 ? 1.25 : 1;
  perfCool=t+PERF.cooldown; resize();
}
function drawPerf(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const txt=(fpsNow?Math.round(fpsNow):'--')+' fps  '+(frameMs?frameMs.toFixed(1):'--')+' ms  dpr '+dpr.toFixed(2)+' (cap '+DPR_CAP+')';
  ctx.font='700 11px system-ui, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
  const w=ctx.measureText(txt).width+12;
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(6,(safeTop||0)+6,w,18);
  ctx.fillStyle='#8fe39a'; ctx.fillText(txt,12,(safeTop||0)+9);
}
function frame(){
  if(W!==window.innerWidth||H!==window.innerHeight||
     dpr!==Math.min(DPR_CAP,window.devicePixelRatio||1)) resize();
  if(rasterPending&&now()>=rasterAt) rasterNow();
  perfSample();
  update(); draw();
  if(showPerf) drawPerf();
  const t=now();
  if(!fpsLast) fpsLast=t; else if(++fpsN>=30){ fps=Math.round(30000/(t-fpsLast)); fpsN=0; fpsLast=t; }
  requestAnimationFrame(frame);
}

    pieces:'duel', kit:true, shrine:true, bolts:true, bot:{diff:'hard'}, zone:{grace:10000, warn:6000, step:8600}, enemyArrows:false,
    rounds:true, handoff:true,
    win:{kind:'points',n:3}, lose:[{kind:'points',n:3}] }
];
/* The chapters. A chapter is a run of consecutive rungs in TRIALS (from, count); a rung not
   built yet shows its planned title. Progress stays one number, the furthest rung cleared, so a
   chapter opens when the one before it is done and nothing already saved is disturbed. */
const CHAPTERS=[
  {n:1, numeral:'I',   title:'INTRODUCTION', sub:'Learn to move in real time',   from:0,  count:10},
  {n:2, numeral:'II',  title:'RECRUITMENTS', sub:'Spawn, the shrine, the bolts', from:10, count:9,
   planned:['SUMMON','FORK','REINFORCE','BAIT','BOLT','RACE','CLAIM','CONTEST','THE ARENA']},
  {n:3, numeral:'III', title:'COMING SOON', sub:'A new arena is being built', soon:true}
];
const chapterOf=idx=>CHAPTERS.find(ch=>!ch.soon&&idx>=ch.from&&idx<ch.from+ch.count)||CHAPTERS[0];
const chapterTitleAt=(ch,i)=>{ const g=ch.from+i; return g<TRIALS.length ? TRIALS[g].title : ((ch.planned||[])[i]||'—'); };
const enemyArrowsOn=()=>campaign.active&&!!campaign.level&&!!campaign.level.enemyArrows;

/* Progress is two numbers and a set: the furthest rung cleared, and which teaching beats have
   already fired. try/catch because localStorage can be absent on file:// and in private mode; the
   campaign still works for the session, it just forgets. */
const progress={cleared:0, seen:{}};
const LADDER_V=3;   // bump when the rungs change; old progress would point at the wrong trials
function loadProgress(){ try{ const o=JSON.parse(localStorage.getItem('kfcCampaign')||'{}');
  if(o.v!==LADDER_V) return;
  progress.cleared=Math.max(0,o.cleared|0); progress.seen=o.seen||{}; }catch(e){} }
function saveProgress(){ try{ localStorage.setItem('kfcCampaign',JSON.stringify({v:LADDER_V,cleared:progress.cleared,seen:progress.seen})); }catch(e){} }
loadProgress();

/* THE CAMPAIGN: the rail. Built from CHAPTERS and TRIALS against progress.cleared: a stop is
   done, next, or locked, and done and next are tappable; a chapter you have not reached folds
   into a locked count under its medallion; the line is lit down to where you stand. */
function buildPath(){
  const host=document.getElementById('rail'), scroller=document.getElementById('pathScroll');
  for(const el of [...host.children]) if(el.id!=='railLine') el.remove();
  const artSrc=k=>{ const im=document.getElementById('art-'+k); return im&&im.src?im.src:''; };
  const lock='<span class="lock"><b></b></span>';
  let h='', nextEl=null;
  for(const ch of CHAPTERS){
    const open=!ch.soon&&progress.cleared>=ch.from;
    const cleared=ch.soon?0:Math.max(0,Math.min(ch.count,progress.cleared-ch.from));
    const cls=ch.soon?'soon':(open?'open':'locked');
    const ill=artSrc('ch'+ch.n);
    h+='<div class="plate '+cls+'">'+(ill?'<img class="ill" src="'+ill+'" alt=""><span class="fade"></span>':'')
      +'<div class="t"><div class="eb">CHAPTER '+ch.numeral+'</div><div class="nm">'+ch.title+'</div>'+(ch.sub?'<div class="sb">'+ch.sub+'</div>':'')+'</div>'
      +(open?'<div class="pr">'+cleared+' / '+ch.count+'</div>':'')+'</div>';
    if(ch.soon) continue;
    if(!open){ h+='<div class="fold">'+lock+ch.count+' TRIALS \u00B7 CLEAR CHAPTER '+CHAPTERS[ch.n-2].numeral+'</div>'; continue; }
    for(let i=0;i<ch.count;i++){
      const g=ch.from+i, built=g<TRIALS.length;
      const st = g<progress.cleared ? 'done' : (g===progress.cleared&&built ? 'next' : 'locked');
      h+='<button type="button" class="stop '+st+'" data-g="'+g+'"'+(st==='locked'?' disabled':'')+'>'
        +(st==='next'?'<span class="pill"></span>':'')
        +'<i>'+(st==='done'?'\u2713':(i+1))+'</i><span class="nm">'+chapterTitleAt(ch,i)+'</span>'
        +'<span class="st">'+(st==='done'?'REPLAY':(st==='next'?'PLAY \u25B8':''))+'</span></button>';
    }
  }
  host.insertAdjacentHTML('beforeend',h);
  for(const b of host.querySelectorAll('.stop:not(.locked)')) b.addEventListener('click',()=>startCampaign(+b.dataset.g));
  /* The line is lit down to the next stop; with everything built cleared, down to the last. */
  const stops=[...host.querySelectorAll('.stop')];
  nextEl=host.querySelector('.stop.next')||stops[stops.length-1]||null;
  const line=document.getElementById('railLine');
  if(nextEl){ const y=nextEl.offsetTop+nextEl.offsetHeight/2; line.style.background='linear-gradient(#f4b73a 0 '+y+'px, #1b2c5a '+y+'px)'; }
  else line.style.background='#1b2c5a';
  /* The page's one forward action: the next rung, or the last built one again once everything
     is done. */
  const nxt=Math.min(progress.cleared, TRIALS.length-1), play=document.getElementById('pathPlay');
  const ch=chapterOf(nxt);
  play.textContent=(progress.cleared>=TRIALS.length?'REPLAY':'PLAY')+' TRIAL '+(nxt-ch.from+1)+' \u00B7 '+TRIALS[nxt].title;
  play.onclick=()=>startCampaign(nxt);
  /* Open on where you stand, the way a map opens on you: the next stop a little above centre. */
  const settle=()=>{ if(nextEl) scroller.scrollTop=Math.max(0, nextEl.offsetTop-scroller.clientHeight*0.42); else scroller.scrollTop=0; };
  settle(); requestAnimationFrame(settle);
}
function showPath(){
  campaignExit(); started=false; countIn=0; gameOver=null;
  setupEl.classList.remove('show','first'); endEl.classList.remove('show');
  document.getElementById('path').classList.add('show'); buildPath();   // shown first: the rail measures itself
}
function hidePath(){ document.getElementById('path').classList.remove('show'); }
/* The handoff: the board freezes under the plaque exactly as it does under the end screen
   (gameOver halts the sim and the pointer), VICTORY or DEFEAT, one line, the link out. */
/* The plaque's strip: the clash from the splash, cover-cropped to the strip, the crown over it
   when a chapter is done. Drawn into the plaque's own canvas, so it needs no layout. */
function paintPlaqueHero(id,crown){
  const cv=document.getElementById(id); if(!cv) return;
  const g=cv.getContext('2d'), w=cv.width, h=cv.height;
  g.clearRect(0,0,w,h);
  const im=sceneImg('splash');
  if(im){
    const iw=im.naturalWidth, ih=im.naturalHeight;
    const sw=iw*0.96, sh=sw*(h/w), sx=iw*0.02, sy=ih*0.40;
    g.drawImage(im,sx,sy,sw,sh,0,0,w,h);
  }else{ const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#2f8fe6'); gr.addColorStop(1,'#7cc6ff'); g.fillStyle=gr; g.fillRect(0,0,w,h); }
  const sh2=g.createLinearGradient(0,h*0.55,0,h); sh2.addColorStop(0,'rgba(8,16,36,0)'); sh2.addColorStop(1,'rgba(8,16,36,.55)');
  g.fillStyle=sh2; g.fillRect(0,0,w,h);
  if(crown){ const cr=sceneImg('crown'); if(cr){ const cw=h*0.78, ch=cw*cr.naturalHeight/cr.naturalWidth; g.drawImage(cr,(w-cw)/2,h-ch*0.92,cw,ch); } }
}
function showHandoff(won){
  gameOver={winner:won?'w':'b', t:now()};
  const ch=chapterOf(campaign.idx), nx=campaign.idx+1, last=nx>=ch.from+ch.count;
  track('handoff_view',{result:won?'win':'loss', chapter:ch.n, sandbox:campaign.sandbox?1:0});
  const eyebrow=document.getElementById('handEyebrow'), title=document.getElementById('handTitle');
  const hn=document.getElementById('handNext'), ha=document.getElementById('handAgain');
  if(campaign.sandbox||!won||!last){
    /* The sandbox, or a rung that is not a chapter's last: a result and a replay. */
    eyebrow.classList.add('gone'); title.textContent=won?'VICTORY':'DEFEAT';
    hn.classList.add('gone'); ha.classList.remove('gone');
  }else{
    /* A chapter done: it says which, and the way on is the campaign page, which opens on the
       next chapter's first stop. With nothing built beyond, it is the campaign page anyway. */
    eyebrow.textContent='CHAPTER '+ch.n; eyebrow.classList.remove('gone'); title.textContent='COMPLETE';
    const nextCh=CHAPTERS.find(c=>!c.soon&&c.from===nx&&nx<TRIALS.length);
    hn.textContent = nextCh ? 'PROCEED TO CHAPTER '+nextCh.n : 'BACK TO THE CAMPAIGN';
    hn.classList.remove('gone'); ha.classList.add('gone');
  }
  paintPlaqueHero('handHero', !(campaign.sandbox||!won||!last));
  document.getElementById('hand').classList.add('show');
}
function hideHand(){ document.getElementById('hand').classList.remove('show'); }
const ZONE_DEF={grace:22000, warn:8000, step:8600};   // eight bands on 7×9: 22+8+7*8.6 puts the last eruption at 90s, as designed; STEP stays above WARN
const campaign={active:false, idx:0, level:null, attempt:0, decided:null, base:0,
                stagedW:0, hadKing:{w:false,b:false}, cardMs:0, savedDiff:1, tactN:0, marks:[],
                tactSeen:0, warnFired:false, reactAt:0, finalDiff:null, sandbox:false,
                rungT0:0, runT0:0, runRetries:0, startIdx:0,   // for the report: what a rung and a sitting cost
                spawnedW:0, wokeW:0, boltsW:0, boltsB:0, spawnDead:0, contestFired:false, huntAt:0,   // what the kit rungs read
                waitTap:false, revealAt:0, revealFx:0, kkFired:false, enemySpawnDead:0};

function startCampaign(idx){
  audioArm();
  setupEl.classList.remove('show','first'); endEl.classList.remove('show'); hidePath(); hideHand();
  started=true;
  if(!campaign.active) campaign.savedDiff=cfg.diff;   // remember the menu's difficulty once, not a trial's
  campaign.active=true; campaign.attempt=0; campaign.sandbox=false;
  campaign.idx=Math.max(0,Math.min(TRIALS.length-1,(idx|0)));
  campaign.runT0=wall(); campaign.runRetries=0; campaign.startIdx=campaign.idx;   // this sitting: where it began, what it costs
  stageTrial(TRIALS[campaign.idx],{retry:false});
}
/* A hand-rolled reset(): the same round state and the same clock ORDER, minus layoutArmies,
   because a trial places its own pieces. Never goes through applyCfg()/reset(), which would lay
   out the default 4v4 and wipe the score. */
function stageTrial(L,opts){
  const retry=!!(opts&&opts.retry);
  if(!retry) campaign.rungT0=wall();
  track('trial_start',{trial:L.id, trial_no:campaign.idx+1, attempt:campaign.attempt});   // attempt 0 is the first try
  gameOver=null; roundBreak=0; roundMsg=null; goT=0; drag=null; selected=null;
  points={w:0,b:0}; roundNo=1;
  campaign.level=L; campaign.decided=null; campaign.base=0; campaign.tactN=tacticsLog.length;
  campaign.script=(L.script||[]).map(o=>Object.assign({},o)); campaign.scriptI=0;   // a copy: retries mutate it
  campaign.playFired=false; campaign.beatsFired=[]; campaign.tactSeen=campaign.tactN; campaign.warnFired=false; campaign.reactAt=0;
  if(L.zone===false){ GRACE=1e9; WARN=ZONE_DEF.warn; STEP=ZONE_DEF.step; }   // deadRing clamps to -1 forever
  else if(L.zone&&typeof L.zone==='object'){ GRACE=L.zone.grace; WARN=L.zone.warn; STEP=L.zone.step; }
  else { GRACE=ZONE_DEF.grace; WARN=ZONE_DEF.warn; STEP=ZONE_DEF.step; }
  botEnabled=!!L.bot;
  if(L.bot){ const key=(L.handoff&&campaign.finalDiff)?campaign.finalDiff:L.bot.diff;   // the card's pick, for the final battle only
    const i=DIFFS.findIndex(d=>d.k===key); if(i>=0){ cfg.diff=i; applyDiff(); } }
  if(L.pieces==='duel') layoutArmies();
  else{
    pieces=[]; idSeq=0;
    for(const d of L.pieces){ const p=makePiece(d.side,d.type,d.r,d.c); p.cd0=d.cd||0; pieces.push(p); }
  }
  for(const p of pieces){ p._wasMoving=false; p._wasCooling=false; }
  campaign.stagedW=pieces.filter(p=>p.side==='w').length;
  campaign.hadKing={w:pieces.some(p=>p.side==='w'&&p.type==='K'), b:pieces.some(p=>p.side==='b'&&p.type==='K')};
  campaign.marks=(L.marks||[]).map(([r,c])=>({r,c,at:0,wall:0}));   // at: sim time claimed, 0 = still live
  kitReset(); shrineNewMatch(); boltReset(); bombReset();
  campaign.spawnedW=0; campaign.wokeW=0; campaign.boltsW=0; campaign.boltsB=0; campaign.spawnDead=0; campaign.contestFired=false; campaign.huntAt=0;
  campaign.kkFired=false; campaign.revealAt=0; campaign.revealFx=0; campaign.enemySpawnDead=0;
  /* A rung may hand you the card already charged, and say what it holds. */
  if(L.kitCharge) for(const side in L.kitCharge){ const k=kit[side]; if(!k) continue;
    k.charge=Math.max(0,Math.min(1,+L.kitCharge[side]||0)); if(k.charge>=1){ k.src='time'; if(side==='w') k.readyAt=wall(); } }
  if(L.kitNext) for(const side in L.kitNext){ if(kit[side]) kit[side].next=L.kitNext[side]; }
  if(trayWanted()!==trayOnLayout||bannerRows()!==rowsOnLayout) resize();   // a level with a tray or a taller banner gets its room; one without gets it back
  const t2=now();
  campaign.cardMs = retry ? (L.retryCount===undefined?600:L.retryCount) : (L.count===undefined?COUNT_MS:L.count);
  /* A first look at a trial waits for a tap: the card stays until it has been read. A retry,
     already read, runs its short card and goes; a match keeps its 3-2-1. */
  campaign.waitTap = !retry && campaign.cardMs>0 && campaign.cardMs<2000 && !L.rounds;
  countIn = campaign.cardMs ? (campaign.waitTap ? t2+1e9 : t2+campaign.cardMs) : 0;
  stampEntrances(retry ? -1 : t2);               // a retry restages in place; a fresh trial drops in
  roundT0 = countIn || t2;
  botNext=t2+1500; botSnipe=0; lastBotMove=t2;
  endEl.classList.remove('show');
  if(!countIn){ goT=t2; campaignOnPlay(t2); }    // no card: do the gate's work here
}
/* Called from the count-in gate the tick play begins. Staged cooldowns are stamped HERE, not at
   staging, so the title card cannot quietly burn them. */
function campaignOnPlay(t){
  campaign.base=t;
  if(campaign.level&&campaign.level.kitReveal){ campaign.revealAt=t+700; campaign.revealFx=0; }   // the lock breaks a beat after play
  for(const p of pieces) if(p.cd0){ p.cdStart=t; p.cdEnd=t+p.cd0; }
}
/* Idempotent, reads piece state only. Win before lose. */
function campaignDecide(t){
  if(!campaign.active||campaign.decided||!campaign.base||!campaign.level) return false;
  const L=campaign.level;
  const aliveW=pieces.filter(p=>p.alive&&p.side==='w'), aliveB=pieces.filter(p=>p.alive&&p.side==='b');
  const elapsed=t-campaign.base;
  /* Their king down: the beat sits over whichever of yours did it — the queen if there is one.
     Here rather than in the tick, because a king kill ends the round and the tick stops. */
  if(campaign.hadKing.b&&!campaign.kkFired&&!aliveB.some(q=>q.type==='K')){ campaign.kkFired=true;
    fireBeat('kingKill', aliveW.find(q=>q.type==='Q')||aliveW[0], t); }
  let won=false;
  if(L.win) switch(L.win.kind){
    case 'reach':      won=campaign.marks.length>0&&campaign.marks.every(m=>m.at); break;
    case 'captureAll': won=aliveB.length===0; break;
    case 'survive':    won=elapsed>=L.win.ms&&aliveW.length>0&&(!campaign.hadKing.w||aliveW.some(p=>p.type==='K')); break;
    case 'tactic':     won=tacticsLog.slice(campaign.tactN).some(e=>e.kind===L.win.tactic&&e.side==='w'); break;
    case 'kingDead':   won=campaign.hadKing.b&&!aliveB.some(p=>p.type==='K'); break;
    case 'points':     won=points.w>=L.win.n; break;
    case 'shrine':     won=shrine.wins.w>0; break;                                   // you took the hill
    case 'bolts':      won=campaign.boltsW>=(L.win.n||1); break;                    // you took this many bolts
    case 'woke':       won=campaign.wokeW>=(L.win.n||1); break;                     // a piece you spawned slept its sickness out
    case 'sleeperDead': won=campaign.enemySpawnDead>=(L.win.n||1); break;                 // you took what they summoned
    case 'spawned':    won=campaign.spawnedW>=(L.win.n||1)&&
                           (!L.win.type||pieces.some(p=>p.alive&&p.side==='w'&&p.spawned&&p.type===L.win.type)); break;
  }
  if(won&&L.win.spawned&&campaign.spawnedW<L.win.spawned) won=false;   // a win that also wants a spawn on the board
  /* A win waits for your last piece to land: a clash kills the enemy in the air with your rook
     still flying, and CLEAR over a rook frozen mid-flight reads as a bug. A loss never waits. */
  if(won&&!roundBreak&&aliveW.some(p=>p.move)) won=false;   // but never during a round break: flights are frozen there, and waiting on one held a won duel until the next round
  let lost=false;
  if(!won) for(const l of (L.lose||[])){
    if(l.kind==='anyLoss')  lost=aliveW.length<campaign.stagedW;
    if(l.kind==='kingDead') lost=campaign.hadKing.w&&!aliveW.some(p=>p.type==='K');
    if(l.kind==='timeout')  lost=elapsed>=l.ms;
    if(l.kind==='marks')    lost=!!L.markMs&&elapsed>=L.markMs&&campaign.marks.some(m=>!m.at);
    if(l.kind==='points')   lost=points.b>=l.n;
    if(l.kind==='enemyBolts') lost=campaign.boltsB>=(l.n||1);                       // they took this many bolts
    if(l.kind==='spawnLost')  lost=campaign.spawnDead>0;                             // a piece you spawned died
    if(l.kind==='shrineLost') lost=shrine.wins.b>0;                                  // they took the hill
    if(lost) break;
  }
  if(!won&&!lost) return false;
  campaign.decided=won?'win':'lose';
  drag=null; selected=null;
  const chS=chapterOf(campaign.idx), sub='TRIAL '+(campaign.idx-chS.from+1)+' / '+chS.count;
  const label = won ? (L.rounds?'VICTORY':'CLEAR') : 'AGAIN';
  /* The hold counts from the moment the word can appear: after the chain reaction if a king
     kill ended the round, now otherwise. */
  const base=(roundBreak&&roundMsg)?roundMsg.t:t;
  const hold=base+(won?(L.clearMs===undefined?1300:L.clearMs):(L.retryMs===undefined?500:L.retryMs));
  if(!roundBreak){
    roundMsg={winner:won?'w':'b', t, label, sub};
    roundBreak=hold;
    if(won){ hitStop(160); confettiBurst('w'); sfxCapture(false); }
  }else if(roundMsg){
    /* A king kill already ended the round through endRound. Keep its drama; in a trial that is
       not a match, take the trial's own hold instead of the round gap, and give a win its
       confetti here since endRound withheld it. */
    roundMsg.label=label; roundMsg.sub=sub;
    if(!L.rounds){ roundBreak=Math.min(roundBreak,hold); if(won) confettiBurst('w'); }
  }
  return true;
}
/* Event detection is transition-based on piece state, one pass, no allocation: a black piece
   that was flying and is not = it LANDED; a white piece that was cooling and is not = READY.
   Arrivals run before this in update(), so a landing is seen on the tick it happens. */
function campaignTick(t){
  if(!campaign.active||!campaign.base) return false;
  if(!campaign.playFired){ campaign.playFired=true;
    fireBeat('play', pieces.find(p=>p.alive&&p.side==='w'), t); }
  for(const p of pieces){
    if(!p.alive){ if(p.spawned&&!p._deadSeen){ p._deadSeen=true; if(p.side==='w') campaign.spawnDead++; else campaign.enemySpawnDead++; } continue; }
    const moving=!!p.move, cooling=p.cdEnd>t;
    /* A spawned piece has slept its sickness out: awake, and counted. Read off the clock, not
       off the sleeper's z's, so a throttled frame cannot miss it. */
    if(p.side==='w'&&p.spawned&&!p._woke&&!moving&&t>=(p.sickEnd||p.cdEnd)){ p._woke=true; campaign.wokeW++; fireBeat('awake',p,t); }
    if(p.side==='b'&&p.spawned&&!p._woke&&!moving&&t>=(p.sickEnd||p.cdEnd)){ p._woke=true; fireBeat('enemyAwake',p,t); }
    if(p.side==='b'&&p._wasMoving&&!moving) fireBeat('enemyLanded',p,t);
    if(p.side==='w'&&p._wasMoving&&!moving) fireBeat('landed',p,t);
    if(p.side==='w'&&p._wasCooling&&!cooling&&!moving) fireBeat('ready',p,t);
    if(p.side==='w'&&!p._wasMoving&&moving&&pieces.some(q=>q!==p&&q.alive&&q.side==='w'&&q.move))
      fireBeat('together',p,t);                                   // a second piece launched under one in flight
    p._wasMoving=moving; p._wasCooling=cooling;
  }
  /* The hill contested for the first time this rung: the beat sits over the intruder. */
  if(shrine.on&&shrine.present.w&&shrine.present.b&&!campaign.contestFired){ campaign.contestFired=true;
    const inHill=q=>{ const [r,c]=curSquare(q); return Math.max(Math.abs(r-SR()),Math.abs(c-SC()))<=1; };
    fireBeat('contest', pieces.find(q=>q.alive&&q.side==='b'&&inHill(q))||null, t); }
  /* A mark is claimed by a white piece standing on it; from then on it is solid and stays. */
  for(const m of campaign.marks){
    if(m.at) continue;
    const q=stationaryAt(m.r,m.c);
    if(q&&q.side==='w'){ m.at=t; m.wall=wall(); fireBeat('mark',q,t); }
  }
  /* Your tactics become beats ('tactic:clash' and so on), anchored on the piece in flight if
     there is one, since a clash winner is still flying when it is logged. */
  while(campaign.tactSeen<tacticsLog.length){
    const e=tacticsLog[campaign.tactSeen++];
    if(e.side!=='w') continue;
    fireBeat('tactic:'+e.kind, pieces.find(q=>q.alive&&q.side==='w'&&q.move)||pieces.find(q=>q.alive&&q.side==='w'), t);
  }
  /* The first ring to blink, once: over whichever of your pieces is standing in it. */
  if(!campaign.warnFired&&GRACE<1e8){
    const ws=warnState(t);
    if(ws){ campaign.warnFired=true;
      const inRing=pieces.find(q=>q.alive&&q.side==='w'&&!q.move&&ringAt(q.r,q.c)===ws.ring);
      fireBeat('warn', inRing||pieces.find(q=>q.alive&&q.side==='w'&&q.type==='K')||pieces.find(q=>q.alive&&q.side==='w'), t, {warned:inRing}); }
  }
  return campaignDecide(t);
}
/* A beat fires once per CONCEPT across the whole campaign (progress.seen), so the second time
   an enemy lands next to you nobody shouts. For now a beat is a callout; step 3 adds the
   time-slow to the same table. */
function fireBeat(on,p,t,ctx){
  const L=campaign.level; if(!L||!L.beats) return;
  for(const b of L.beats){
    if(b.on!==on) continue;
    if(b.concept&&progress.seen[b.concept]) continue;
    if(b.concept){ progress.seen[b.concept]=true; saveProgress(); }
    let over=p;
    if(b.over==='king') over=pieces.find(q=>q.alive&&q.side==='w'&&q.type==='K')||p;
    if(b.over==='enemyKing') over=pieces.find(q=>q.alive&&q.side==='b'&&q.type==='K')||p;
    if(b.over==='target'&&ctx&&ctx.target) over=ctx.target;     // what a script op is aimed at
    if(b.over==='warned'&&ctx&&ctx.warned) over=ctx.warned;     // the piece standing in the blinking ring

/* ================= the shrine =================

   square, in nobody's lines and everybody's reach. Stand on any of the eight squares around it
   for SHRINE.holdMs, alone, and it is yours: your next spawn is a QUEEN. Both sides standing
   there contest it and both timers hold. A side with nobody on the ring — it left, or was
   taken off — loses its timer; the other side's resumes where it stopped. Captured, it is
   spent: the object is gone for the round and the square is ordinary again; the next round
   raises it anew. While it stands the square blocks: nothing lands on it and no slider passes

let shrineMotes=[], shrineMoteLast=0, shrineMoteAcc=0;

const shrineArmed=t=>shrine.on;
/* A round raises the shrine again only if this match has not spent it: one queen per match.
   A new match forgets. */
/* Every round raises the shrine again; within a round it is spent by its capture. */
function shrineReset(){
  shrine.spent=false; shrine.on=shrineWanted(); shrine.prog.w=shrine.prog.b=0; shrine.present.w=shrine.present.b=false;
  shrine.goneAt=0; shrine.last=0; shrine.capturedAt=0; shrine.capturedBy=null; shrine.contestedMs=0;
  shrine.look='rest'; shrine.lookPrev='rest'; shrine.lookT=0;
  shrineMotes.length=0; shrineMoteLast=0; shrineMoteAcc=0;
}
function shrineNewMatch(){ shrine.spent=false; shrine.wins.w=shrine.wins.b=0; shrineReset(); }
/* Sim time, like the kit: a hit-stop and the count-in pause the stand with everything else.
   Present means inside the 3x3, standing OR in the air: a piece hopping between two ring
   squares never leaves the hill, so the colour holds and the timer keeps running; one flying
   out stops counting the moment its current square is outside. */
function shrineTick(t){
  if(!shrine.on) return;
  if(frozen()||!shrine.last){ shrine.last=t; return; }
  const dt=Math.max(0,t-shrine.last); shrine.last=t;
  const inHill=p=>{ const [r,c]=curSquare(p); return Math.max(Math.abs(r-SR()),Math.abs(c-SC()))<=1; };
  const pw=pieces.some(p=>p.alive&&p.side==='w'&&inHill(p));
  const pb=pieces.some(p=>p.alive&&p.side==='b'&&inHill(p));

  if(pw&&pb){ shrine.contestedMs+=dt; return; }          // contested: both hold where they are
  shrine.prog.w = pw ? shrine.prog.w+dt : 0;

/* ---- the look: the PC shrine's five layers, baked ----

      paler wisps — clipped to the frame, breathing slowly.
   2. The frame: a cartouche — a rounded rectangle with scalloped corners and small points at the
      corners and edge midpoints — in pale stone over a dark line. Its state is drawn live on
      top: the taking side's colour, white while contested, as a wide soft stroke under a crisp
      one (the arrow-pulse trick; no blur).

      to deep amber at the rim, a specular, a rim light — with the crown in cream, a wide faint
      stroke under the crisp fill for its glow, and a gold halo behind that pulses.
   4. Motes: rising from the frame's edges, more while a capture runs and in that side's colour;
      four sparkles orbiting the orb. Capped at forty, drawn over the pieces.
   5. The capture: the progress arcs around the orb; on capture the whole thing bursts outward.

/* ================= the king's light =================

   base and attenuating to nothing at KING_LIGHT.radius squares, the way a stage light falls
   off. It pulls the eye to the piece the round is about — yours and theirs — harder than the
   crown halo above it, and it reads as a little territory. Baked once per board size per side,
   one image draw per king per frame, centred on the king's square and gliding with it in
   flight. Three looks, chosen with #light= in the URL or KFC.kingLight():
     soft   a warm-cored pool that fades smoothly — the plain spotlight
     rings  the pool with two faint rings and a centre dot — the bullseye
     zone   a flatter, sharper-edged disc with a rim — the claimed circle
   off turns it off. */
/* Flat discs, on the plane of the board: one solid colour, a taper only in the last tenth of the
   radius, clipped by the board's edge like paint that stops at the rim, riding directly under
   the king. Styles, chosen with #light= or KFC.kingLight():

/* Floor pass, under the shrine and the pieces, clipped to the board so the disc stops at the
   rim like paint would. Centred on the king's SQUARE (the foot sits FOOT_INSET above the
   square's bottom, so the centre is 0.32 of a cell above the foot), which glides with the king
   while it flies. The paint style blends as overlay; the rest sit on top at their own alpha. */
function drawKingLights(T){
  if(KING_LIGHT.style==='off') return;
  if(!klCvs.w||klS!==S||klDpr!==dpr||klStyle!==KING_LIGHT.style) buildKingLights();
  const glow=KING_LIGHT.style==='soft'||KING_LIGHT.style==='rings'||KING_LIGHT.style==='zone';
  const pu=glow?0.94+0.06*Math.sin(wall()/700):1, d=klRadius()*S*2*pu;
  ctx.save();
  ctx.beginPath(); ctx.rect(ox,oy,S*COLS,S*ROWS); ctx.clip();
  if(KING_LIGHT.style==='paint') ctx.globalCompositeOperation='overlay';
  for(const p of pieces){
    if(!p.alive||p.type!=='K') continue;
    const R=pieceRect(p,T); if(R.hidden) continue;
    ctx.drawImage(klCvs[p.side], R.cx-d/2, R.footY-(0.5-FOOT_INSET)*S-d/2, d, d);
  }
  ctx.restore();
}
/* ================= the bolts =================
   Charge that comes from the board rather than the clock. A group of one to three bolts appears
   on empty squares in a short line — a row, a file or a diagonal — in the middle of the board,
   where both sides can reach it. A piece collects a bolt by landing on it; a slider collects
   every bolt its flight passes over, which is the mini-game: line them up and sweep. Each bolt
   adds BOLTS.gain to the collector's kit charge. A group lives BOLTS.life, the next comes
   BOLTS.gap after the last is gone, and a bolt on a square the spikes take is lost with it.
   One group at a time, never on the shrine's square, so the board never fills with clutter. */
const BOLTS={first:6000, gap:5000, life:14000, gain:0.18, maxGroup:3};
let bolts=[], boltNext=0, boltLast=0, boltCv=null, boltS=0, boltDpr=0, boltPlaced=false;
const boltsWanted=()=>!!(campaign.active&&campaign.level&&campaign.level.bolts);
const boltsOn=()=>started&&!gameOver&&boltsWanted();
const boltAt=(r,c)=>bolts.find(b=>b.r===r&&b.c===c);
function boltReset(){ bolts=[]; boltNext=0; boltLast=0; boltPlaced=false; }
function boltSquareFree(r,c){
  if(!inB(r,c)) return false;
  if(ringOf[r*COLS+c]<=deadRing(now())) return false;
  if(shrineBlocks(r,c)||bombBlocks(r,c)) return false;
  if(pieces.some(q=>q.alive&&q.r===r&&q.c===c)) return false;
  return !boltAt(r,c);
}
/* A line of 1..3 empty squares, tried thirty times, in rows 2..ROWS-3 so neither back rank
   gets a free lunch; a lone bolt anywhere empty as the fallback. */
/* A group of bolts: sometimes a line, sometimes a clump, sometimes singles scattered anywhere —
   the roll decides — all inside rows 2..ROWS-3 so neither back rank gets a free lunch. A lone
   bolt is the fallback. */
function boltSpawnGroup(t){
  const R0=2, R1=ROWS-3;
  const free=(r,c)=>r>=R0&&r<=R1&&boltSquareFree(r,c);
  const rr=()=>R0+Math.floor(Math.random()*(R1-R0+1)), rc=()=>Math.floor(Math.random()*COLS);
  const place=sq=>{ for(const [r,c] of sq) bolts.push({r,c,born:t,seed:Math.random()*6.2832}); return sq.length; };
  const roll=Math.random(), n=1+Math.floor(Math.random()*BOLTS.maxGroup);
  if(roll<0.4){                                                    // a line
    const dirs=[[0,1],[1,0],[1,1],[1,-1]];
    for(let tries=0;tries<30;tries++){
      const [dr,dc]=dirs[Math.floor(Math.random()*dirs.length)], r0=rr(), c0=rc();
      const sq=[]; let ok=true;
      for(let i=0;i<n;i++){ const r=r0+dr*i, c=c0+dc*i; if(!free(r,c)){ ok=false; break; } sq.push([r,c]); }
      if(ok) return place(sq);
    }
  }else if(roll<0.7){                                              // a clump: a seed and its neighbours
    for(let tries=0;tries<30;tries++){
      const r0=rr(), c0=rc(); if(!free(r0,c0)) continue;
      const sq=[[r0,c0]], nb=[];
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) if((dr||dc)&&free(r0+dr,c0+dc)) nb.push([r0+dr,c0+dc]);
      shuffle(nb); while(sq.length<n&&nb.length) sq.push(nb.pop());
      return place(sq);
    }
  }else{                                                           // scattered singles, none touching another
    const sq=[];
    for(let tries=0;tries<60&&sq.length<n;tries++){
      const r=rr(), c=rc();
      if(!free(r,c)||sq.some(q=>Math.max(Math.abs(q[0]-r),Math.abs(q[1]-c))<2)) continue;
      sq.push([r,c]);
    }
    if(sq.length) return place(sq);
  }
  for(let tries=0;tries<30;tries++){ const r=rr(), c=rc(); if(free(r,c)) return place([[r,c]]); }
  return 0;
}
/* Sim time, like everything on the board: paused by a hit-stop and by the count-in. */
function boltTick(t){
  if(!boltsOn()){ boltLast=t; return; }
  /* A rung may place its bolts by hand (bolts: a list of squares): they are set out under the
     title card, never fade, and no groups follow them. */
  const L=campaign.level, fixed=!!(L&&Array.isArray(L.bolts));
  if(fixed&&!boltPlaced){ boltPlaced=true;
    for(const [r,c] of L.bolts) if(boltSquareFree(r,c)) bolts.push({r,c,born:t,seed:Math.random()*6.2832,forever:true}); }
  if(frozen()){ boltLast=t; if(!boltNext) boltNext=t+BOLTS.first; return; }
  if(!boltNext) boltNext=t+BOLTS.first;
  const dr0=deadRing(t);
  bolts=bolts.filter(b=>{
    if(ringOf[b.r*COLS+b.c]<=dr0) return false;                 // the spikes took it
    return b.forever||t-b.born<BOLTS.life;                       // or it faded
  });
  if(fixed) return;
  if(!bolts.length&&t>=boltNext){ if(boltSpawnGroup(t)) boltNext=0; else boltNext=t+1000; }
  if(!bolts.length&&!boltNext) boltNext=t+BOLTS.gap;            // the next group after the gap
  if(bolts.length) boltNext=0;
}
function collectBolt(p,t,how){
  if(!boltsOn()||!p.alive) return false;
  const i=bolts.findIndex(b=>b.r===p.r&&b.c===p.c);
  if(i<0) return false;
  boltTake(bolts[i],p.side,t,how,p); bolts.splice(i,1); return true;
}
/* A slider in flight takes every bolt its body has crossed, the same maths as the sweep: the
   eased distance along the line against each bolt's distance from the origin. */
function boltSweep(t){
  if(!boltsOn()||!bolts.length) return;
  for(const p of pieces){
    if(!p.alive||!p.move||p.type==='N'||p.type==='K') continue;
    const A=p.move, dr=p.r-A.fr, dc=p.c-A.fc, L=Math.hypot(dr,dc); if(L<1.5) continue;
    const e=moveCurve(clamp01((t-A.start)/A.dur))*L, ur=dr/L, uc=dc/L;
    for(let i=bolts.length-1;i>=0;i--){
      const b=bolts[i], br=b.r-A.fr, bc=b.c-A.fc;
      if(Math.abs(br*uc-bc*ur)>1e-6) continue;                 // not on the line
      const d=br*ur+bc*uc; if(d<=0.5||d>=L-0.5) continue;       // the origin or the destination: landing's business
      if(e<d-0.30) continue;                                    // not there yet
      boltTake(b,p.side,t,'sweep',p); bolts.splice(i,1);
    }
  }
}
function boltTake(b,side,t,how,p){
  const k=kit[side], was=k?k.charge:1;
  if(k&&!k.full&&k.charge<1){ k.charge=Math.min(1,k.charge+BOLTS.gain); if(k.charge>=1){ k.src='bolt'; if(side==='w') k.readyAt=wall(); } }
  if(campaign.active){
    if(side==='w'){ campaign.boltsW++; fireBeat('bolt',p||null,t); if(was<1&&k&&k.charge>=1) fireBeat('charged',p||null,t); }
    else campaign.boltsB++;
  }
  if(k&&k.bomb<1){ k.bomb=Math.min(1,k.bomb+BOLTS.gain); if(k.bomb>=1){ k.bombSrc='bolt'; if(side==='w') k.bombReadyAt=wall(); } }   // a bolt feeds both cards
  if(k&&side==='w'){ k.bumpAt=wall(); k.shockAt=wall(); }   // the card takes the shock

  for(let i=0;i<7;i++){ const a=Math.random()*6.2832, sp=(0.30+Math.random()*0.45)*S/1000;
    shrineMotes.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-S*0.0003,t0:w,dur:500+Math.random()*300,sz:S*(0.03+Math.random()*0.03),col}); }
  if(!boltCv||shrineMotes.length>60) shrineMotes.splice(0,shrineMotes.length-60);

}
/* The look: a stubby lightning bolt, white core over electric cyan, a dark outline, a wide
   faint stroke for its glow, baked once per board size; drawn bobbing with a flicker on a soft
   cyan pad. Floor pass, after the shrine, before the pieces. */
function buildBolt(){
  boltS=S; boltDpr=dpr;
  const P=S*0.42, c=document.createElement('canvas'); c.width=c.height=Math.max(2,Math.ceil(P*2*dpr));
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); const cx=P, cy=P, h=S*0.46, w2=S*0.14;
  const pad=g.createRadialGradient(cx,cy,0,cx,cy,P); pad.addColorStop(0,'rgba(120,220,255,.55)'); pad.addColorStop(0.6,'rgba(120,220,255,.18)'); pad.addColorStop(1,'rgba(120,220,255,0)');
  g.fillStyle=pad; g.fillRect(0,0,P*2,P*2);
  const bolt=()=>{ g.beginPath();
    g.moveTo(cx+w2*0.35,cy-h/2); g.lineTo(cx-w2*0.95,cy+h*0.08); g.lineTo(cx-w2*0.05,cy+h*0.08);
    g.lineTo(cx-w2*0.45,cy+h/2); g.lineTo(cx+w2*0.95,cy-h*0.10); g.lineTo(cx+w2*0.05,cy-h*0.10); g.closePath(); };

function drawBolts(T){

    const [x,y]=center(b.r,b.c), bob=Math.sin(w/260+b.seed)*S*0.03, fl=0.86+0.14*Math.abs(Math.sin(w/90+b.seed*3));

  kill:(id)=>{const p=pieces.find(q=>q.id===id);
    if(p&&p.alive){p.alive=false;p.move=null;p.queued=null;
      if(p.type==='K'&&!roundBreak) endRound(p.side,now());}},
  teleport:(id,r,c)=>{const p=pieces.find(q=>q.id===id&&q.alive);if(p){p.move=null;p.r=r;p.c=c;}},
  clearCd:(id)=>{const p=pieces.find(q=>q.id===id);if(p)p.cdEnd=0;},
  bot:(on)=>{botEnabled=on!==false;},
  juice:(o)=>{ if(o) for(const k in o) if(k in JUICE) JUICE[k]=o[k]; return Object.assign({},JUICE); },
  deform:(id)=>{const p=pieces.find(q=>q.id===id); return p?deform(p,now()):null;},
  parts:()=>parts.length,
  enter:(id)=>{const p=pieces.find(q=>q.id===id); if(!p) return null;
    const R=pieceRect(p,now()); return {enterAt:p.enterAt, hidden:!!R.hidden, lift:+R.lift.toFixed(1), entered:entered(p,now())};},
  anims:()=>({setup:document.getElementById('setup').getAnimations({subtree:true}).length,
              vs:document.getElementById('vs').getAnimations({subtree:true}).length,
              end:document.getElementById('end').getAnimations({subtree:true}).length}),
  curve:(u)=>+moveCurve(u).toFixed(4),
  botCfg:(o)=>{ if(o){
      if(o.cadMin!==undefined) BOT_CAD_MIN=o.cadMin;
      if(o.cadSpan!==undefined) BOT_CAD_SPAN=o.cadSpan;
      if(o.holdMin!==undefined) BOT_HOLD_MIN=o.holdMin;
      if(o.holdMax!==undefined) BOT_HOLD_MAX=o.holdMax;
      if(o.snipe!==undefined) BOT_SNIPE=o.snipe;
      if(o.blunder!==undefined) BOT_BLUNDER=o.blunder;
      if(o.kingCare!==undefined) BOT_KING_CARE=o.kingCare;
      if(o.noise!==undefined) BOT_NOISE=o.noise; }
    return {holdMin:BOT_HOLD_MIN, holdMax:BOT_HOLD_MAX, cadMin:BOT_CAD_MIN,
            cadSpan:BOT_CAD_SPAN, snipe:BOT_SNIPE, blunder:BOT_BLUNDER,
            kingCare:BOT_KING_CARE, noise:BOT_NOISE}; },
  snap:(v)=>{SNAP=+v||0;return SNAP;},
  fps:()=>fps,
  cfg:()=>({w:COLS,h:ROWS,cool:COOLDOWN/1000,speed:SPEED,pieces:cfg.pieces,flip:cfg.flip,
            diff:cfg.diff, diffKey:DIFFS[cfg.diff].k, started:started}),
  diff:(k)=>{ if(k!==undefined){ const i=typeof k==='number'?k:DIFFS.findIndex(d=>d.k===k);
      if(i>=0){ cfg.diff=i; syncParams(); applyDiff(); paintDiff(); } }
    return Object.assign({i:cfg.diff}, DIFFS[cfg.diff]); },
  path:(id)=>{const p=pieces.find(q=>q.id===id); return p&&p.queued?movePath(p,p.queued[0],p.queued[1]):null;},
  set:(k,v)=>{cfg[k]=v;syncParams();applyCfg();return cfg[k];},
  start:startGame, settings:openSettings, layout:(sd)=>armyLayout(sd||'w'),
  attacked:(r,c)=>attackedByPlayer(r,c),
  /* KFC.vibe({on:0}) is the revert: it re-solves the layout, so the cell the rim was costing
     comes straight back and the frame is byte-identical to the simplifying branch's look. */
  vibe:(o)=>{ if(o){ for(const k in o) if(k in VIBE) VIBE[k]=o[k];
      motes.length=0; skyCv=null; resize(); rasterNow(); }
    return Object.assign({},VIBE); },
  zoneCfg:(o)=>{ if(o){
      if(o.grace!==undefined) GRACE=+o.grace;
      if(o.warn!==undefined)  WARN=+o.warn;
      if(o.step!==undefined)  STEP=+o.step; }
    return {grace:GRACE, warn:WARN, step:STEP, bands:MAX_RING+1}; },
  bands:()=>{ const o=[]; for(let k=0;k<=MAX_RING;k++){ let cells=0;
      for(let i=0;i<ringOf.length;i++) if(ringOf[i]===k) cells++;
      o.push({band:k, cells, eruptAtSec:+((GRACE+WARN+k*STEP)/1000).toFixed(1)}); }
    return o; },
  spikeArt:()=>spikeCv?spikeCv.toDataURL('image/png'):null,
  tactics:()=>tacticsLog.slice(),
  clearTactics:()=>{tacticsLog.length=0; return true;},
  fxKinds:()=>fx.map(f=>f.kind),
  countIn:()=>countIn?Math.round(countIn-now()):0,
  skipCount:()=>{ if(countIn){ countIn=now(); campaign.waitTap=false; } return true; },
  waitTap:()=>!!campaign.waitTap,
  stage:(k)=>{ const P={s3:['#9a8878','#64544a'],s2:['#8a8aa0','#5b5b72'],s1:['#847f90','#5f5a6c']}[k]; if(P){ LIGHT=P[0]; DARK=P[1]; rasterNow(); } return {LIGHT,DARK}; },
  wipe:()=>wipe?{u:+((wall()-wipe.t0)/wipe.dur).toFixed(2), fired:wipe.fired, alpha:+wipeAlpha().toFixed(2)}:null,
  revealed:()=>kitRevealed(),
  menu:openSettings,
  audio:()=>({ctx:!!AUDIO.ctx, state:AUDIO.ctx?AUDIO.ctx.state:'none', on:AUDIO.on,
    running:AUDIO.running, master:AUDIO.master?+AUDIO.master.gain.value.toFixed(3):null}),
  sfx:(big)=>{sfxCapture(!!big); return true;},
  /* Returns a peak-amplitude probe on the master bus. Audio is the one thing here that cannot
     be checked by reading state — a patch can be wired correctly and still be silent. */
  audioTap:()=>{
    if(!AUDIO.ctx) return null;
    const an=AUDIO.ctx.createAnalyser(); an.fftSize=2048;
    AUDIO.comp.connect(an);          // post-limiter: what the speaker actually gets
    const buf=new Float32Array(an.fftSize);
    return ()=>{ an.getFloatTimeDomainData(buf);
      let m=0; for(let i=0;i<buf.length;i++){ const v=Math.abs(buf[i]); if(v>m) m=v; }
      return +m.toFixed(4); };
  },
  soundToggle,
  kingHp:(sd)=>{const k=pieces.find(p=>p.side===sd&&p.type==='K'&&p.alive); return k?k.hp:0;},
  army:(sd)=>pieces.filter(p=>p.side===sd&&p.alive).map(p=>p.type+'@'+p.r+','+p.c),
  over:()=>gameOver,
  /* --- tall-art hooks --- */
  artProbe:()=>{const o={};for(const k of ART_KEYS){const a=art[k];if(!a)continue;
    o[k]={src:a.w+'x'+a.h,bbox:Math.round(a.bw)+'x'+Math.round(a.bh),
      footW:Math.round(a.footW),contactPct:+(100*(a.contact-a.by)/a.bh).toFixed(1),
      drawW:+(a.bw*artScale({side:k[0],type:k[1]})/S).toFixed(3),
      drawH:+(a.bh*artScale({side:k[0],type:k[1]})/S).toFixed(3)};}
    return o;},
  rect:(id)=>{const p=pieces.find(q=>q.id===id);if(!p)return null;const R=pieceRect(p,now());
    return {x:Math.round(R.x),y:Math.round(R.y),w:Math.round(R.w),h:Math.round(R.h),
            cx:Math.round(R.cx),footY:Math.round(R.footY),t:+R.t.toFixed(3),
            lift:Math.round(R.lift), drawnTop:Math.round(R.y-R.lift),
            belowContact:Math.round(R.y+R.h-R.footY),   // the base's front lip, not a sink
            cellBottom:Math.round(R.footY+FOOT_INSET*S)};},
  order:()=>painterList(now()).map(e=>e.p.id),
  /* mirrors pointerdown's precedence exactly, so a test can assert what a tap WOULD do */
  hit:(x,y)=>{
    if(frozen()) return {action:'frozen'};
    const sq=squareAt(x,y);
    if(!sq){const q=hitTall(x,y);return q?{action:'drag',id:q.id}:{action:'deselect'};}
    const p=stationaryAt(sq.r,sq.c);
    if(p&&p.side==='w') return {action:'drag',id:p.id};
    if(selected&&selected.alive){const t=snapTarget(selected,x,y);
      if(t&&isLegal(selected,t[0],t[1])) return {action:'move',tgt:t};}
    const q=hitTall(x,y);
    return q?{action:'drag',id:q.id}:{action:'deselect'};},
  /* no argument reads, null clears, an id selects — `undefined` must NOT be treated as null
     or the getter silently wipes the selection it was asked about */
  sel:(id)=>{if(id!==undefined) selected=id===null?null:pieces.find(q=>q.id===id&&q.alive)||null;
    return selected?selected.id:null;},
  assetsReady:()=>({loaded:Object.keys(art).length,total:ART_KEYS.length,bytes:artBytes,ms:artMs}),
  breakArt:(v)=>{artBroken=v!==false;portraitGen++;return artBroken;},
  usePlaceholder:()=>{for(const k of ART_KEYS) placeholderFor(k); portraitGen++; return true;},
  portraitGen:()=>portraitGen,
  chromeHit:(x,y)=>chromeHit(x,y),
  setInsets:(t,b)=>{insetOverride=(t==null?null:[t,b||0]);resize();rasterNow();return KFC.geom();},
  forceResize:()=>{resize();rasterNow();return KFC.geom();},
  debugDrag:(id,x,y)=>{const p=pieces.find(q=>q.id===id&&q.alive);if(!p)return false;
    drag={p,pid:-1,x,y,sx:x,sy:y,ptype:'touch',moved:true};return true;},
  dropDrag:()=>{drag=null;},
  px:(x,y)=>{const d=ctx.getImageData(Math.round(x*dpr),Math.round(y*dpr),1,1).data;
    return [d[0],d[1],d[2],d[3]];},
  /* Paint one frame synchronously. draw() normally only runs from the rAF loop, which a
     browser pauses whenever its pane is hidden — so a screenshot taken then captures a stale
     or empty canvas and silently looks like a rendering bug. This makes capture independent
     of rAF entirely. */
  paint:()=>{ draw(); return true; },
  splash:()=>{ const sp=document.getElementById('splash'); return sp?(sp.classList.contains('out')?'out':'on'):'gone'; },
  perf:(show)=>{ if(show!==undefined) showPerf=!!show; return {fps:+fpsNow.toFixed(1), ms:+frameMs.toFixed(2), dpr, cap:DPR_CAP, canvas:[canvas.width,canvas.height], show:showPerf}; },
  perfFeed:(dt,count)=>{ for(let i=0;i<count;i++){ perfLast=performance.now()-dt; perfSample(); } return {cap:DPR_CAP, dpr, fps:+fpsNow.toFixed(1)}; },
  dprCap:(v)=>{ if(v!==undefined){ DPR_CAP=v; resize(); } return {cap:DPR_CAP, dpr, canvas:[canvas.width,canvas.height]}; },
  sprites:()=>({lock:!!lockCv, tick:!!tickCv, glow:!!glowCv, base:!!baseCv, lockPx:lockCv?lockCv.width:0}),
  doomed:()=>doomed.map(p=>({id:p.id,type:p.type,side:p.side,alive:p.alive,inMs:Math.round(p.doomAt-wall())})),
  roundMsgT:()=>roundMsg?+(roundMsg.t-now()).toFixed(0):null,
  events:(clear)=>{ const e=evLog.map(x=>({name:x.name, p:x.p, t:x.t})); if(clear) evLog.length=0; return e; },
  trackOn:()=>({on:TRACK_ON, forced:TRACK_FORCE, input:INPUT, id:GA_ID, pushed:window.dataLayer.length,
                loader:!!document.querySelector('script[src*="googletagmanager"]')}),
  kit:()=>({on:kitOn(), trayY, trayOnLayout, tray:kitOn()?trayGeom():null,
            w:kit.w?Object.assign({},kit.w,{bag:kit.w.bag.slice()}):null, b:kit.b?Object.assign({},kit.b,{bag:kit.b.bag.slice()}):null,
            squares:kitOn()?spawnSquares('w').length:0}),
  kitSet:(side,v)=>{ kit[side].charge=v; if(v>=1&&side==='w') kit.w.readyAt=wall(); return kit[side].charge; },
  spawn:(side,r,c)=>doSpawn(side,r,c),
  spawnSquares:(side)=>spawnSquares(side||'w'),
  placing:(on)=>{ if(on!==undefined) kit.w.placing=!!on; return kit.w.placing; },
  shrine:()=>({on:shrine.on, armed:shrineArmed(now()), sq:[SR(),SC()], prog:{w:Math.round(shrine.prog.w),b:Math.round(shrine.prog.b)},
               present:Object.assign({},shrine.present), gone:!shrine.on&&shrine.goneAt>0, wins:Object.assign({},shrine.wins),
               contestedMs:Math.round(shrine.contestedMs), capturedBy:shrine.capturedBy, spent:shrine.spent, look:shrine.look}),
  shrineSet:(side,ms)=>{ shrine.prog[side]=ms; return shrine.prog[side]; },
  bombs:()=>bombs.map(b=>[b.side,b.r,b.c,Math.round(b.at+BOMB.fuse-now())]),
  bomb:(side,r,c)=>doBomb(side,r,c),
  kitSetBomb:(side,v)=>{ kit[side].bomb=v; if(v>=1&&side==='w') kit.w.bombReadyAt=wall(); return kit[side].bomb; },
  bombFuse:(ms)=>{ if(ms) BOMB.fuse=ms; return BOMB.fuse; },
  bombPlacing:(on)=>{ if(on!==undefined) kit.w.bombPlacing=!!on; return kit.w.bombPlacing; },
  bolts:()=>({on:boltsOn(), list:bolts.map(b=>[b.r,b.c,Math.round(now()-b.born)]), nextIn:boltNext?Math.round(boltNext-now()):0}),
  boltAt:(r,c)=>{ bolts.push({r,c,born:now(),seed:0}); return bolts.length; },
  boltClear:()=>{ bolts=[]; boltNext=0; return true; },
  kingLight:(style,alpha,radius)=>{ if(style) KING_LIGHT.style=style; if(alpha!==undefined) KING_LIGHT.alpha=alpha; if(radius!==undefined) KING_LIGHT.radius=radius; klCvs={}; return Object.assign({},KING_LIGHT); },
  shrineArm:()=>{ shrine.spent=false; shrine.on=shrineWanted(); shrine.goneAt=0; shrine.prog.w=shrine.prog.b=0; return shrine.on; }
};

/* font-display:block plus this means the first painted frame already has the real faces. The
   files are data URIs, so there is nothing to wait on but decode. */
if(document.fonts&&document.fonts.load){
  document.fonts.load('24px "Lilita One"');
}
buildParams(); buildDiff();
paintSound();
buildRings();
loadArt();
resize();
openSettings();
requestAnimationFrame(frame);
/* The boot gate. The boot screen stays until everything behind it is finished — fonts, every
   piece decoded (not the placeholders), the splash and the sky decoded, one layout with the
   insets known, the hero and the sky baked, one frame drawn — and the bar has had its time. Then
   BEGIN appears; the tap re-lays out against the settled viewport, draws the title once more,
   and fades the boot screen over it. The only timer is a cap for a genuinely broken decode,
   after which BEGIN appears anyway. */
(function(){
  const sp=document.getElementById('splash'); if(!sp) return;
  const bar=sp.querySelector('.bar i'), begin=document.getElementById('begin');
  const t0=performance.now(), MIN=1400, CAP=9000;
  const splashEl=SCENE_IMG.splash, skyEl=document.getElementById('art-sky');
  const decoded={splash:false, sky:false};
  const dec=(el,k)=>{ if(!el||!el.getAttribute('src')){ decoded[k]=true; return; }
    const done=()=>{ decoded[k]=true; }; (el.decode?el.decode():Promise.resolve()).then(done,done); };
  dec(splashEl,'splash'); dec(skyEl,'sky');
  setupEl.classList.add('first');
  const fontsOk=()=>!document.fonts||document.fonts.status==='loaded';
  const artOk=()=>artMs>0||ART_KEYS.every(k=>art[k]&&art[k].src&&art[k].src.tagName==='IMG');
  const steps=()=>[fontsOk(),artOk(),decoded.splash,decoded.sky];
  let armed=false, gone=false;
  const arm=()=>{
    if(armed) return; armed=true;
    resize(); rasterNow(); heroCv=null; draw();          // the title is finished under the boot screen before BEGIN can be tapped
    if(bar) bar.style.transform='scaleX(1)';
    setTimeout(()=>sp.classList.add('ready'),120);
  };
  const go=()=>{
    if(!armed||gone) return; gone=true;
    audioArm();
    resize(); rasterNow(); heroCv=null; draw();          // against the viewport as it is at the tap
    sp.classList.add('out'); setTimeout(()=>{ sp.remove(); },520);   // .first leaves with the menu, never while it shows
  };
  if(begin) begin.addEventListener('click',go);
  const tick=()=>{
    const st=steps(), done=st.filter(Boolean).length, el=performance.now()-t0;
    const p=Math.min(done/st.length, el/MIN);
    if(bar) bar.style.transform='scaleX('+(0.04+0.96*p).toFixed(3)+')';
    if((done===st.length&&el>=MIN)||el>CAP) arm(); else setTimeout(tick,40);
  };
  Promise.resolve(document.fonts&&document.fonts.ready).then(tick,tick);
})();
</script>
