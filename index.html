/* ================= piece art =================
   Tall pre-rendered pieces: each stands on its own square and pokes up into the row above,
   layering over whatever is behind it.

   Decoded ONCE for the life of the page, then blitted at whatever size the board needs. A
   decoded raster is a textured quad, so drawImage at an arbitrary scale is free — which is
   why there is no re-raster on resize here. Going away with it: the old size guard, the
   sprite debounce, and the blank-flash where sprites were swapped for empty canvases while
   spriteOK still read true. */
const ART_KEYS=['wK','wQ','wR','wB','wN','wP','bK','bQ','bR','bB','bN','bP'];
const ART_DIR='new art/';
const ART_TYPE={K:'King',Q:'Queen',R:'Rook',B:'Bishop',N:'Knight',P:'Pawn'};
const ART_SIDE={w:'Blue',b:'Red'};
const FOOT_INSET=0.18;        // how far the contact line sits above the cell's bottom edge
/* Every piece in this set shares one 356px base and every file sits on a uniform 600x800
   canvas, so a single scale taken from that base sizes the whole army consistently and lets
   the heights fall straight out of the art — King 700px, Queen 642, Bishop 592, Rook 558,
   Knight 533, Pawn 517. 0.68 puts the King at 1.34 cells, the cap we agreed, and everything
   else lands in proportion beneath it. */
const FOOT_W=0.72;            // drawn width of the base, in cells
const MAX_W=1.25, MIN_H=0.80, MAX_H=1.45;   // guards only — at FOOT_W 0.72 nothing clamps
const HEIGHT_MUL={K:1,Q:1,R:1,B:1,N:1,P:1};   // per-type trim on top of the art's own ratio
const art={};                 // key -> {src,w,h,bx,by,bw,bh,footW,footCx,contact}
let artBytes=0, artMs=0, artBroken=false;

/* Three measurements per piece, all from the alpha channel so the export style doesn't matter:
     bbox    — crops the canvas padding, which differs between the 533px and 593px sheets
     footW   — the widest row in the bottom 35%, i.e. the pedestal. Measuring the WHOLE
               silhouette instead would equalise a knight's mane (368px) against a rook's
               tower and leave rooks fat and knights squat.
     contact — where the pedestal ends and the decorative blade begins, found by walking up
               from the bottom to the last row still at 60% of the pedestal width. The blade
               tapers to a single antialiased pixel, so anchoring on the bbox bottom would
               hang every piece off the tip of its own dagger.
   Probed on a downsample: ~6k pixels instead of several MB of ImageData. */
const PROBE_W=64, PROBE_H=96, A_MIN=16;   // premultiplied alpha round-trips 1-3 lossily
function probeArt(src,w,h){
  const cv=document.createElement('canvas');
  cv.width=PROBE_W; cv.height=PROBE_H;
  const c2=cv.getContext('2d',{willReadFrequently:true});
  c2.clearRect(0,0,PROBE_W,PROBE_H);
  try{ c2.drawImage(src,0,0,PROBE_W,PROBE_H); }catch(_){ return null; }
  let d;
  try{ d=c2.getImageData(0,0,PROBE_W,PROBE_H).data; }catch(_){ return null; }
  const span=[];
  let y0=-1,y1=-1,x0=PROBE_W,x1=-1;
  for(let y=0;y<PROBE_H;y++){
    let a0=PROBE_W,a1=-1;
    for(let x=0;x<PROBE_W;x++) if(d[(y*PROBE_W+x)*4+3]>=A_MIN){ if(x<a0)a0=x; if(x>a1)a1=x; }
    span[y]=a1<0?null:{a0,a1,w:a1-a0+1};
    if(a1>=0){ if(y0<0)y0=y; y1=y; if(a0<x0)x0=a0; if(a1>x1)x1=a1; }
  }
  if(y1<0) return null;
  const bh=y1-y0+1;
  let footW=0, footCx=(x0+x1+1)/2;
  for(let y=Math.max(y0,y1-Math.round(bh*0.35));y<=y1;y++)
    if(span[y]&&span[y].w>footW){ footW=span[y].w; footCx=(span[y].a0+span[y].a1+1)/2; }
  if(!footW){ footW=x1-x0+1; }
  let contact=y1;
  for(let y=y1;y>=y0;y--) if(span[y]&&span[y].w>=footW*0.6){ contact=y; break; }
  const sx=w/PROBE_W, sy=h/PROBE_H;
  return {bx:x0*sx, by:y0*sy, bw:(x1-x0+1)*sx, bh:bh*sy,
          footW:footW*sx, footCx:footCx*sx, contact:(contact+1)*sy};
}
function adoptArt(k,src,w,h){
  const m=probeArt(src,w,h);
  if(m) art[k]=Object.assign({src,w,h},m);
  // a king swapping from placeholder to decoded art invalidates that side's banner portrait
  if(m&&k[1]==='K') portraitGen++;
  return !!m;
}
/* Prefer an inlined data URI (a hidden <img> the browser starts decoding during HTML parse,
   before this script runs); fall back to the loose files while iterating; fall back again to
   a procedural stand-in so the board is never empty. */
function artURL(k){
  const el=document.getElementById('art-'+k);
  const s=el&&el.getAttribute('src');
  if(s) return s;
  return ART_DIR+ART_TYPE[k[1]]+'_'+ART_SIDE[k[0]]+'.png';
}
function loadArt(){
  const t0=now();
  let pending=ART_KEYS.length, done=0;
  for(const k of ART_KEYS){
    placeholderFor(k);                    // something correct to draw until the decode lands
    const im=new Image();
    im.onload=function(){
      artBytes+=(im.naturalWidth*im.naturalHeight)>>2;   // rough; exact bytes come from the blob
      adoptArt(k,im,im.naturalWidth,im.naturalHeight);
      if(++done>=pending) artMs=Math.round(now()-t0);
    };
    im.onerror=function(){ if(++done>=pending) artMs=Math.round(now()-t0); };
    im.src=artURL(k);
  }
}
function placeholderFor(k){ const cv=makePlaceholder(k); adoptArt(k,cv,cv.width,cv.height); }
/* Stand-in art until the real PNGs land. Deliberately different heights per type, with a
   proper pedestal, so foot-width scaling and layering are tested against real variation
   rather than eight identical boxes. */
function makePlaceholder(k){
  const side=k[0], type=k[1];
  const HGT={K:264,Q:250,B:236,N:228,R:214,P:196};
  const cv=document.createElement('canvas');
  cv.width=168; cv.height=HGT[type]||228;
  const g=cv.getContext('2d');
  const H2=cv.height, cx=cv.width/2, bot=H2-2;
  const col = side==='w' ? ['#eceafa','#a8a2c8','#5f5a80'] : ['#f6b0a8','#d2544c','#7e2622'];
  const grad=g.createLinearGradient(cx-48,0,cx+48,0);
  grad.addColorStop(0,col[0]); grad.addColorStop(.42,col[1]); grad.addColorStop(1,col[2]);
  g.fillStyle=grad; g.strokeStyle='rgba(18,14,28,.8)'; g.lineWidth=4;
  g.lineJoin='round'; g.lineCap='round';
  const shape=f=>{ g.beginPath(); f(); g.closePath(); g.fill(); g.stroke(); };
  shape(()=>{ g.moveTo(cx-48,bot); g.lineTo(cx+48,bot); g.lineTo(cx+28,bot-44); g.lineTo(cx-28,bot-44); });
  const top=bot-44-H2*0.34;
  shape(()=>{ g.moveTo(cx-26,bot-44); g.lineTo(cx+26,bot-44); g.lineTo(cx+19,top); g.lineTo(cx-19,top); });
  if(type==='K'){
    shape(()=>{ g.moveTo(cx-30,top); g.lineTo(cx+30,top); g.lineTo(cx+22,top-40); g.lineTo(cx+30,top-52);
                g.lineTo(cx+10,top-44); g.lineTo(cx,top-58); g.lineTo(cx-10,top-44);
                g.lineTo(cx-30,top-52); g.lineTo(cx-22,top-40); });
    shape(()=>{ g.rect(cx-4,top-84,8,32); });
    shape(()=>{ g.rect(cx-15,top-74,30,8); });
  }else if(type==='Q'){
    shape(()=>{ g.moveTo(cx-30,top); g.lineTo(cx+30,top); g.lineTo(cx+24,top-46); g.lineTo(cx-24,top-46); });
    for(const d of [-22,0,22]) shape(()=>{ g.arc(cx+d,top-54,9,0,7); });
  }else if(type==='B'){
    shape(()=>{ g.moveTo(cx-26,top); g.quadraticCurveTo(cx-32,top-54,cx,top-76);
                g.quadraticCurveTo(cx+32,top-54,cx+26,top); });
  }else if(type==='N'){
    shape(()=>{ g.moveTo(cx-26,top); g.lineTo(cx-20,top-40); g.lineTo(cx-2,top-64);
                g.lineTo(cx+30,top-56); g.lineTo(cx+34,top-32); g.lineTo(cx+10,top-18);
                g.lineTo(cx+22,top); });
  }else if(type==='R'){
    shape(()=>{ g.moveTo(cx-30,top); g.lineTo(cx+30,top); g.lineTo(cx+30,top-34);
                g.lineTo(cx+16,top-34); g.lineTo(cx+16,top-20); g.lineTo(cx-16,top-20);
                g.lineTo(cx-16,top-34); g.lineTo(cx-30,top-34); });
  }else shape(()=>{ g.arc(cx,top-24,26,0,7); });

}
/* One soft blob, pre-rendered once and squashed per blit. A real radial gradient rather than
   concentric ellipses, which band — and ctx.shadowBlur stays banned, it is brutal on mobile. */
let shadowCv=null;
function makeShadow(){
  const cv=document.createElement('canvas'); cv.width=cv.height=64;
  const g=cv.getContext('2d');
  const rg=g.createRadialGradient(32,32,0,32,32,32);
  rg.addColorStop(0,'rgba(0,0,0,1)'); rg.addColorStop(.5,'rgba(0,0,0,.62)');
  rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg; g.fillRect(0,0,64,64);
  return cv;
}
/* ---- the spike stamp ----
   One spike is a CONE OF REVOLUTION seen from slightly above: it has an elliptical footprint on
   the floor, straight sides running up to a tip, and a barrel of metal between them. That
   footprint is the whole difference between a spike standing on the square and a triangle
   painted on it — a flat triangle gives the eye nothing to place on the ground.

   TILT is the one number that sets the camera. Everything else follows it: the same 0.42 that
   squashes the base ellipse also squashes every contact shadow, so all five cones agree about
   where the floor is and the cluster reads as one object under one camera. */
const SPIKE_TILT=0.42;

     in front of it, and it is the only grounding the stamp has now that the opaque pit is gone.
     Squashed by the same TILT and offset down-right, away from the light. */

     exactly why this reads as solid. */

    g.moveTo(bx-rx,by); g.lineTo(tipX,tipY); g.lineTo(bx+rx,by);

}
/* A quincunx: two at the back, one short one in the middle, two big ones at the front. Painted

   Cell units, and every value including its jitter stays inside 0.03..0.97 so no cone and no
   shadow is ever clipped at the square's edge. */
const SPIKE_LAYOUT=[

  [0.765,0.450,0.058,0.400],
  [0.500,0.630,0.048,0.300],
  [0.200,0.880,0.073,0.470],
  [0.790,0.900,0.073,0.470]

   stamp repeated across all of them reads as wallpaper. Mirrored on odd variants and jittered by
   a seeded PRNG on all of them, so the field looks grown rather than tiled, at no per-frame cost:
   the variant is picked by square position, so each square still costs exactly one blit. */
function drawSpikeCluster(g,S,variant){
  /* Dead ground. A FLAT wash, not a vignette and not a box: uniform alpha means neighbouring
     erupted squares merge into one darker region with no seam anywhere, which is what the old
     opaque rectangle could never do. Black, so it darkens the stone rather than tinting it. */
  g.fillStyle='rgba(6,10,18,.17)'; g.fillRect(0,0,S,S);

let spikeCv=null, spikeTW=0;
function buildSpikeTile(){

    g.setTransform(1,0,0,1,0,0);
    g.clearRect(v*spikeTW,0,spikeTW,spikeTW);

/* Everything behind the board, painted before the shake translate so the light source does not

/* The sky is RASTERED, not painted per frame. The first pass drew it live: a screen-filling

   and none of it changes between resizes — only the motes move. So the whole static part bakes

   Worth recording how this was caught, because the obvious measurement lied: timing ctx calls in

let skyCv=null;
function paintSky(){

function buildSky(){
  if(!VIBE.on||!(W>0&&H>0)||S<=0){ skyCv=null; return; }

  cv.width=Math.max(1,Math.round(W*dpr)); cv.height=Math.max(1,Math.round(H*dpr));

  g.addColorStop(0,VIBE.skyTop); g.addColorStop(0.46,VIBE.skyMid); g.addColorStop(1,VIBE.skyBot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

     blurred copy — down and up through a small canvas, twice — masked by a radial falloff round
     the board, so the islands stay crisp at the edges of the screen and hazy behind the play.
     No ctx.filter: iOS. */
  const im=sceneImg('sky');
  if(im){
    const f=coverFit(im.naturalWidth,im.naturalHeight,W,H,SCENE.sky);
    ctx.imageSmoothingQuality='high'; ctx.drawImage(im,f.dx,f.dy,f.dw,f.dh);
    const k=6, sw=Math.max(1,Math.round(W/k)), sh=Math.max(1,Math.round(H/k));

    const sg=small.getContext('2d'); sg.imageSmoothingQuality='high'; sg.drawImage(cv,0,0,cv.width,cv.height,0,0,sw,sh);
    const tiny=document.createElement('canvas'); tiny.width=Math.max(1,Math.round(sw/2)); tiny.height=Math.max(1,Math.round(sh/2));
    const tg=tiny.getContext('2d'); tg.imageSmoothingQuality='high'; tg.drawImage(small,0,0,tiny.width,tiny.height);
    sg.clearRect(0,0,sw,sh); sg.drawImage(tiny,0,0,sw,sh);

     not touch at full brightness — the gold frame sits in this shade and separates world from

  { const Rb=Math.hypot(S*COLS,S*ROWS)/2;
    const sp=ctx.createRadialGradient(cx,cy,Rb*0.9,cx,cy,Rb*2.1); sp.addColorStop(0,'rgba(8,16,36,.34)'); sp.addColorStop(1,'rgba(8,16,36,0)');

/* Ambient drift. It lives behind the board on purpose: the board already talks to you through
   motion — trails, retracting arrows, the cooldown veil, the spike blink — and putting more
   moving things on the play surface is where atmosphere turns into noise. Behind the slab it is
   only ever visible in the band above and the strip below, which is exactly where a scene wants
   depth and nothing needs reading. */
let motes=[], moteT=0;
/* Sparkles: white and pale gold, drifting UP the sky, one in four a four-point glint. */
function newMote(y){
  const warm=Math.random()<0.45;
  return {x0:Math.random()*W, x:0, y, ph:Math.random()*6.283,
    vy:-(6+Math.random()*14), amp:5+Math.random()*14, sw:0.5+Math.random()*0.9,
    r:0.9+Math.random()*1.9, a:0.35+Math.random()*0.65, glint:Math.random()<0.25,
    col: warm ? '#fff3b0' : '#ffffff'};
}
function drawMotes(){
  if(!vibeOn('motes')){ motes.length=0; return; }
  const w=wall();
  const dt=Math.min(50, moteT?w-moteT:16)/1000; moteT=w;
  while(motes.length<VIBE.motes) motes.push(newMote(Math.random()*H));
  if(motes.length>VIBE.motes) motes.length=VIBE.motes;
  ctx.save();
  for(const m of motes){
    m.y+=m.vy*dt; m.ph+=dt*m.sw;
    m.x=m.x0+Math.sin(m.ph)*m.amp;

    if(m.glint){ const L=m.r*3.2; ctx.strokeStyle=m.col; ctx.lineWidth=Math.max(0.8,m.r*0.45); ctx.beginPath();

}
/* The arena rim. The board edge is the only real estate a stadium look can use here — there are

function drawFrame(BW,BH){
  const fw=vibeOn('frame')?VIBE.frameW:0; if(!fw) return;
  const x=ox-fw, y=oy-fw, w=BW+2*fw, h=BH+2*fw, r=Math.max(4,fw*1.5);
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'#ffe28a'); g.addColorStop(.30,'#f4b73a');
  g.addColorStop(.72,'#c78a1f'); g.addColorStop(1,'#7a4d10');
  /* An ink outline round the whole plate first — the art outlines everything. */

function drawFrameTrim(BW,BH){
  const fw=vibeOn('frame')?VIBE.frameW:0; if(!fw) return;

/* the checkerboard never changes — cache it and blit one image per frame */
let boardCv=null;
function rebuildBoard(){

    b.fillStyle = (r+c)%2===0 ? LIGHT : DARK;
    b.fillRect(c*S,r*S,S,S);
  }
  /* Tile depth. Every tile is a cut stone with a lit top-left lip and a shadowed bottom-right
     one, matching the light baked into the art — board and pieces disagreeing about the light
     is the one flaw no amount of bevel quality rescues. Still restrained: 77 cells of loud
     edging behind tall pieces reads as pasted-on. */
  const bev=Math.max(1/dpr,Math.round(S*.055*dpr)/dpr);   // a whole number of device pixels: the veil uses the same

    b.fillStyle='rgba(10,6,16,.10)';                  // grout, so tiles read as separate stones

     reachable, which is what makes king capture a real objective rather than a stalemate. */
  if(!VIBE.on) return;
  /* Material, baked once per resize rather than per frame. Grain first so the sheen and the
     vignette sit over it, seeded off the board size so it is stable between rebuilds at the same

  if(VIBE.floorGrain>0){

    vg.addColorStop(1,'rgba(9,5,18,'+VIBE.floorPool.toFixed(3)+')');

/* ================= layout ================= */
/* Layout is recomputed instantly, but re-rasterising is debounced: mobile browsers
   resize continuously while the URL bar animates, and rebuilding sprites on every
   one of those frames is what killed performance. Stale sprites just scale. */
let rasterAt=0, rasterPending=false;

/* The reserve above row 0 is derived from the SIZING CONSTANTS, not from measured art: the
   tallest piece the clamps permit rises (MAX_H - 1 + FOOT_INSET) cells above its own cell.
   Deriving it this way means retuning FOOT_W or MAX_H moves the banner automatically, and
   layout never waits on an async decode. */
const OVERHANG_CELLS=MAX_H-1+FOOT_INSET;
/* These are the chrome, and on a 5-wide board they were the only thing standing between the
   squares and the edges of the screen. The width allowed a 76px cell; the height only paid for
   69, and the difference was sitting in two 22px gaps, a 10px safety band and a 16px button pad
   — 70px of nothing. Cut to what the layout actually needs, the cell reaches its width limit and
   the board fills the screen. B_MIN follows: at 56 the banner still carries a 32px disc with a
   readable label under it, and the board is what the thumb is aiming at. */
const PAD_T=6, GAP=8, BAND=4, B_MIN=48, B_MAX=62;
/* One row (glyphs and the tracker) in a trial; two in a match, the counters beneath. The strip

let rowsOnLayout=1;

let safeTop=0, safeBot=0, insetOverride=null;
const saEl=document.getElementById('sa');
function readInsets(){
  if(insetOverride){ safeTop=insetOverride[0]; safeBot=insetOverride[1]; return; }
  const cs=getComputedStyle(saEl);

  safeBot=Math.round(parseFloat(cs.paddingBottom)||0);
}
function resize(){
  W=window.innerWidth; H=window.innerHeight;
  dpr=Math.min(DPR_CAP, window.devicePixelRatio||1);
  canvas.width=Math.max(1,Math.round(W*dpr));
  canvas.height=Math.max(1,Math.round(H*dpr));
  readInsets();          // re-read every time: fullscreen zeroes them, rotation swaps them
  /* Solve for the cell size directly rather than guessing it from the width first.
     The whole vertical budget is
         BANNER_H + S*(ROWS + OVERHANG_CELLS) + K  <=  H     (K has no button strip in it now)
     where K is the chrome that never scales — insets, the top pad, both gaps, the button strip
     and the safety band. So the largest board is the one you get with the banners at their
     floor, and whatever the board does not need goes back to the banners.

     The old order derived a provisional Sw from the WIDTH, sized the banners against that, and
     only then computed S. That is fine while the width binds. On a 5-wide board the HEIGHT
     binds instead: Sw overstates the real cell by a third, and everything scaled from it — the
     crown reserve above the board most of all — then reserves room for a cell the board never
     gets, leaving the squares smaller than the screen can actually hold. */

   is clamped inside the board so a king on the back rank still shows it. */
/* A soft halo behind the king's cross. The cross is the one part of a king that stays visible
   when a piece standing one row in front covers its body, so that is where the mark goes: a

   the board behind it rather than painting a disc on top; static, so it never competes with the

function drawTrail(p,T){
  if(!JUICE.on||JUICE.trail<=0) return;
  let from, dur, u, alpha=JUICE.trail;
  if(p.move){ from=[p.move.fr,p.move.fc]; dur=p.move.dur; u=Math.max(0,Math.min(1,(T-p.move.start)/dur)); }
  else{

       cdStart is written at the moment of arrival, which is exactly the clock this needs. */
    if(!p.lastFrom||!p.cdStart) return;
    const age=T-p.cdStart; if(age<0||age>=JUICE.trailLinger) return;
    from=p.lastFrom; dur=p.lastDur; u=1; alpha*=1-age/JUICE.trailLinger;
  }
  const [x0,y0]=center(from[0],from[1]), [x1,y1]=center(p.r,p.c);
  const total=Math.hypot(x1-x0,y1-y0); if(total<1) return;

     used to substitute a length of its own, half the path: on a three-square move that was four
     times what the tail actually had on its final airborne frame, so the trail visibly POPPED
     back to life at the exact instant the piece stopped. Landing now changes nothing but alpha,
     which is the whole of what a fade-out is.
     Recent displacement along the EASED curve is what a trail is — floored, so the tail keeps
     reading the direction while the ease-out slows the piece into its square. */
  const back=Math.max(0,u-JUICE.trailMs/dur);
  const disp=Math.max(0,moveCurve(u)-moveCurve(back));
  let len=Math.max(JUICE.trailMin*S, Math.min(disp*total, JUICE.trailMax*S));
  len=Math.min(len, total);                       // never longer than the move itself

  ctx.translate(pos.x,pos.y); ctx.rotate(Math.atan2(y1-y0,x1-x0));

  g.addColorStop(1,'rgba(236,236,242,'+alpha.toFixed(3)+')');
  ctx.fillStyle=g; ctx.fillRect(-len,-w/2,len,w);
  ctx.restore();
}
/* The crown glow was a fresh radial gradient per king per frame. It is one sprite per board

let glowCv=null, glowS=0, glowDpr=0, glowK=-1;
function buildGlow(){
  glowS=S; glowDpr=dpr; glowK=JUICE.kingGlow;

  const g=glowCv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);

  grad.addColorStop(0.42,'rgba(255,226,150,'+(JUICE.kingGlow*0.42).toFixed(3)+')');
  grad.addColorStop(1,   'rgba(255,215,130,0)');

function drawKingGlow(R){

function drawShadow(cx,footY,rx,ry,alpha){

/* Back-to-front. The old build drew stationary pieces in SPAWN order and then every mover on
   top of them — fine for flat art sitting in boxes, and completely wrong the moment a piece
   is tall enough to stand in front of its neighbour. */
function painterList(T){
  const L=[];
  for(const p of pieces){
    if(!p.alive) continue;
    const R=pieceRect(p,T);
    let k=R.footY;
    if(p.move&&R.t>0&&R.t<1) k+=0.15*S;   // a mover wins near-ties on its own row
    L.push({p,R,key:Math.round(k*2)/2});  // quantised: float jitter would pop the order
  }
  L.sort((a,b)=>a.key-b.key||a.p.r-b.p.r||a.p.c-b.p.c||a.p.id-b.p.id);

/* Pickup only — destinations are still resolved strictly on the grid by snapTarget. Above a

function hitTall(x,y){
  const L=painterList(now());
  for(let i=L.length-1;i>=0;i--){
    const p=L[i].p, R=L[i].R;
    if(p.side!=='w'||p.move) continue;
    if(drag&&p===drag.p) continue;
    const half=(y>=R.footY-(1-FOOT_INSET)*S ? R.w : R.w*0.6)/2;
    if(x>=R.cx-half&&x<=R.cx+half&&y>=R.y&&y<=R.footY) return p;

function drawArrow(r0,c0,r1,c1,color,bowed,from,cast){

/* What line, if any, this piece is currently drawing.

   A queued move draws the arrow it is waiting to run. A move ALREADY IN FLIGHT draws what is
   left of it: the tail eaten forward by the piece until tail and head meet on the destination.
   So every move draws a line now, not only the ones that had to be queued — you drop a piece
   and watch the line get spent, which is the part that used to be missing. Before this, the
   arrow was deleted the instant the move fired, so the one moment the line was describing
   something actually happening was the one moment it was not on screen.

   In flight the bow is off. The piece travels in a straight line, and a bowed arrow would leave
   its tail hanging half a square off the sprite it is supposed to be attached to. */
/* Exactly ONE arrow in the game needs bending, and it is not "any short move": it is the move
   one square straight up. Every piece is drawn taller than its square and overhangs the row
   above, so the destination of a one-up move sits behind the mover's own crown and a straight
   arrow to it is buried end to end. A one-square sideways or diagonal arrow has clear air to
   cross and never needed the help.
   Bending every short move was also what made arrows change shape the instant one fired, because
   in flight the bow was switched off — two answers to the same question, swapped mid-move. The
   bow is a property of the MOVE now, so a premove and the move it becomes are the same line. */
function arrowBows(fr,fc,tr,tc){ return tr-fr===-1 && tc===fc; }
function moveArrow(p,T){
  if(!p.alive||(p.side!=='w'&&!enemyArrowsOn())) return null;
  if(p.move){
    const u=Math.max(0,Math.min(1,(T-p.move.start)/p.move.dur));
    const done=moveCurve(u);                 // the EASED progress, so the tail tracks the sprite
    return {fr:p.move.fr, fc:p.move.fc, tr:p.r, tc:p.c, from:done, hold:false, cast:p.castAt||0,
            bowed:arrowBows(p.move.fr,p.move.fc,p.r,p.c),
            ink:(p.side==='w'?'rgba(120,170,255,':'rgba(255,106,92,')+(0.88*Math.min(1,(1-done)/0.22)).toFixed(3)+')'};
  }
  if(p.queued) return {fr:p.r, fc:p.c, tr:p.queued[0], tc:p.queued[1], from:0, hold:true, cast:p.castAt||0,

}
/* One filled ribbon, tapering from a narrow tail into the head, laid along a quadratic curve.
   It replaces a dashed stroke with round caps, which at this width produced a row of lozenges —
   sausage links, and they read as a dotted route rather than one committed line.

   The curve exists for the one-square move. Drawn straight, a one-square arrow is 76px long
   with 26px eaten by the tail offset and 23px by the head, leaving a 27px stub squeezed between
   the piece it comes from and the tint it points at: the worst-looking mark in the game, and
   also the commonest move. Bowing it out to the side buys a path the eye can follow at the same
   distance. The bow is scaled off the length and is fully gone by two and a bit squares, so
   every longer arrow is exactly the straight line it was. */
/* The cast surge. The arrow appears instantly, as before; then for SURGE.ms a window of light
   runs the ribbon from tail to head along the same arc-length parametrisation the taper uses,
   and as it arrives the head pops to 1.18x with a faint flash and settles over SURGE.popMs. Kept
   quiet on purpose: the first cut drew more attention than the move it announced.
   Drawn inside the ribbon's own clip, so the two passes compose exactly as the ribbon does.
   Wall time, so it never stalls in a hit-stop. */
const SURGE={ms:220, popMs:180};
function drawArrowXY(x0,y0,x1,y1,color,bowed,from,cast){
  const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy);
  if(L<1) return;
  let nx=-dy/L, ny=dx/L;
  /* A fixed bow, not a ramp off the length. It only ever applies to the one-square-up case now,
     so there is no range of lengths left to interpolate across — and a ramp is what let the same
     arrow have two shapes. */
  const bow = bowed ? S*0.46 : 0;
  const mx=(x0+x1)/2, my=(y0+y1)/2;
  /* Bow toward the middle of the board. The alternative — always bowing the same way round —
     puts the arc off the edge for any piece on a rim, which is where half of them stand. */
  const toC=(ox+S*COLS/2-mx)*nx+(oy+S*ROWS/2-my)*ny;
  if(toC<0){ nx=-nx; ny=-ny; }
  /* A quadratic's midpoint is halfway between its chord's midpoint and its control point, so a
     control at 2*bow puts the crest at exactly bow. */
  const kx=mx+nx*bow*2, ky=my+ny*bow*2;
  const at=t=>{ const u=1-t;
    return [u*u*x0+2*u*t*kx+t*t*x1, u*u*y0+2*u*t*ky+t*t*y1]; };
  const tan=t=>{ const a=2*(1-t), b=2*t;
    return [a*(kx-x0)+b*(x1-kx), a*(ky-y0)+b*(y1-ky)]; };
  /* Arc length, so the tail clearance and the head both measure along the CURVE. Measured off
     the chord they would be wrong by the whole bow on exactly the arrows that need the bow. */
  const N=26, pts=[], cum=[0];
  for(let i=0;i<=N;i++) pts.push(at(i/N));
  for(let i=1;i<=N;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const total=cum[N], m=S*0.34, hl=S*0.30, hw=S*0.30;

  const tAt=len=>{ for(let i=1;i<=N;i++) if(cum[i]>=len){
      const f=(len-cum[i-1])/((cum[i]-cum[i-1])||1); return (i-1+f)/N; } return 1; };
  /* The tail slides forward along the SAME arc-length parametrisation the clearance uses, so a
     retracting arrow shortens at the rate the piece actually travels rather than at the rate a
     straight-line approximation says it does. */
  const headBase=total-hl;
  const tail=Math.min(headBase, m+(from||0)*Math.max(0,headBase-m));
  ctx.fillStyle=color;
  if(headBase-tail>2){
    const t0=tAt(tail), t1=tAt(headBase);
    const K=20, w=S*0.155, lft=[], rgt=[];
    for(let i=0;i<=K;i++){
      const t=t0+(t1-t0)*i/K;
      const [x,y]=at(t), [tx,ty]=tan(t), tl=Math.hypot(tx,ty)||1;
      const ax=-ty/tl, ay=tx/tl, half=w*(0.55+0.45*i/K)/2;   // the taper
      lft.push([x+ax*half,y+ay*half]); rgt.push([x-ax*half,y-ay*half]);
    }
    ctx.beginPath(); ctx.moveTo(lft[0][0],lft[0][1]);
    for(let i=1;i<=K;i++) ctx.lineTo(lft[i][0],lft[i][1]);
    for(let i=K;i>=0;i--) ctx.lineTo(rgt[i][0],rgt[i][1]);
    ctx.closePath(); ctx.fill();
    const [sx,sy]=at(t0);                                  // a rounded tail, not a chopped one
    ctx.beginPath(); ctx.arc(sx,sy,w*0.55/2,0,7); ctx.fill();
    /* The pulse: a short window of white light, brightest at its centre, sliding from the tail
       to the base of the head. Drawn as a few segments so the ends fade rather than chop. */
    const age=cast?wall()-cast:-1;
    if(age>=0&&age<SURGE.ms){
      const u=1-Math.pow(1-age/SURGE.ms,2), sc=tail+u*(headBase-tail), half=S*0.30, K2=10;
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
      for(let pass=0;pass<2;pass++){
        for(let i=0;i<K2;i++){
          const a0=sc-half+(2*half)*i/K2, a1=sc-half+(2*half)*(i+1)/K2;
          if(a1<tail||a0>headBase) continue;
          const p0=at(tAt(Math.max(tail,a0))), p1=at(tAt(Math.min(headBase,a1)));
          const mid=(a0+a1)/2, fall=1-Math.abs(mid-sc)/half;
          ctx.globalAlpha=(pass?0.60:0.18)*Math.max(0,fall);
          ctx.lineWidth=pass?w*0.75:w*1.5;
          ctx.strokeStyle=pass?'#eef5ff':'#bfe0ff';
          ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.stroke();
        }

    }
  }
  const [ex,ey]=tan(1), el=Math.hypot(ex,ey)||1;           // the head rides the END tangent
  /* The head pops as the pulse arrives: 1.18x with a faint flash, settling over SURGE.popMs. */
  const hage=cast?wall()-cast-SURGE.ms:-1;
  const pk=(hage>=0&&hage<SURGE.popMs)?Math.pow(1-hage/SURGE.popMs,2):0;
  const hl2=hl*(1+0.18*pk), hw2=hw*(1+0.18*pk);
  const hx=ex/el, hy=ey/el, bxh=x1-hx*hl2, byh=y1-hy*hl2;
  ctx.beginPath(); ctx.moveTo(x1,y1);
  ctx.lineTo(bxh-hy*hw2/2, byh+hx*hw2/2);
  ctx.lineTo(bxh+hy*hw2/2, byh-hx*hw2/2);
  ctx.closePath(); ctx.fill();
  if(pk>0){ ctx.save(); ctx.globalAlpha=0.42*pk; ctx.fillStyle='#ffffff'; ctx.fill(); ctx.restore(); }
}

/* ================= player banners =================
   Two commander plates filling the space the board leaves above and below. Carved pewter with
   brass trim, lit from the top-left exactly like the pieces and the board bevels — the light
   direction is shared on purpose; banners lit differently from the board is the one flaw no
   amount of ornament rescues. Each plate carries a small accent rail on the edge FACING the
   board, which is what distinguishes the two rather than flipping the light.
   The portrait is the side's own King, so the face in your banner is literally the piece whose
   death wipes your army. */
const BRASS='#f4b73a', BRASS_DK='#c78a1f';   // the art's gold: the rims, the pips, the cards

   weight prefix would ask the browser to synthesise a fake bold on a face that is already
   heavy — it is left off deliberately. The panels' headings use Cinzel from CSS; nothing on the

const DISP='"Lilita One",system-ui,sans-serif';

function chunky(text,x,y,px,fill,o){

  ctx.font=disp(px); ctx.lineJoin='round'; ctx.lineWidth=sw; ctx.strokeStyle=ink;

  ctx.strokeText(text,x,y);

/* A line of display text that fits a width: shrink from px toward min, and if it still does not
   fit and may wrap, break at the space nearest the middle and shrink again. Sets ctx.font as it
   measures; callers set their own after. */
function fitDisp(text,maxW,px,min,allowWrap){
  const fits=(lines,size)=>{ ctx.font=disp(size); return lines.every(l=>ctx.measureText(l).width<=maxW); };
  let size=px; while(size>min&&!fits([text],size)) size-=1;
  if(fits([text],size)||!allowWrap) return {lines:[text],size:Math.max(size,min)};
  let best=-1,bd=1e9; for(let k=0;k<text.length;k++) if(text[k]===' '){ const d=Math.abs(k-text.length/2); if(d<bd){ bd=d; best=k; } }
  if(best<0) return {lines:[text],size:Math.max(size,min)};
  const lines=[text.slice(0,best),text.slice(best+1)];
  size=px; while(size>min&&!fits(lines,size)) size-=1;

const SIDE_ACCENT={w:'#2d7fe8', b:'#e0463a'};
const SIDE_ACC_LT={w:'#8fd0ff', b:'#ff9a86'};
const HAS_LS=('letterSpacing' in ctx);
/* portraitGen survives the portraits themselves: the art pipeline bumps it whenever a sprite

let portraitGen=0;

let D_ADV=0, D_FONT='';
function digitAdv(font){
  if(font===D_FONT) return D_ADV;

  let m=0; for(let d=0;d<10;d++) m=Math.max(m,ctx.measureText(String(d)).width);

/* One geometry function for the renderer AND the harness — the same discipline as pieceRect.

   Two plates meant the score was in two places and the player had to look away from the board
   twice to read it; the match state is a single fact — 1-2 — and it belongs in a single line.
   It also hands the board back the ~57px the bottom plate was holding. Each side's pips grow
   from its OWN portrait toward the middle, so the two meters close on the "vs." as the match
   tightens, and neither reads as a continuation of the other. */
function bannerGeom(){
  const B=BANNER_H, y=topBanY, rows=bannerRows();

     take the lower third. The tracker text shares the glyphs' row, between them. */
  const cy=Math.round(rows===2 ? y+B*0.33 : y+B/2), cyP=Math.round(y+B*0.78);
  const sx=ox, sw=S*COLS;
  const Di=Math.round(Math.min(B*0.56,44));
  const pad=Math.round(B*0.30);                      // glyph to the first counter
  const gapMid=Math.round(B*0.34);                   // the halfway gap the hairline sits in
  const l0=sx+Di+pad, r1=sx+sw-Di-pad;
  const half=Math.max(24, Math.round((r1-l0-gapMid)/2));
  const pipH=Math.max(8,Math.round(B*(rows===2?0.20:0.30)));
  const by=Math.round((rows===2?cyP:cy)-pipH/2);

    strip:{x:sx,y,w:sw,h:B},
    home:{cx:Math.round(sx+Di/2),    cy, r:Di/2, d:Di},
    snd: {cx:Math.round(sx+sw-Di/2), cy, r:Di/2, d:Di},
    mid: {cx:Math.round(sx+sw/2),    cy:(rows===2?cyP:cy), h:pipH},
    text:{cx:Math.round(sx+sw/2),    cy, avail:(sx+sw-Di-pad*0.6)-(sx+Di+pad*0.6)},
    /* flip: whose counter is slot 0. Each side's score grows out of its OWN end, so the two
       meters close on the middle as the match tightens and neither reads as a continuation of
       the other — the halfway hairline is the only thing between them. */
    sides:{
      w:{bar:{x:l0,        y:by, w:half, h:pipH}, flip:false},

/* The chassis both flanking buttons share, cut from the same brass and pewter as the plate so

  ctx.lineTo(cx-6.4*u, cy+1.0*u); ctx.lineTo(cx-6.4*u, cy-0.2*u);
  ctx.lineTo(cx-9.2*u, cy-0.2*u); ctx.closePath(); ctx.fill();
  ctx.beginPath();                                   // body
  ctx.moveTo(cx-6.0*u, cy+0.4*u); ctx.lineTo(cx+6.0*u, cy+0.4*u);
  ctx.lineTo(cx+6.0*u, cy+8.0*u); ctx.lineTo(cx-6.0*u, cy+8.0*u);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(8,16,36,.55)';                 // the door
  ctx.beginPath();
  ctx.moveTo(cx-2.3*u, cy+8.0*u); ctx.lineTo(cx-2.3*u, cy+2.4*u);
  ctx.lineTo(cx+2.3*u, cy+2.4*u); ctx.lineTo(cx+2.3*u, cy+8.0*u);
  ctx.closePath(); ctx.fill();
}
/* A speaker cone and two arcs — or a cross where the arcs were, when the sound is off. */
function sndGlyph(cx,cy,r,col){
  const u=r/10;
  ctx.fillStyle=col; ctx.strokeStyle=col;
  ctx.beginPath();
  ctx.moveTo(cx-7.4*u, cy-2.6*u); ctx.lineTo(cx-3.6*u, cy-2.6*u);
  ctx.lineTo(cx+0.6*u, cy-7.4*u); ctx.lineTo(cx+0.6*u, cy+7.4*u);
  ctx.lineTo(cx-3.6*u, cy+2.6*u); ctx.lineTo(cx-7.4*u, cy+2.6*u);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth=Math.max(1.2,1.7*u); ctx.lineCap='round';
  if(AUDIO.on){
    for(const [rad,arc] of [[3.6,0.9],[6.4,0.8]]){
      ctx.beginPath(); ctx.arc(cx+0.9*u, cy, rad*u, -arc, arc); ctx.stroke();
    }
  }else{
    ctx.beginPath();
    ctx.moveTo(cx+3.2*u, cy-3.2*u); ctx.lineTo(cx+7.6*u, cy+3.2*u);
    ctx.moveTo(cx+7.6*u, cy-3.2*u); ctx.lineTo(cx+3.2*u, cy+3.2*u);
    ctx.stroke();
  }
}
/* Three sockets a side, one per round. A smooth bar implied continuous progress; a score that
   can only ever be 0, 1, 2 or 3 deserves an instrument that can only be those things too.
   The glint is ONE wave crossing all six sockets left to right every five seconds — it lights
   only what has been WON, so the banner sparkles more the closer the match is to over. Wall
   time, so it keeps running through a hit-stop. */
function drawBanner(){
  const G=bannerGeom(), B=G.h;
  /* A trial that is not a match shows no counters at all: the banner is the two glyphs and
     nothing else. The duel keeps its six. (A trial tracker was tried up here and read as
     clutter; the path screen and the CLEAR line are where the ladder lives.) */
  if(!(campaign.active&&campaign.level&&!campaign.level.rounds)){
    drawPips(G,B);
    /* The halfway mark. One hairline is the whole of what the plate, the "vs." and the split rail
       were between them saying: your three on this side, theirs on that one. */
    ctx.strokeStyle='rgba(255,226,138,.75)'; ctx.lineWidth=Math.max(1.5,S*0.022);
    ctx.beginPath();
    ctx.moveTo(G.mid.cx, G.mid.cy-G.mid.h*0.62);
    ctx.lineTo(G.mid.cx, G.mid.cy+G.mid.h*0.62);
    ctx.stroke();
  }
  /* Bare glyphs, no chassis. Held at 62% so they read as the secondary controls they are —
     with the plate gone, a full-brightness icon would outweigh the score beside it. */
  const gr=Math.max(7,Math.round(G.home.d*0.29));
  homeGlyph(G.home.cx,G.home.cy,gr,'rgba(238,232,220,.80)');
  sndGlyph(G.snd.cx,G.snd.cy,gr,AUDIO.on?'rgba(238,232,220,.80)':'rgba(238,232,220,.38)');
  /* The tracker, on the glyphs' row between them: a small brass line of chapter and trial in
     spaced capitals, and the trial's name beneath it in cream. In the sandbox it names the
     sandbox and the difficulty. Sized to the room between the glyphs, never wider. */
  if(campaign.active&&campaign.level){
    const L=campaign.level, T=G.text;
    const l1 = campaign.sandbox ? '1V1 SANDBOX \u00B7 '+DIFFS[cfg.diff].label.toUpperCase()
                                : (()=>{ const ch=chapterOf(campaign.idx); return 'CHAPTER '+ch.n+' \u00B7 TRIAL '+(campaign.idx-ch.from+1)+'/'+ch.count; })();
    const l2 = campaign.sandbox ? 'FIRST TO THREE' : L.title;
    let f1=Math.max(9,Math.round(B*(G.rows===2?0.145:0.17))), f2=Math.max(12,Math.round(B*(G.rows===2?0.23:0.27)));
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const capsFont=f=>'800 '+f+'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    const fit=(txt,f,sp,capsF)=>{ ctx.font=capsF?capsFont(f):disp(f); let w=ctx.measureText(txt).width+sp*(txt.length-1); return w; };
    while(f1>8&&fit(l1,f1,f1*0.16,true)>T.avail) f1--;
    while(f2>10&&fit(l2,f2,0,false)>T.avail) f2--;
    const y1=T.cy-f2*0.58, y2=T.cy+f1*0.66;
    ctx.font=capsFont(f1);
    ctx.fillStyle='rgba(20,27,51,.8)'; spacedText(l1,T.cx,y1+1.5,f1*0.16);
    ctx.fillStyle='#ffe28a'; spacedText(l1,T.cx,y1,f1*0.16);
    ctx.font=disp(f2*1.12);
    ctx.lineWidth=Math.max(2.5,f2*0.18); ctx.lineJoin='round'; ctx.strokeStyle='#141b33'; ctx.strokeText(l2,T.cx,y2);
    ctx.fillStyle='#ffffff'; ctx.fillText(l2,T.cx,y2);
  }
}
function drawPips(G,B){
  const SWEEP_EVERY=5000, SWEEP_MS=760;
  const ph=wall()%SWEEP_EVERY, sweeping=ph<SWEEP_MS;
  const span0=G.sides.w.bar.x, span1=G.sides.b.bar.x+G.sides.b.bar.w, span=span1-span0;
  // the band enters before the first socket and leaves after the last, so it visibly arrives
  const reach=Math.max(8,span*0.11);
  const bandX=span0-reach+(ph/SWEEP_MS)*(span+2*reach);
  for(const side of ['w','b']){
    const Bar=G.sides[side].bar, flip=G.sides[side].flip, val=points[side];
    const acc=SIDE_ACCENT[side], accLt=SIDE_ACC_LT[side];
    const gp=Math.max(3,Math.round(Bar.h*0.34));
    const pw=(Bar.w-gp*(WIN_POINTS-1))/WIN_POINTS, rr2=Math.min(Bar.h/2,pw/2);
    // the socket just won pulses, so a point that lands is felt rather than merely displayed
    const fresh = roundMsg&&roundMsg.winner===side&&now()>=roundMsg.t ? Math.max(0,1-(now()-roundMsg.t)/700) : 0;
    for(let i=0;i<WIN_POINTS;i++){
      const slot = flip ? WIN_POINTS-1-i : i;
      const px=Bar.x+slot*(pw+gp), won=i<val;
      /* An empty counter is a faint well in the background, not a brass socket. On the plate the
         sockets needed a rim to read as recesses; on the background they only need to be visible
         enough to say how many are still to play for. */
      ctx.fillStyle='rgba(8,16,36,.55)'; rrect(px,Bar.y,pw,Bar.h,rr2); ctx.fill();
      if(won){
        const fg=ctx.createLinearGradient(0,Bar.y,0,Bar.y+Bar.h);
        fg.addColorStop(0,accLt); fg.addColorStop(.45,acc); fg.addColorStop(1,acc);
        ctx.fillStyle=fg; rrect(px,Bar.y,pw,Bar.h,rr2); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.30)';
        rrect(px+rr2*0.5,Bar.y+Bar.h*0.14,Math.max(2,pw-rr2),Bar.h*0.28,Bar.h*0.14); ctx.fill();
        const k=sweeping ? Math.max(0,1-Math.abs(bandX-(px+pw/2))/reach) : 0;
        const lit=Math.max(k*0.62, (fresh>0&&i===val-1)?fresh:0);
        if(lit>0){ ctx.globalAlpha=lit; ctx.fillStyle='#fff'; rrect(px,Bar.y,pw,Bar.h,rr2); ctx.fill(); ctx.globalAlpha=1; }
      }
      /* Brass rims, bright on a counter you have won and dark on one still to play for. The HUD
         stays minimal in QUANTITY — six counters, a hairline, two glyphs — and changes only what
         it is made of, so it belongs to the same arena as the plaques without gaining bulk. */
      ctx.strokeStyle=won?BRASS:BRASS_DK; ctx.lineWidth=1.5;
      rrect(px,Bar.y,pw,Bar.h,rr2); ctx.stroke();
    }
  }
}
/* Shared so the heart over a 2 HP king is literally the badge on that player's banner, at size.
   Authored in a 10-unit box; r scales it. */
function heartPath(g,cx,cy,r){
  const u=r/10;
  g.beginPath();
  g.moveTo(cx, cy+5.4*u);
  g.bezierCurveTo(cx-6.2*u, cy+0.6*u, cx-4.6*u, cy-5.4*u, cx, cy-2.4*u);
  g.bezierCurveTo(cx+4.6*u, cy-5.4*u, cx+6.2*u, cy+0.6*u, cx, cy+5.4*u);
  g.closePath();
}

/* 0..1 through the current cooldown. A piece still in flight has not started cooling, and
   this uses the piece's OWN cdStart/cdEnd rather than the global COOLDOWN, so it stays right
   if a cooldown is ever shortened by an ability. */
/* The premove arrow's colour, shared by both passes. Blue, matching the destination tint and
   the premove square outline, so every mark that means "queued" is the same colour. */
function premoveInk(p,T){
  /* Steady. It used to pulse faster as the cooldown ran out; a queued move is a decision already
     made, and a line that flashes at you reads as something still asking for attention. */
  return p.side==='w' ? 'rgba(120,170,255,0.88)' : 'rgba(255,106,92,0.88)';   // the enemy's is red
}
function cdProgress(p,T){
  if(p.move||p.cdEnd<=p.cdStart) return 0;
  return Math.max(0,Math.min(1,(T-p.cdStart)/(p.cdEnd-p.cdStart)));
}
/* Wall-clock effects, so they play THROUGH a hit-stop instead of freezing with it. */
function drawFx(){
  const w=wall();
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i], u=(w-f.t0)/f.dur;
    if(u>=1){ fx.splice(i,1); continue; }
    if(u<0) continue;                                 // scheduled for later: a beat can carry a delay
    if(u<0) continue;                                        // scheduled for later (a spark's pop)
    const e=1-(1-u)*(1-u);                                   // ease-out
    if(f.kind==='spark'){
      /* A mote on a shallow arc, with a tail of the last few positions behind it. Additive, so
         it lights what it crosses rather than painting over it. */
      const ux=f.x1-f.x0, uy=f.y1-f.y0, L=Math.hypot(ux,uy)||1;
      const nx=-uy/L, ny=ux/L, arc=Math.min(S*0.35, L*0.18);
      const at=v=>[f.x0+ux*v+nx*arc*Math.sin(Math.PI*v), f.y0+uy*v+ny*arc*Math.sin(Math.PI*v)];
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round'; ctx.strokeStyle=f.col;
      for(let k=6;k>=1;k--){
        const v0=Math.max(0,e-k*0.055), v1=Math.max(0,e-(k-1)*0.055);
        const [ax,ay]=at(v0), [bx,by]=at(v1);
        ctx.globalAlpha=(1-k/7)*0.85; ctx.lineWidth=Math.max(1.5,S*0.055*(1-k/8));
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
      }
      const [hx,hy]=at(e);
      ctx.globalAlpha=0.75; ctx.fillStyle=f.col;
      ctx.beginPath(); ctx.arc(hx,hy,Math.max(3,S*0.10),0,7); ctx.fill();
      ctx.globalAlpha=1; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(hx,hy,Math.max(2,S*0.05),0,7); ctx.fill();
      ctx.restore();
    }else if(f.kind==='pop'){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=(1-u)*0.9; ctx.strokeStyle=f.col; ctx.lineWidth=Math.max(2,S*0.06*(1-u));
      ctx.beginPath(); ctx.arc(f.x,f.y,S*(0.10+0.36*e),0,7); ctx.stroke();
      ctx.restore();
    }else if(f.kind==='callout'){
      /* Pops in big and settles, holds, then drifts up and fades — the shape every fighting
         game's floating word has, because it is the shape that reads as an event. */
      const pop=Math.min(1,u/0.11), sc=1.38-0.38*(1-Math.pow(1-pop,3));
      const fade=u<0.62?1:1-(u-0.62)/0.38;
      const rise=S*0.42*Math.pow(u,1.4);
      const fs=Math.round(S*(f.big?0.34:0.28));
      ctx.save(); ctx.translate(f.x,f.y-rise); ctx.scale(sc,sc);
      ctx.globalAlpha=fade; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
      ctx.font=disp(fs);
      ctx.lineWidth=Math.max(3,fs*0.22); ctx.strokeStyle='#141b33';
      ctx.strokeText(f.text,0,0); ctx.fillStyle=f.col; ctx.fillText(f.text,0,0);
      ctx.restore();
    }else if(f.kind==='mark'){
      const p=pieces.find(q=>q.id===f.pid);
      if(!p||!p.alive){ fx.splice(i,1); continue; }      // the piece it was over is gone
      const R=pieceRect(p,now());
      const pop=Math.min(1,u/0.14), sc=1.5-0.5*(1-Math.pow(1-pop,3));
      const fade=u<0.6?1:1-(u-0.6)/0.4;
      const bob=Math.sin(w/140)*S*0.02;
      const fs=Math.round(S*0.40);
      /* A word and a mark on the same crown (DODGE! plus the check "!" it usually earns) would
         print through each other. While a callout is alive here the mark rides above the word's
         whole climb, and settles back as the word fades so it never jumps. */
      const cy=R.y-R.lift-S*0.12; let lift=0;
      for(const g of fx){
        if(g.kind!=="callout"||Math.abs(g.x-R.cx)>S*0.6||Math.abs(g.y-cy)>S*0.7) continue;
        const gu=(w-g.t0)/g.dur; if(gu<0||gu>=1) continue;
        lift=Math.max(lift, S*0.62*(gu<0.88?1:(1-gu)/0.12));   // hold until the word is nearly gone
      }
      ctx.save(); ctx.translate(R.cx, cy-lift+bob); ctx.scale(sc,sc);
      ctx.globalAlpha=fade; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
      ctx.font=disp(fs);
      ctx.lineWidth=Math.max(3,fs*0.2); ctx.strokeStyle='#141b33';
      ctx.strokeText(f.glyph,0,0); ctx.fillStyle=f.col; ctx.fillText(f.glyph,0,0);
      ctx.restore();
    }else
    if(f.kind==='hit'){
      if(f.big){                                             // a king kill lights the whole board
        ctx.globalAlpha=(1-u)*0.28; ctx.fillStyle='#fff';
        ctx.fillRect(ox,oy,S*COLS,S*ROWS);
      }
      ctx.globalAlpha=(1-u)*0.95; ctx.strokeStyle='#fff';
      ctx.lineWidth=Math.max(2,S*(f.big?0.14:0.09)*(1-u));
      ctx.beginPath(); ctx.arc(f.x,f.y,S*(0.2+(f.big?1.15:0.8)*e),0,7); ctx.stroke();
      ctx.globalAlpha=(1-u)*0.95; ctx.fillStyle='#fff';        // near-white on the first frame
      ctx.beginPath(); ctx.arc(f.x,f.y,S*0.36*(1-u*0.6),0,7); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  drawParts();
}

/* ================= the front door =================
   With no game running the canvas is a title scene: the sky and its motes, the wordmark, and
   the two kings facing each other across a strip of floor with spikes rising between them —
   the game's own sprites, glows and stamps, so the first screen is the game's own world. The
   board only appears when a game starts, and its pieces drop in as they always have. The hero
   owns the top of the screen; the menu card sits under it. */
function spacedText(txt,x,y,sp){
  const chars=[...txt], ws=chars.map(ch=>ctx.measureText(ch).width);
  let x0=x-(ws.reduce((a,b)=>a+b,0)+sp*(chars.length-1))/2;
  const al=ctx.textAlign; ctx.textAlign='left';
  chars.forEach((ch,i)=>{ ctx.fillText(ch,x0,y); x0+=ws[i]+sp; });
  ctx.textAlign=al;
}
/* ================= the scene art =================
   Illustrations live as <img> elements (the splash and the logo inside #splash, the rest in
   #scenepack) and are read through sceneImg, which is null until an image has decoded — every
   use has a fallback. The splash <img> keeps drawing after #splash is removed from the DOM
   because we hold the element. */
const SCENE_IMG={splash:document.getElementById('art-splash'), logo:document.getElementById('art-logo')};
function sceneImg(id){ const el=SCENE_IMG[id]||document.getElementById('art-'+id); return el&&el.complete&&el.naturalWidth>0?el:null; }
const SCENE={splash:{x:0.5,y:0.36}, sky:{x:0.5,y:0.30}};   // the focal point: the image point that lands on the same screen point (the knight's head)
/* Cover-fit with a focal point: the same maths as CSS object-fit:cover with object-position. */
function coverFit(iw,ih,W_,H_,f){
  const sc=Math.max(W_/iw,H_/ih), dw=iw*sc, dh=ih*sc;
  return {dx:Math.min(0,Math.max(W_-dw,W_*f.x-f.x*dw)), dy:Math.min(0,Math.max(H_-dh,H_*f.y-f.y*dh)), dw, dh};
}
/* The hero: the art as drawn, fitted to the width and pinned to the top, navy beneath, a fade
   at its foot — baked once per size. The logo is in the picture, where the artist put it. */
let heroCv=null, heroW=0, heroH=0;
function buildHero(){
  const im=sceneImg('splash'); if(!im) return false;
  if(!heroCv) heroCv=document.createElement('canvas');
  heroCv.width=Math.max(1,Math.round(W*dpr)); heroCv.height=Math.max(1,Math.round(H*dpr)); heroW=W; heroH=H;
  const g=heroCv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.imageSmoothingQuality='high';
  const bg=g.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#152d63'); bg.addColorStop(1,'#0b1226'); g.fillStyle=bg; g.fillRect(0,0,W,H);
  const dw=W, dh=W*im.naturalHeight/im.naturalWidth;
  g.drawImage(im,0,0,dw,dh);
  const fh=dh*0.14, fd=g.createLinearGradient(0,dh-fh,0,dh); fd.addColorStop(0,'rgba(21,45,99,0)'); fd.addColorStop(1,'#152d63');
  g.fillStyle=fd; g.fillRect(0,dh-fh,W,fh+1);
  return true;
}
/* The wordmark in the logo's own colours, for whatever still wants one. */
function drawLogo(){
  const y=safeTop+0.05*H, fs=Math.min(W*0.19,88); ctx.textAlign='center'; ctx.textBaseline='middle';
  chunky('BLITZ',W/2,y+fs*0.6,fs,'#ffffff',{lo:'#cfd8ee'});
  chunky('KINGS',W/2,y+fs*1.5,fs*1.05,'#ffcf3d',{hi:'#fff2b0',lo:'#e28b12'});
}
/* The front door: the hero and sparkles over it; without the art, the sky and the wordmark. */
function drawTitle(){
  if(!heroCv||heroW!==W||heroH!==H) buildHero();
  if(heroCv&&heroW===W&&heroH===H){ ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(heroCv,0,0); ctx.setTransform(dpr,0,0,dpr,0,0); drawMotes(); }
  else {
    /* No art: the same shape — a width-fit panel at the top, navy below, the wordmark where the
       logo sits — so even this case never reads as a resize. */
    paintSky();
    const dh=W*1.5, fh=dh*0.14;
    ctx.fillStyle='#152d63'; ctx.fillRect(0,dh,W,Math.max(0,H-dh));
    const fd=ctx.createLinearGradient(0,dh-fh,0,dh); fd.addColorStop(0,'rgba(21,45,99,0)'); fd.addColorStop(1,'#152d63');
    ctx.fillStyle=fd; ctx.fillRect(0,dh-fh,W,fh+1);
    const fs=Math.min(W*0.19,88); ctx.textAlign='center'; ctx.textBaseline='middle';
    chunky('BLITZ',W/2,dh*0.11+fs*0.6,fs,'#ffffff',{lo:'#cfd8ee'});
    chunky('KINGS',W/2,dh*0.11+fs*1.5,fs*1.05,'#ffcf3d',{hi:'#fff2b0',lo:'#e28b12'});
  }
}
function draw(){
  const T=gameOver?gameOver.t:now();
  processDoom();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  /* No game running: the front door, not the board. The board only exists once a game starts. */
  if(!started&&!gameOver){ drawTitle(); return; }
  paintSky();
  // screen shake — wall-clock so it plays through a hit-stop; random jitter, decaying
  const shk=wall()-shakeT0;
  if(shk<SHAKE_MS){ const k=1-shk/SHAKE_MS;
    ctx.translate((Math.random()*2-1)*shakeAmp*k,(Math.random()*2-1)*shakeAmp*k); }


  /* The board as a slab sitting in space rather than a pattern printed on the background:
     a few fading rings standing in for a soft drop shadow, then the cached tiles, then a lit
     top-left lip and a shadowed bottom-right one. ctx.shadowBlur stays banned here — it is
     brutal on mobile, and stacked strokes cost nothing. */
  const BW=S*COLS, BH=S*ROWS;
  ctx.lineWidth=2;
  for(let i=7;i>=1;i--){
    ctx.strokeStyle='rgba(0,0,0,'+(0.05*(8-i)/7).toFixed(3)+')';
    ctx.strokeRect(ox-i*2.5, oy-i*2.5+4, BW+i*5, BH+i*5);
  }
  drawFrame(BW,BH);                       // brass ring; the board lands on top of its middle
  if(boardCv) ctx.drawImage(boardCv,ox,oy,BW,BH);
  drawFrameTrim(BW,BH);
  const lip=Math.max(2,S*.05);
  ctx.lineWidth=lip;
  ctx.strokeStyle='rgba(255,250,242,.20)';
  ctx.beginPath(); ctx.moveTo(ox-lip/2,oy+BH); ctx.lineTo(ox-lip/2,oy-lip/2);
  ctx.lineTo(ox+BW,oy-lip/2); ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.60)';
  ctx.beginPath(); ctx.moveTo(ox+BW+lip/2,oy); ctx.lineTo(ox+BW+lip/2,oy+BH+lip/2);
  ctx.lineTo(ox,oy+BH+lip/2); ctx.stroke();

  /* Spikes, then the ring about to erupt. Both sit on the floor, under the pieces — a piece in
     flight passes over them, which is exactly the escape the immunity rule grants. */
  const dRing=deadRing(T);
  if(dRing>=0&&spikeCv&&spikeTW) for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(ringOf[r*COLS+c]>dRing) continue;
    const v=(r*2+c*3)%SPIKE_VARIANTS;          // deterministic, so a square never flickers variant
    ctx.drawImage(spikeCv, v*spikeTW,0,spikeTW,spikeTW, ox+c*S, oy+r*S, S, S);
  }
  const wS=warnState(T);
  if(wS){
    /* The blink accelerates EXPONENTIALLY into the eruption.
       The old phase was 9*pi*u^2. Its frequency rises linearly and tops out at 9 cycles per
       warning, which over eight seconds is 4.5 blinks total — about one every 1.8s. It does
       double in the last half, but with two blinks left there is nothing to compare it against,
       so what it read as was "slightly faster once, then constant".
       This is a true exponential ramp from F0 to F1: the rate doubles every fixed slice of the
       countdown, which is the only thing an eye registers as accelerating rather than as merely
       fast. The integral of an exponential is what the phase has to be, or the rate jumps at the
       seam. Read off WARN so it stays right if the schedule is retimed.
       Amplitude rides along, so the last blinks are also the hardest. */
    /* The ramp runs on u^P rather than u: the rate stays low for longer and then shoots up, so
       the frantic end (above ~4 blinks a second) is about 30% shorter than the plain exponential
       and the calm start correspondingly longer, with the warning exactly as long as before.
       The phase is the integral of that rate, taken numerically in a few slices so the rate
       never jumps between frames; the amplitude rides the same warped clock. */
    const F0=0.6, F1=8.0, LR=Math.log(F1/F0), WSEC=WARN/1000, P=1.5, N=24;
    let ph=0; for(let i=0;i<N;i++){ const v=(i+0.5)/N*wS.u; ph+=F0*Math.exp(LR*Math.pow(v,P)); }
    ph*=2*Math.PI*WSEC*wS.u/N;
    const uu=Math.pow(wS.u,P);
    const a=(0.06+0.10*uu)+(0.36+0.40*uu)*Math.abs(Math.sin(ph));   // a fifth harder than on grey: red on warm stone
    ctx.fillStyle='rgba(255,80,56,'+a.toFixed(3)+')';   // hot, not brick: brick shares the stone's hue
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(ringOf[r*COLS+c]===wS.ring) ctx.fillRect(ox+c*S, oy+r*S, S, S);
    }
  }

  // active piece (dragging or selected)
  const active = drag&&drag.p.alive ? drag.p : (selected&&selected.alive?selected:null);

  // highlights: queued destinations only. The dragged piece's origin square is left exactly as
  // it is — the only thing that may be on it is its own cooldown veil.
  for(const p of pieces){
    if(p.alive&&p.queued&&(p.side==='w'||enemyArrowsOn())){
      const [qx,qy]=sqXY(p.queued[0],p.queued[1]);
      ctx.fillStyle= p.side==='w' ? 'rgba(28,64,130,.42)' : 'rgba(130,34,26,.42)';   // to match the arrow it belongs to
      ctx.fillRect(qx,qy,S,S);
    }
  }
  /* The square of a piece you are holding a capture over: danger red under it, in the floor
     pass so the piece stands on it. The same test the preview uses, so the two never disagree. */
  if(drag&&!drag.spawn&&!drag.bomb&&drag.p.alive&&drag.moved){
    const tg=snapTarget(drag.p,drag.x,drag.y), v=tg&&stationaryAt(tg[0],tg[1]);
    if(v&&v.side!==drag.p.side){
      const [qx,qy]=sqXY(v.r,v.c), pu=0.5+0.5*Math.sin(wall()/150);
      ctx.fillStyle='rgba(255,96,80,'+(0.24+0.12*pu).toFixed(3)+')'; ctx.fillRect(qx,qy,S,S);
      const lw=Math.max(2,S*0.05);
      ctx.lineWidth=lw; ctx.strokeStyle='rgba(255,120,100,'+(0.45+0.35*pu).toFixed(3)+')';
      rrect(qx+lw,qy+lw,S-2*lw,S-2*lw,Math.max(3,S*0.08)); ctx.stroke();
    }
  }
  drawKingLights(T);
  if(shrine.on) drawShrine(T);
  drawBolts(T);
  drawBombs(T);
  /* A trial's spawn mark: where the card's piece may go — a brass pulse with a running dashed
     rim, until it is used. */
  if(campaign.active&&campaign.level&&campaign.level.spawnAt&&campaign.spawnedW===0){
    const pu=0.5+0.5*Math.sin(wall()/260), lw=Math.max(2,S*0.05);
    for(const [r,c] of campaign.level.spawnAt){
      const [mx,my]=sqXY(r,c);
      ctx.fillStyle='rgba(232,200,106,'+(0.14+0.14*pu).toFixed(3)+')'; ctx.fillRect(mx,my,S,S);
      ctx.save(); ctx.setLineDash([S*.14,S*.10]); ctx.lineDashOffset=-((wall()/30)%(S*.24));
      ctx.lineWidth=lw; ctx.strokeStyle='rgba(255,236,170,'+(0.55+0.35*pu).toFixed(3)+')';
      rrect(mx+lw,my+lw,S-2*lw,S-2*lw,Math.max(3,S*0.08)); ctx.stroke(); ctx.restore();
    }
  }
  /* A trial's marked squares: a brass pulse on the floor, under the pieces, so it reads as a
     PLACE rather than as a piece. Wall time, so it keeps breathing through a hit-stop. */
  if(campaign.active&&campaign.marks.length){
    const L=campaign.level, pu=0.5+0.5*Math.sin(wall()/260), W=wall();
    const el=campaign.base?T-campaign.base:0;                  // sim time: it holds through a hit-stop
    const lw=Math.max(2,S*0.05), rad=Math.max(3,S*0.08);
    for(const m of campaign.marks){
      const [mx,my]=sqXY(m.r,m.c);
      if(m.at){
        /* Claimed: solid and still, with a short bright bloom as it locks in. */
        const glow=1-Math.min(1,(W-m.wall)/280);
        ctx.fillStyle='rgba(232,200,106,'+(0.24+0.34*glow).toFixed(3)+')'; ctx.fillRect(mx,my,S,S);
        ctx.lineWidth=lw; ctx.strokeStyle='rgba(255,236,170,0.85)';
        rrect(mx+lw,my+lw,S-2*lw,S-2*lw,rad); ctx.stroke();
        continue;
      }
      /* Live: the ring closes in over the mark's life and thins out over its last quarter — a
         timer with no numerals. A mark with no markMs simply pulses at full size. */
      const k=L.markMs?clamp01(el/L.markMs):0, a=k<0.75?1:1-(k-0.75)/0.25;
      const ins=S*0.40*k, w=S-2*ins;
      if(w<=2*lw+2||a<=0) continue;
      ctx.fillStyle='rgba(232,200,106,'+((0.10+0.10*pu)*a).toFixed(3)+')'; ctx.fillRect(mx+ins,my+ins,w,w);
      ctx.lineWidth=lw; ctx.strokeStyle='rgba(232,200,106,'+((0.55+0.35*pu)*a).toFixed(3)+')';
      rrect(mx+ins+lw,my+ins+lw,w-2*lw,w-2*lw,Math.min(rad,(w-2*lw)/2)); ctx.stroke();
    }
  }

  /* Motion trails, on the floor under every piece: a light-grey rectangle stretched back along
     the path from where the piece is now, fading to nothing at its tail. Its length is the
     distance the piece covered in the last trailMs — so it is long while the piece is fast off
     the launch, shrinks as the ease-out slows it, and is gone by the time it settles. A still
     frame of a move reads its direction from this alone. */
  for(const p of pieces) if(p.alive) drawTrail(p,T);   // moving, or just landed (it lingers)

  /* PASS 1 of the premove: the arrow to the destination, UNDER every piece. No ghost here — the
     ghost belongs to the moment you are still deciding (it lives in the drag preview); once the
     move is queued, the tinted square and the arrow are the whole statement. */
  /* PASS 1: only the stub of the arrow that falls inside the mover's own sprite box, and only
     for a piece standing still. That part goes UNDER the pieces so the tail reads as emerging
     from beneath the piece it belongs to. Everything outside the box is PASS 2's job, and the two
     are clipped to be disjoint — overlapping them would double-coat the ink and the in-flight
     fade would stop being a fade. */
  for(const p of pieces){
    const a=moveArrow(p,T); if(!a) continue;
    const R=bodyRect(p,T);
    ctx.save();
    ctx.beginPath(); ctx.rect(R.x,R.y,R.w,R.h); ctx.clip();
    drawArrow(a.fr,a.fc,a.tr,a.tc,a.ink,a.bowed,a.from,a.cast);
    ctx.restore();
  }

  // pieces, back to front, each on its own contact shadow
  for(const e of painterList(T)){
    const p=e.p, R=e.R;
    let alpha=1;
    /* The piece you are holding stays exactly as it is: full alpha, on its square. Dimming it
       read as "this piece is half gone", and the line now says which piece is held. */
    /* Shadow stays on the floor and shrinks while the body rises — a shadow that rises with
       the piece reads as a zoom; only a stationary one reads as a jump. */
    if(R.hidden) continue;                        // not dropped in yet
    /* The cooldown veil, on the FLOOR. A white square on the tile's flat face — inset by the
       same bevel the raster carves, so the lit and shadowed lips are never painted over — that
       collapses to a line at the bottom of that face as the cooldown runs, then vanishes. Height
       tracks the REMAINING cooldown, floored at the line so it never blinks out early; it goes
       exactly when the piece is ready. Drawn before the shadow and the piece, so they stand on it. */
    /* Drawn for the dragged piece too. It used to be suppressed, on the theory that the held
       sprite covered it anyway — but the held sprite is gone, and the cooldown is the single most
       important thing to know about a piece you are currently aiming: it is what decides whether
       this becomes a move or a premove. */
    if(!p.move&&p.cdEnd>T){
      const left=1-cdProgress(p,T);
      const [vx,vy]=sqXY(p.r,p.c);
      const bev=Math.max(1/dpr,Math.round(S*.055*dpr)/dpr), flat=S-2*bev;   // the raster's own bevel, on the device grid
      const h=Math.max(flat*JUICE.veilLine, flat*left);
      /* Brighter as it thins, and most of that brightening happens right at the end — a linear
         ramp spends its contrast while the square is still big enough not to need it. */
      const pr=1-left;
      const base=p.queued?JUICE.veilArmed:JUICE.veil;
      ctx.globalAlpha=Math.min(1, base*(1+JUICE.veilGain*Math.pow(pr,JUICE.veilCurve)));
      ctx.fillStyle='#ffffff';
      ctx.fillRect(vx+bev, vy+bev+flat-h, flat, h);
      ctx.globalAlpha=1;
    }
    /* The shadow takes the landing thud too: it spreads with the squash. */
    const thud=1+(R.sx-1)*0.8;
    drawShadow(R.cx, R.footY, FOOT_W*.52*S*R.shrink*thud, S*.115*R.shrink,
               alpha*.26*(1-(p.type==='N'?.5:.1)*R.s));
    if(p.type==='K') drawKingGlow(R);            // behind the sprite, centred on the cross
    if(p.side==='w'&&!p.move){
      const hv=(p.id===hoverId&&p.hoverAt)?Math.min(1,(wall()-p.hoverAt)/HOVER.ms):0;
      const pr=p.pressAt?Math.max(0,1-(wall()-p.pressAt)/PRESS.glowMs):0;
      const k=Math.max(hv*HOVER.glow,pr); if(k>0) drawBaseGlow(R,k);
    }
    drawArtAt(p, R.cx, R.footY-R.lift, R.mul, alpha, R.sx, R.sy, R.lean);
  }

  /* PASS 2: the whole arrow OVER every piece, minus the mover's own sprite box.
     This used to clip to the destination square alone, which meant any piece standing anywhere
     else along the shaft was painted on top and chopped the arrow in half. That is not an edge
     case — a teammate landing on the path is the exact event that is about to cancel the premove,
     so the arrow broke at precisely the moment you were looking at it. Excluding the mover's box
     rather than its square also handles a piece in flight, which is between squares and whose
     crown otherwise sits right where the arrow ahead of it is drawn. */
  for(const p of pieces){
    const a=moveArrow(p,T); if(!a) continue;
    const R=bodyRect(p,T);
    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,W,H); ctx.rect(R.x,R.y,R.w,R.h);
    ctx.clip('evenodd');
    drawArrow(a.fr,a.fc,a.tr,a.tc,a.ink,a.bowed,a.from,a.cast);
    ctx.restore();
  }
  /* Dying arrows, in the same layer with the same exclusion, so the only thing that changes at
     the moment of a cancel is the ink. Blocked: white for a beat, then red, retracting into the
     head as it goes. Replaced or cancelled: the ribbon simply dissolves. */
  for(const f of fx){
    if(f.kind!=='arrowGone'||(f.side!=='w'&&!enemyArrowsOn())) continue;
    const u=(wall()-f.t0)/f.dur; if(u<0||u>=1) continue;
    let ink, from=0;
    if(f.reason==='blocked'){
      const a=(0.95*(1-u)).toFixed(3);
      ink = u<0.2 ? 'rgba(255,255,255,'+a+')' : 'rgba(255,96,80,'+a+')';
      from = Math.max(0,(u-0.3)/0.7);
    }else ink=(f.side==='w'?'rgba(120,170,255,':'rgba(255,106,92,')+(0.88*(1-u)).toFixed(3)+')';
    const p=pieces.find(q=>q.id===f.pid);
    ctx.save();
    if(p&&p.alive&&!p.move){ const R=bodyRect(p,T); ctx.beginPath(); ctx.rect(0,0,W,H); ctx.rect(R.x,R.y,R.w,R.h); ctx.clip('evenodd'); }
    drawArrow(f.fr,f.fc,f.tr,f.tc,ink,f.bowed,from,0);
    ctx.restore();
  }

  /* Hearts after every piece is down, never inside the painter loop: a piece standing one row
     forward is drawn later and its art would cover the warning on the king behind it. */
  for(const p of pieces)
    if(p.alive&&p.type==='K'&&p.hp>1) drawKingHeart(pieceRect(p,T));

  /* Move previews go OVER the pieces, on square centres.
     I had moved these underneath, as floor decals anchored to the contact line, on the theory
     that an arrow drawn on top starts inside a piece's torso. That was wrong twice over: a
     piece standing in row r+1 covers row r from 38% of its height downward, so it swallowed
     both the arrow's tail and — worse — the arrowhead on the square you are about to capture;
     and anchoring to the contact line put the whole line a third of a cell below the squares
     it was describing, so it read as misaligned. In a game with no turns, a premove indicator
     you cannot see is a lost piece, exactly like a hidden cooldown. Visibility wins. */
  if(active&&!gameOver){
    const premove = active.move||now()<active.cdEnd;
    // light marks, not dark ones: the board is stone now and black dots vanished into it
    const dot = premove ? 'rgba(120,170,255,.72)' : 'rgba(255,252,245,.5)';
    for(const [r,c] of legalMoves(active)){
      const [cx,cy]=center(r,c);
      /* One dot per legal square, capture or not. The ring around a capturable piece was
         answering a question the board already answers — the piece under it is a different
         colour from yours — and it was the heaviest mark on screen at the exact moment the
         screen is busiest with the preview dots and the drag ghost. */
      ctx.fillStyle=dot;
      ctx.beginPath(); ctx.arc(cx,cy,S*.135,0,7); ctx.fill();
    }
  }
  /* Round result, across the board. The kill has already swept the losing army, so without
     this the round would end in silence — a point you fought for has to land somewhere. */
  if(roundMsg&&!gameOver&&T>=roundMsg.t){                   // not before the army has finished falling
    const age=T-roundMsg.t, fade=Math.min(1,age/160);
    const mine=roundMsg.winner==='w';
    ctx.globalAlpha=fade*0.72; ctx.fillStyle='#0b1226';
    ctx.fillRect(ox,oy+BH*0.30,BW,BH*0.26); ctx.globalAlpha=1;
    const fs=Math.round(S*0.42);
    ctx.font=disp(fs);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineJoin='round'; ctx.lineWidth=Math.max(3,fs*0.20);
    const cx=ox+BW/2, cy=oy+BH*0.43;
    ctx.globalAlpha=fade;
    const label = roundMsg.label || (roundMsg.winner===null ? 'ROUND DRAWN' : (mine?'ROUND WON':'ROUND LOST'));
    ctx.strokeStyle='#141b33';
    ctx.strokeText(label,cx,cy);
    ctx.fillStyle= roundMsg.label ? (roundMsg.winner==='w'?'#8fd0ff':'#ff9a86')
                 : (roundMsg.winner===null ? '#e8e2d6' : (mine?'#8fd0ff':'#ff9a86'));
    ctx.fillText(label,cx,cy);
    const sub = roundMsg.sub!==undefined ? roundMsg.sub : points.w+'  —  '+points.b;
    ctx.font=disp(fitDisp(sub, BW*0.9, fs*0.64, fs*0.45, false).size);
    ctx.lineWidth=Math.max(2,fs*0.13);
    ctx.strokeStyle='#141b33';
    ctx.strokeText(sub,cx,cy+fs*0.95);
    ctx.fillStyle='#fff6dc';
    ctx.fillText(sub,cx,cy+fs*0.95);
    ctx.globalAlpha=1;
  }

  /* The count-in, across the board. This replaced a one-line toast pinned to the bottom edge:
     that text sat on the border art, was gone before you read it, and told you a round had
     already started rather than giving you a moment to see the new board first. */
  if(countIn&&!gameOver){
    const left=countIn-T, secs=Math.max(1,Math.ceil(left/1000));
    const frac=1-((left%1000)/1000);                  // 0 at each tick, 1 just before the next
    ctx.globalAlpha=0.78; ctx.fillStyle='#0b1226';
    ctx.fillRect(ox,oy+BH*0.28,BW,BH*(campaign.waitTap?0.37:0.33)); ctx.globalAlpha=1;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineJoin='round';
    const cx=ox+BW/2;
    /* A campaign trial's card is its TITLE and one goal line, with no digits unless the trial
       asked for a real count-in. The duel's later rounds still say ROUND n. */
    const card = campaign.active&&campaign.level&&roundNo===1&&campaign.cardMs<2000;
    if(card){
      const ts=Math.round(S*0.42);
      ctx.font=disp(ts);
      ctx.lineWidth=Math.max(3,ts*0.22); ctx.strokeStyle='#141b33';
      ctx.strokeText(campaign.level.title,cx,oy+BH*0.395); ctx.fillStyle='#ffe28a';
      ctx.fillText(campaign.level.title,cx,oy+BH*0.395);
      if(campaign.level.goal){
        const f=fitDisp(campaign.level.goal, BW*0.92, S*0.30, S*0.22, true), gs=f.size;
        ctx.font=disp(gs); ctx.lineWidth=Math.max(2,gs*0.18); ctx.strokeStyle='#141b33'; ctx.fillStyle='#fff6dc';
        const y0 = f.lines.length===1 ? oy+BH*0.50 : oy+BH*0.478;
        f.lines.forEach((ln,i)=>{ const y=y0+i*gs*1.18; ctx.strokeText(ln,cx,y); ctx.fillText(ln,cx,y); });
      }
      if(campaign.waitTap){
        const ps=Math.max(9,Math.round(S*0.20)), pu=0.55+0.45*Math.abs(Math.sin(wall()/420));
        ctx.font='800 '+ps+'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'; ctx.globalAlpha=pu;
        ctx.fillStyle='#141b33'; spacedText('TAP TO START',cx,oy+BH*0.615+1,ps*0.18);
        ctx.fillStyle='#f4b73a'; spacedText('TAP TO START',cx,oy+BH*0.615,ps*0.18);
      }
      ctx.globalAlpha=1;
    }else{
    const hs=Math.round(S*0.34);
    ctx.font=disp(hs);
    ctx.lineWidth=Math.max(3,hs*0.22); ctx.strokeStyle='#141b33';
    const head = campaign.active&&campaign.level&&roundNo===1 ? campaign.level.title : 'ROUND '+roundNo;
    ctx.strokeText(head,cx,oy+BH*0.345); ctx.fillStyle='#ffe28a';
    ctx.fillText(head,cx,oy+BH*0.345);
    /* Each digit lands big and settles, so the beat is visible rather than merely counted. */
    const ns=Math.round(S*0.95*(1.35-0.35*Math.min(1,frac*2.2)));
    ctx.globalAlpha=0.35+0.65*Math.min(1,(1-frac)*3.2);
    ctx.font=disp(ns);
    ctx.lineWidth=Math.max(4,ns*0.14); ctx.strokeStyle='#141b33';
    ctx.strokeText(String(secs),cx,oy+BH*0.475);
    ctx.fillStyle='#fff6dc'; ctx.fillText(String(secs),cx,oy+BH*0.475);
    ctx.globalAlpha=1;
    if(campaign.active&&campaign.level&&roundNo===1&&campaign.level.goal){
      const f=fitDisp(campaign.level.goal, BW*0.92, S*0.26, S*0.18, false), gs=f.size; ctx.font=disp(gs);
      ctx.lineWidth=Math.max(2,gs*0.18); ctx.strokeStyle='#141b33';
      ctx.strokeText(f.lines[0],cx,oy+BH*0.578); ctx.fillStyle='#fff6dc';
      ctx.fillText(f.lines[0],cx,oy+BH*0.578);
    }
    }
  }
  /* "FIGHT" rides the first instant of live play, so the transition out of the count-in reads
     as a start rather than the numbers simply vanishing. */
  if(goT&&!countIn&&!gameOver&&T-goT<GO_MS){
    const u=(T-goT)/GO_MS;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
    const fs2=Math.round(S*0.62*(1+0.5*u));
    ctx.globalAlpha=1-u*u;
    ctx.font=disp(fs2);
    ctx.lineWidth=Math.max(3,fs2*0.16); ctx.strokeStyle='#141b33';
    const go = campaign.active&&campaign.level ? (campaign.level.go||'GO') : 'FIGHT';
    ctx.strokeText(go,ox+BW/2,oy+BH*0.45);
    ctx.fillStyle='#fff6dc'; ctx.fillText(go,ox+BW/2,oy+BH*0.45);
    ctx.globalAlpha=1;
  }

  sleepTick(); drawSleep();
  drawShrineMotes();
  drawFx();
  /* The banner after everything on the board, so a resting piece can never cover the score. */
  drawBanner();
  if(kitOn()){ if(kitRevealed()){ drawTray(); drawTrayArrow(); } else drawLockedTray(); } else if(kitLocked()) drawLockedTray();

  /* ...but the HELD piece goes after the banners. pointermove writes drag.y unclamped and the
     held piece draws at 1.14x, so dragging toward row 0 puts its crown ~57px inside the top
     banner and it would be sliced off square — exactly the moment the player is looking at it.
     The counter being briefly covered is the correct trade. */
  if(drag&&!drag.spawn&&!drag.bomb&&drag.p.alive&&drag.moved){
    /* The drag, rebuilt around ONE line and ONE ghost.
       The line runs from the piece's own body to wherever the finger is — always, not to the
       square it will snap to, and not only when the two differ. It is what makes the drag feel
       held: it bends with the hand, and the hand is never told it is "off" anything. Premove
       blue, dashed, with the dashes marching from the piece toward the finger so the line reads
       as intent flowing outward rather than a leash pulling back.
       The ghost is the only thing that snaps. It appears on a square the instant the finger's
       position resolves to a legal move there and vanishes the instant it does not, so sweeping
       the line across the board makes ghosts snap in and out at the valid squares — which is
       the whole feel. No outline box on the square: the ghost IS the affordance. */
    const [bx,by]=bodyCentre(drag.p);
    ctx.save();
    ctx.setLineDash([S*.12,S*.10]); ctx.lineDashOffset=-((wall()/26)%(S*.22));
    ctx.strokeStyle='rgba(120,170,255,.82)'; ctx.lineWidth=Math.max(2,S*.06); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(drag.x,drag.y); ctx.stroke();
    ctx.restore();
    // the cap at the tip: a soft disc with a bright core, so the line has an end rather than a stop
    ctx.fillStyle='rgba(120,170,255,.42)'; ctx.beginPath(); ctx.arc(drag.x,drag.y,S*.13,0,7); ctx.fill();
    ctx.fillStyle='rgba(120,170,255,.85)'; ctx.beginPath(); ctx.arc(drag.x,drag.y,S*.075,0,7); ctx.fill();
    ctx.fillStyle='#eef4ff'; ctx.beginPath(); ctx.arc(drag.x,drag.y,S*.032,0,7); ctx.fill();
    const tgt=snapTarget(drag.p,drag.x,drag.y);
    if(!tgt) drag.lockId=null;
    if(tgt){
      /* A capture in the making is shown on the VICTIM: the ghost gives way to a target lock
         around it. Decided every frame from the board as it is NOW: an enemy landing on the
         held square locks on, an enemy leaving it releases the lock and the ghost returns. A
         piece in flight is not there yet, so it does not count. */
      const victim=stationaryAt(tgt[0],tgt[1]);
      if(victim&&victim.side!==drag.p.side){
        if(drag.lockId!==victim.id){ drag.lockId=victim.id; drag.lockT=wall(); }   // a fresh lock snaps in
        drawLock(victim, drag.lockT);
      }else{
        drag.lockId=null;
        const [gx,gy]=center(tgt[0],tgt[1]);
        drawArtAt(drag.p, gx, gy+(0.5-FOOT_INSET)*S, 1, 0.62);
      }
    }
  }
  if(drag&&(drag.spawn||drag.bomb)) drawKitDrag();

/* The target lock. A capture in the making is shown ON the victim rather than as a ghost over
   it: four brackets snap in from outside and orbit it slowly, a thin ring pulses at the body,
   white ticks mark the compass points, and the floor under it goes danger red (drawn in the
   floor pass). Blue is already the colour of your intent and red of their danger, and none of
   it covers the piece art. Wall time throughout, so it keeps living through a hit-stop. */
/* The lock is drawn ONCE into two sprites per board size — the brackets and the ticks, at the
   snap-in's largest radius so the blit only ever scales down — and each frame is two rotated
   image draws plus two trivial strokes. The first cut stroked four blurred arcs every frame,
   and shadowBlur is the one thing a budget phone's canvas cannot do at speed; the halo is now
   a wide faint stroke under a crisp one, the same trick the arrow pulse uses. */
let lockCv=null, tickCv=null, lockS=0, lockDpr=0;
const LOCK_K=1.7;                                   // the snap-in starts here and settles to 1
function buildLock(){
  lockS=S; lockDpr=dpr;
  const r=S*0.46*LOCK_K, pad=S*0.16*LOCK_K, half=r+pad, size=Math.ceil(half*2*dpr);
  const mk=()=>{ const c=document.createElement('canvas'); c.width=c.height=size;
    const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.translate(half,half); g.lineCap='round'; return [c,g]; };
  let [c1,g]=mk();
  g.lineWidth=Math.max(6,S*0.15)*LOCK_K; g.strokeStyle='rgba(120,170,255,.26)';
  for(let i=0;i<4;i++){ const a=i*Math.PI/2; g.beginPath(); g.arc(0,0,r,a-0.46,a+0.46); g.stroke(); }
  g.lineWidth=Math.max(2.5,S*0.055)*LOCK_K; g.strokeStyle='rgba(150,195,255,.96)';
  for(let i=0;i<4;i++){ const a=i*Math.PI/2; g.beginPath(); g.arc(0,0,r,a-0.46,a+0.46); g.stroke(); }
  lockCv=c1;
  let [c2,h]=mk();
  h.lineWidth=Math.max(2,S*0.04)*LOCK_K; h.strokeStyle='rgba(255,255,255,.92)';
  for(let i=0;i<4;i++){ const a=i*Math.PI/2, cs=Math.cos(a), sn=Math.sin(a);
    h.beginPath(); h.moveTo(cs*r*0.74,sn*r*0.74); h.lineTo(cs*r*0.96,sn*r*0.96); h.stroke(); }
  tickCv=c2;
}
function drawLock(p,t0){
  if(!lockCv||lockS!==S||lockDpr!==dpr) buildLock();
  const [bx,by]=bodyCentre(p);
  const w=wall(), k=Math.min(1,(w-t0)/200), ease=1-Math.pow(1-k,3);
  const sc=(LOCK_K-(LOCK_K-1)*ease)/LOCK_K, rot=(w/2600)*6.2832, pu=0.5+0.5*Math.sin(w/150);
  const half=lockCv.width/dpr/2;
  ctx.save(); ctx.translate(bx,by);
  ctx.save(); ctx.rotate(rot); ctx.scale(sc,sc); ctx.globalAlpha=0.45+0.55*ease;
  ctx.drawImage(lockCv,-half,-half,half*2,half*2); ctx.restore();
  ctx.save(); ctx.rotate(-rot*0.5); ctx.scale(sc,sc); ctx.globalAlpha=0.9*ease;
  ctx.drawImage(tickCv,-half,-half,half*2,half*2); ctx.restore();
  const r=S*0.46*sc*LOCK_K;
  ctx.lineWidth=Math.max(1.5,S*0.024); ctx.strokeStyle='rgba(235,245,255,'+(0.30+0.45*pu*ease).toFixed(2)+')';
  ctx.beginPath(); ctx.arc(0,0,r*0.62,0,7); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.95)'; ctx.beginPath(); ctx.arc(0,0,S*0.035,0,7); ctx.fill();
  ctx.restore();
}
