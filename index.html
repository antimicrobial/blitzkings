<script>
'use strict';
/* ================= config ================= */
/* set from the pre-game settings screen; the defaults below are what it opens on */
/* Cooldown down a fifth, piece speed down a tenth. Every flight is therefore 11.1% longer
   (duration goes as 1/speed), and the whole game's tempo tightens because the wait between
   moves fell further than the moves themselves lengthened. */
const cfg={w:7,h:9,cool:3.4,speed:2.40975,pieces:3,flip:0,diff:1};   // 4s/2.975 → -15%/-10%, twice
/* Seven by nine, committed: kings on rows 0 and 8, one centre square at (4,3), the diamond
   collapse odd both ways. The width experiment (bigvision-6col) showed the engine derives
   everything from COLS and ROWS; the trials have squares of their own for this board in TRIALS
   below. On a phone the cell is width-limited at seven columns, so the ninth row costs nothing
   but the empty space under the board. */
let COLS=cfg.w, ROWS=cfg.h;
let COOLDOWN=cfg.cool*1000;   // ms after landing
let SPEED=cfg.speed;          // squares per second (euclidean)
const MAXDPR=2;               // cap retina rendering; 3x phones gain nothing but heat
const LIFT=0;                 // the dragged piece tracks the pointer exactly — see notes in snapTarget
const RANGE={R:4,B:3};   // max squares a slider travels in one move; a queen goes a rook's distance along a line and a bishop's on a diagonal
let SNAP=1.25;                // near-miss forgiveness, in squares OUTSIDE the target; 0 disables
/* Cool desaturated stone rather than the old tan wood. The pieces are glossy and saturated;
   a warm high-key board competed with them and the whole picture read as flat. A quiet
   checker at low internal contrast lets the board recede and the army carry the screen. */
/* The stage. The world around it is sunny; the board is dark, low-chroma stone, because every
   mark on it — dots, ink, trails, the king's light, the shrine's wash, the spike blink — is a
   light over a dark ground, and on a bright square they vanish. Warm stone, the art's board in
   shadow: matched in lightness to the old grey, a third of the clay's chroma, and measured to
   read BETTER than a cool grey for the player's marks — blue is the complement of warm stone,
   so every blue mark (dots, ink, tint, the king's light, a capture in progress) gains 22–63% in
   colour distance, while the warm marks (blink, resting shrine) lose about a tenth and are
   tuned up to cover it below. */
let LIGHT='#9a8878', DARK='#64544a'; const BGCOL='#2f8fe6';
/* ================= ambience =================
   One object, one flag, so the whole look comes off in a single call. Values are deliberately
   restrained: the board is the game, and every one of these things competes with it for the eye
   if it is turned up. The floor keeps its hue — a warm stone would read better as a scene and
   worse as a chessboard, because the red army would lose separation against it. */
const VIBE={
  on:1,
  skyTop:'#2f8fe6',        // the art's blue, up where the sun is
  skyMid:'#7cc6ff',
  skyBot:'#dff3ff',        // haze at the bottom
  pool:0.34,               // a pool of light behind the board: the thing that says "lit"
  poolCol:'#8b63d8',
  shafts:0.032,            // soft shafts from above; 0 disables
  frame:1,                 // the brass arena rim (costs ~3px of cell to fit)
  frameW:8,
  floorPool:0.20,          // vignette baked into the board raster, centre brighter than rim
  floorGrain:0.055,        // granite speckle
  floorSheen:0.05,         // a broad diagonal sheen
  motes:18,                // sparkles drifting up the sky; 0 disables
  moteAlpha:0.55,
  confetti:1               // a burst when a round is won
};
const vibeOn=k=>VIBE.on&&VIBE[k];
/* Every gradient below needs the same colour at several alphas, and a hex cannot carry one. */
function rgba(hex,a){
  const v=parseInt(hex.slice(1),16);
  return 'rgba('+((v>>16)&255)+','+((v>>8)&255)+','+(v&255)+','+(+a).toFixed(3)+')';
}
const VAL={K:200,Q:9,R:5,B:3.2,N:3,P:1};

/* ================= rounds =================
   No economy: kill the enemy king and the round is yours. First to WIN_POINTS rounds takes the
   match. The gold hill is gone entirely — the mask, the per-second accrual, and the approach
   gradient the bot used to navigate by all went with it. */
const WIN_POINTS=3, ROUND_GAP=1600, COUNT_MS=3200, GO_MS=650;
let points={w:0,b:0}, roundNo=1, roundBreak=0, roundMsg=null;
/* Absolute sim time at which play begins. Every round opens behind a 3-2-1, including the
   first, so the board is readable before anything can move. */
let countIn=0, goT=0;
const frozen=()=>roundBreak>0||countIn>0;

/* ================= classes, perks, ult =================
   A class is exactly one ult and nothing else; a perk is a separate, always-on choice. The
   ult charges on time alone and is PRESERVED between rounds — spend it in round 1 and you
   open round 2 empty while an opponent who held theirs opens armed. */
/* Deliberately clear of CLASS_TINT's green/white/blue: the two discs sit side by side and
   sharing a hue between them would read as one status, not two. */
/* No economy and no buttons: both sides get four pieces and the board decides it. Reinforcements
   and the hourglasses that paid for them are gone, so nothing on the plate is a meter any more
   and nothing on the floor is a pickup — every square is either empty, a piece, or about to
   erupt. */

/* ================= spikes =================
   The clock that forces a fight. Rings erupt from the outside in, each announced by a blink
   that accelerates as it closes; a spiked square kills anything STANDING on it, king included.
   Ring 0 is the outer border — which is where both kings spawn, so camping the back rank is
   the first thing the board takes away.
   Bands are ROWS, not rings: rows {0,7} go first, then {1,6}, {2,5}, {3,4}. On 8 rows that is
   four bands, and the constants below put the last eruption at exactly 22+8+3*20 = 90s, with
   the eruptions landing on 30 / 50 / 70 / 90. */
/* Six steps instead of four, so the gap between them comes down to keep the same overall arc:
   the last eruption still lands at 90s, exactly where it did with four 20s steps. At 20s a
   piece each the sixth would not arrive until 130s, and rounds do not last that long — the
   pattern would have been untestable rather than merely slow. STEP must stay above WARN, or
   two bands would want to blink at once and warnState only reports one.
   Adjustable live through KFC.zoneCfg for exactly the reason above: the interesting part of
   this pattern is the last two steps, and reaching them at defaults needs a stalemate. */
let GRACE=22000, WARN=8000, STEP=8600;
let ringOf=null, MAX_RING=0, roundT0=0;
/* A DIAMOND collapse, closing in from the four corners.
   The only thing that changes is the metric. Distance from the middle measured the taxicab way
   — row distance PLUS column distance — makes every equidistant set a diamond, so taking the
   farthest squares first eats the corners and leaves a diamond behind. Row bands left an alley
   five wide and two tall, where every piece is already on the front line and the knight and
   bishop have nothing to work with; a diamond keeps depth and width at the same coverage and
   turns the surviving lanes into diagonals.

     rowC  0 on the middle row, 4 at either back rank (nine rows)
     colC  0 on the middle column, 3 at either side (seven columns)
     d     0 on the one centre square, 7 in a corner

   Both kings start at d=3, so the two sides are equidistant from the middle at every step —
   symmetric by construction, which a corner-biased pattern would not be.

   Band index is MAXD-d so that band 0 is still "erupts first", which is what deadRing and the
   warning blink already assume. Eight bands on the 7×9 board: 4, 8, 12, 14, 12, 8, 4 and 1
   squares; the step came down from 12s to 8.6s so the last eruption still lands at 90s. */
function buildRings(){
  ringOf=new Int8Array(ROWS*COLS); MAX_RING=0;
  /* floor and ceil of the middle, so this is right on an even board (two middle rows) and on
     an odd one (they collapse to the same row) without a special case. */
  const rowC=r=>Math.min(Math.abs(r-Math.floor((ROWS-1)/2)),Math.abs(r-Math.ceil((ROWS-1)/2)));
  const colC=c=>Math.min(Math.abs(c-Math.floor((COLS-1)/2)),Math.abs(c-Math.ceil((COLS-1)/2)));
  let maxD=0;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) maxD=Math.max(maxD,rowC(r)+colC(c));
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const k=maxD-(rowC(r)+colC(c));
    ringOf[r*COLS+c]=k; if(k>MAX_RING) MAX_RING=k;
  }
}
const ringAt=(r,c)=>ringOf[r*COLS+c];
/* A LEVEL predicate, not an edge-triggered event: idempotent, needs no bookkeeping, survives a
   backgrounded tab that jumps several rings at once, and also catches a piece that walks into
   an already-erupted ring — which edge-triggering misses. */
function deadRing(t){
  return Math.max(-1, Math.min(MAX_RING, Math.floor((t-roundT0-GRACE-WARN)/STEP)));
}
function warnState(t){
  const k=deadRing(t)+1;
  if(k>MAX_RING) return null;
  const start=roundT0+GRACE+k*STEP;
  return t<start ? null : {ring:k, u:Math.min(1,(t-start)/WARN)};
}
const eruptAt=k=>roundT0+GRACE+WARN+k*STEP;
/* How dangerous a ring is right now: 0 while its eruption is comfortably away, rising to 1 as
   the deadline arrives. A CONTINUOUS gradient, not a "is this the next ring" test — the latter
   only pushed a piece one ring inward and then let the other terms walk it straight back out. */
const URGENCY_LEAD=14000;
function urgency(k,t){
  const left=eruptAt(k)-t;
  return left<=0 ? 1 : Math.max(0, 1-left/URGENCY_LEAD);
}
/* No base restriction any more. It existed to stop spawn camping while the objective was gold,
   but with king capture as the win condition a king sitting on an unenterable back row simply
   cannot be reached and the round can never end. The whole board is live. */

const PIECE_SVGS=JSON.parse(document.getElementById('pieceData').textContent);

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const endEl=document.getElementById('end');

let W=0,H=0,dpr=1,S=48,ox=0,oy=0;
/* the two thin gold meters are gone — the score lives in the player banners now */
let topGut=0, botGut=0;           // vertical bands reserved for the two meters

/* ================= state ================= */
let pieces=[], idSeq=0, gameOver=null;
let drag=null, selected=null;
let botNext=0, botSnipe=0, lastBotMove=0, botEnabled=true;
let started=false;            // false while the settings screen is up: nothing moves
/* One sim clock, pausable. Every timestamp in the game — cdEnd, move.start, roundT0, botNext,
   roundBreak — is absolute against now(), so pausing it freezes pieces, cooldowns, the bot and
   the spikes together with zero jump. That is what hit-stop needs. Skipping update() instead is
   not a freeze (draw keeps interpolating), and clamping only the render clock makes every piece
   in flight jump most of a square when it releases. Anything that must keep moving THROUGH a
   freeze — flashes, shake, the premove pulse — reads wall() instead. */
const wall=()=>performance.now();
let simLag=0, frzAt=0, frzUntil=0;
const now=()=>{
  const w=wall();
  if(frzUntil){ if(w<frzUntil) return frzAt-simLag; simLag+=frzUntil-frzAt; frzUntil=0; }
  return w-simLag;
};
function hitStop(ms){
  now(); const w=wall();
  if(frzUntil){ frzUntil=Math.max(frzUntil,w+ms); return; }
  frzAt=w; frzUntil=w+ms;
}
/* wall-clock effects: {kind,x,y,t0,dur,...}, drawn by drawFx() and pruned when spent */
const fx=[];

/* ================= the tactical layer =================
   Chess has enormous decision depth and almost all of it is latent: a fork is a fork before
   anything dies, a check is a threat before it lands. Turn-based chess gives the player unlimited
   time to compute that structure, and computing it IS the game. Real time removes the time, so
   the structure is still there but nobody can see it — and what is left to see is pieces sliding
   about and occasionally dying. That is why it reads as a toy.
   So this is not decoration. It is the game showing its own hidden state, because the player no
   longer has the time to derive it. Fighting games learned exactly this: frame data is invisible
   and too fast to read, so the screen shouts COUNTER HIT and counts the combo.

   Three primitives, so the whole thing has one voice:
     callout  a word that pops over a piece, holds, drifts up and fades
     spark    a mote that crosses from attacker to target on a shallow arc and pops on arrival —
              it DRAWS THE LINE OF ATTACK, which is the thing a new player cannot see
     mark     a glyph hovering over a piece for a moment
   Three detections, all at the moment a piece lands:
     CHECK    the lander attacks a king: spark to the king, "!" over it. Both directions — in
              real time you cannot see a check coming, and losing the king to a snipe you never
              saw is the game's worst moment.
     FORK     the lander attacks two or more pieces: a spark to each, FORK! over the lander.
     DODGE    an enemy launched at your piece's square and you were gone when it landed.
              The purest real-time-only moment: it is what makes this not turn chess.
   The big words are YOURS only. When the enemy checks or forks you, you get the spark and the
   mark in red and no text — the words stay attached to things you did, which is what makes them
   feel earned, and the enemy's tactics become warnings rather than taunts. */
const TACT={mine:'#ffe14a', theirs:'#ff6a5c', calloutMs:1050, sparkMs:230, markMs:1500};
let tacticsLog=[];
function logTactic(kind,side,t){ tacticsLog.push({kind,side,t:Math.round(t)}); if(tacticsLog.length>60) tacticsLog.shift(); }
/* The body centre is what sparks fly between and what marks hover above: the sprite box's
   middle, not the square's, so a tall piece is hit in the chest rather than at the feet. */
function bodyCentre(p){ const R=pieceRect(p,now()); return [R.cx, R.footY-R.lift-R.h*0.42]; }
/* The one square of a piece that its arrow stays UNDER: a cell's worth above the foot, at the
   piece's current position. Not the whole sprite box — the art is half a square taller than
   that, and the overhanging crown is exactly where a one-square-up arrow's head lands. Clipping
   to the box hid the head behind the crown, which defeated the bow. */
function bodyRect(p,T){ const R=pieceRect(p,T); const foot=R.footY-R.lift;
  return {x:R.cx-S/2, y:foot-S, w:S, h:S}; }
function crownAnchor(p){ const R=pieceRect(p,now()); return [R.cx, R.y-R.lift-S*0.16]; }
function calloutOver(p,text,col,big){
  const [x,y]=crownAnchor(p);
  fx.push({kind:'callout',x,y,text,col,big:!!big,t0:wall(),dur:TACT.calloutMs});
}
function sparkTo(a,b,col){
  const A=bodyCentre(a), B=bodyCentre(b), t0=wall();
  fx.push({kind:'spark',x0:A[0],y0:A[1],x1:B[0],y1:B[1],col,t0,dur:TACT.sparkMs});
  fx.push({kind:'pop',x:B[0],y:B[1],col,t0:t0+TACT.sparkMs,dur:260});
}
/* One mark per piece. A king under attack from three pieces in a row gets one "!" that keeps
   being refreshed, not three stacked on top of each other. */
function markOn(p,glyph,col){
  const have=fx.find(f=>f.kind==='mark'&&f.pid===p.id);
  if(have){ have.t0=wall(); have.col=col; return; }
  fx.push({kind:'mark',pid:p.id,glyph,col,t0:wall(),dur:TACT.markMs});
}
function tacticsOnLanding(p,mv,t){
  const mine=p.side==='w', col=mine?TACT.mine:TACT.theirs;
  /* Everything this piece now attacks. Pieces in flight are immune to capture and so are not
     attacked; canAttackFrom already knows about blocked rays. */
  const hits=[];
  for(const q of pieces){
    if(q===p||!q.alive||q.side===p.side||q.move) continue;
    if(canAttackFrom(p.type,p.r,p.c,q.r,q.c,p.side)) hits.push(q);
  }
  const king=hits.find(q=>q.type==='K');
  if(king){ sparkTo(p,king,col); markOn(king,'!',col); logTactic('check',p.side,t); }
  if(hits.length>=2){
    for(const q of hits) if(q!==king) sparkTo(p,q,col);
    if(mine) calloutOver(p, king?'ROYAL FORK!':'FORK!', col, !!king);
    logTactic(king?'royalfork':'fork',p.side,t);
  }
  /* DODGE: this piece launched at an enemy that was standing on its destination, and that
     enemy is alive and somewhere else. Only ever a word for YOUR piece getting away; the enemy
     getting away from you is a whiff, and nobody needs that pointed out. */
  if(mv&&mv.targetId!=null){
    const tg=pieces.find(q=>q.id===mv.targetId);
    if(tg&&tg.alive){
      const [tr,tc]=curSquare(tg);
      if(!(tr===p.r&&tc===p.c)){
        if(tg.side==='w') calloutOver(tg,'DODGE!',TACT.mine,false);
        logTactic('dodge',tg.side,t);
      }
    }
  }
}
let shakeT0=-1e9, shakeAmp=0;
const SHAKE_MS=300;
function flashAt(r,c,big){
  const [x,y]=center(r,c);
  fx.push({kind:'hit',x,y,t0:wall(),dur:big?420:260,big:!!big});
  /* The piece on this square: a fresh corpse first (captures set alive=false before calling
     here), else the live occupant (spawns and raises). Its side picks the debris colour. */
  const dead=pieces.find(q=>q.r===r&&q.c===c&&!q.alive&&!q.move);
  const live=dead?null:pieces.find(q=>q.r===r&&q.c===c&&q.alive&&!q.move);
  if(dead)      burstAt(x,y, SIDE_COL[dead.side], !!big);      // a kill
  else if(live) puffAt(x,y, SIDE_COL[live.side], !!big);       // a spawn, a raise, an ult
  else          burstAt(x,y, '#ffffff', !!big);
}
function shake(amp){ shakeT0=wall(); shakeAmp=amp; }

/* ================= particles =================
   One emitter for every burst in the game. Wall-clock, stepped with a clamped dt so a throttled
   tab cannot fling everything off-screen in one frame, and it keeps moving through a hit-stop
   — the freeze is for the SIM, and debris that also froze would read as a dropped frame.
   Each particle: position, velocity, gravity, drag, a life, a size that shrinks, a colour, and
   an optional additive blend (sparks glow; shards do not). */
const parts=[]; let partsW=0;
const SIDE_COL={w:'#8fd0ff', b:'#ff9a86'};
function emit(o){
  const n=o.n||12;
  for(let i=0;i<n;i++){
    const ang=(o.angle!==undefined?o.angle:Math.random()*6.283)+(Math.random()-.5)*(o.spread||6.283);
    const sp=(o.speed||S*4)*(0.55+Math.random()*0.9);
    const sz=(o.size||S*0.07)*(0.6+Math.random()*0.8);
    parts.push({x:o.x+(Math.random()-.5)*(o.jitter||0), y:o.y+(Math.random()-.5)*(o.jitter||0),
      vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp+(o.up||0),
      g:o.gravity===undefined?S*9:o.gravity, drag:o.drag===undefined?2.2:o.drag,
      life:(o.life||0.7)*(0.7+Math.random()*0.6), age:0, r:sz,
      col:Array.isArray(o.col)?o.col[i%o.col.length]:(o.col||'#fff'),
      add:!!o.add, shape:o.shape||'dot', spin:(Math.random()-.5)*12, rot:Math.random()*6.283});
  }
}
/* Presets. Colour comes from the side where it makes sense, gold where it is the hourglass. */
/* Something DIED here: shards of it in its own colour, a few white sparks, and for a king a
   drift of gold embers on top. */
function burstAt(x,y,col,big){
  emit({x,y,n:big?22:12, col, speed:S*(big?6:4.2), gravity:S*11, drag:2.0, life:big?0.8:0.55,
        size:S*(big?0.07:0.055), shape:'shard'});
  emit({x,y,n:big?12:7, col:'#ffffff', speed:S*(big?8:5.5), gravity:S*4, drag:3.2, life:0.38,
        size:S*0.04, shape:'spark', add:true});
  if(big) emit({x,y,n:12, col:'#ffd76a', speed:S*2.6, gravity:-S*2, drag:1.6, life:1.0, size:S*0.05, add:true});
}
/* Something ARRIVED here: a soft puff of its colour that lifts and fades. No shards — nothing
   broke. Slightly fuller for a big arrival (the ult on a king). */
function puffAt(x,y,col,big){
  emit({x,y,n:big?14:9, col:[col,'#ffffff'], speed:S*1.6, gravity:-S*3, drag:2.4, life:0.6,
        size:S*0.075, add:true, jitter:S*0.35});
}
function castAt(x,y,col){         // an ultimate: a slow expanding ring of glowing motes
  emit({x,y,n:28, col:[col,'#ffffff'], speed:S*3.2, gravity:-S*1.5, drag:1.9, life:0.95,
        size:S*0.065, add:true});
}
function drawParts(){
  const w=wall();
  const dt=Math.min(0.05, partsW?(w-partsW)/1000:0); partsW=w;
  if(!parts.length) return;
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];
    q.age+=dt;
    if(q.age>=q.life){ parts.splice(i,1); continue; }
    q.vy+=q.g*dt;
    const k=Math.max(0,1-q.drag*dt); q.vx*=k; q.vy*=k;
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.rot+=q.spin*dt;
    const u=q.age/q.life, a=u<0.7?1:(1-u)/0.3;
    const r=q.r*(1-u*0.55);
    ctx.globalAlpha=a*(q.add?0.9:1);
    if(q.add) ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=q.col; ctx.strokeStyle=q.col;
    if(q.shape==='spark'){
      ctx.lineWidth=Math.max(1,r*0.9); ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(q.x-q.vx*0.045,q.y-q.vy*0.045); ctx.stroke();
    }else if(q.shape==='shard'){
      ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.rot);
      ctx.fillRect(-r,-r*0.55,r*2,r*1.1); ctx.restore();
    }else{
      ctx.beginPath(); ctx.arc(q.x,q.y,r,0,7); ctx.fill();
    }
    if(q.add) ctx.globalCompositeOperation='source-over';
  }
  ctx.globalAlpha=1;
}

/* hr/hc is the piece's home square — where it returns when its king is killed */
function makePiece(side,type,r,c){
  return {id:idSeq++,side,type,r,c,hr:r,hc:c,move:null,cdStart:0,cdEnd:0,queued:null,alive:true,hp:1};
}
/* Army beyond the king, in the order pieces get added as you raise the count. Rook first, then
   knight — a 3-piece army is King + Rook + Knight. */
const ROSTER=['R','N','B','Q','R','N','B','Q'];
/* k pieces spread evenly across the width */
function frontSlots(k){
  if(k<=0) return [];
  if(k===1) return [Math.floor(COLS/2)];
  const out=[];
  for(let i=0;i<k;i++) out.push(Math.round(i*(COLS-1)/(k-1)));
  return out;
}
/* [type, depth from own back rank, column] for an army of n pieces.
   Everything spawns at depth 0 — in the base row itself. The base is a single row now, so the
   old depth-1 front rank put most of the army outside the only ground the other side cannot
   enter, and it left the king standing directly behind a piece in its own file, which with
   art this tall read as one two-headed piece. The king takes the middle slot of an even
   spread; on an even-width board that is half a column off centre, which is the closest a
   single piece can sit. */
/* What a side actually fields, decided by its perk. */
/* One army for everyone: king, rook, knight, bishop. That is the Troops loadout the player
   had by default, so the board looks the way it has all along — just the same for both sides. */
function armyTypes(side){ return ['K','R','N','B']; }
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const v=a[i];a[i]=a[j];a[j]=v;}return a;};
/* Random distinct columns AND a shuffled assignment, per side, so no two rounds open alike
   and the king is not reliably in the middle. */
function armyLayout(side){
  const types=shuffle(armyTypes(side).slice());
  const n=Math.min(types.length,COLS);
  const all=[]; for(let c=0;c<COLS;c++) all.push(c);
  const pick=shuffle(all).slice(0,n).sort((a,b)=>a-b);
  return types.slice(0,n).map((t,i)=>[t,0,pick[i]]);
}
/* Both armies to their start squares. Split out of reset() because a new ROUND needs exactly
   this and must NOT touch the match score. */
function layoutArmies(){
  pieces=[];idSeq=0;drag=null;selected=null;
  for(const side of ['w','b']){
    for(const [t,d,c] of armyLayout(side)){
      const row = side==='w' ? (cfg.flip ? d : ROWS-1-d) : (cfg.flip ? ROWS-1-d : d);
      const p=makePiece(side,t,row,c);
      pieces.push(p);
    }
  }
}
function reset(){
  layoutArmies(); gameOver=null; shrineNewMatch(); boltReset(); bombReset();
  points={w:0,b:0}; roundNo=1; roundBreak=0; roundMsg=null; goT=0;
  const t2=now();
  countIn = started ? t2+COUNT_MS : 0;
  stampEntrances(started ? t2 : -1);            // the army drops in under the count-in
  roundT0 = countIn || t2;
  botNext=t2+1500; botSnipe=0; lastBotMove=t2;
  endEl.classList.remove('show');
}
/* The bot's matchup is rolled once per match, at the VS screen, so what you read there is what
   you actually fight. */

/* ================= board queries ================= */
function stationaryAt(r,c){
  for(const p of pieces) if(p.alive&&!p.move&&p.r===r&&p.c===c) return p;
  return null;
}
function reservedByFriendly(side,r,c){
  for(const p of pieces) if(p.alive&&p.side===side&&p.move&&p.r===r&&p.c===c) return true;
  return false;
}
function curSquare(p){
  if(!p.move) return [p.r,p.c];
  const t=Math.min(1,(now()-p.move.start)/p.move.dur);
  return [Math.round(p.move.fr+(p.r-p.move.fr)*t), Math.round(p.move.fc+(p.c-p.move.fc)*t)];
}

/* ================= move generation ================= */
const DIRS_R=[[1,0],[-1,0],[0,1],[0,-1]];
const DIRS_B=[[1,1],[1,-1],[-1,1],[-1,-1]];
const KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
const inB=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS;

function legalMoves(p){
  const res=[], dr0=deadRing(now());        // resolved once: legalMoves runs very hot
  const spiked=(r,c)=>ringOf[r*COLS+c]<=dr0;
  const push=(r,c)=>{
    if(spiked(r,c)||shrineBlocks(r,c)||bombBlocks(r,c)) return;   // spikes fill the square; so do the shrine and a bomb
    if(!reservedByFriendly(p.side,r,c)) res.push([r,c]);
  };
  const ray=(dr,dc,max)=>{
    let r=p.r+dr,c=p.c+dc,n=0;
    while(inB(r,c)&&n<max){
      if(spiked(r,c)||shrineBlocks(r,c)||bombBlocks(r,c)) break;  // nor slide through them, the shrine, or a bomb
      const occ=stationaryAt(r,c);
      if(occ){ if(occ.side!==p.side) push(r,c); break; }
      push(r,c); r+=dr; c+=dc; n++;
    }
  };
  const step=(r,c)=>{
    if(!inB(r,c)) return;
    const occ=stationaryAt(r,c);
    if(!occ||occ.side!==p.side) push(r,c);
  };
  if(p.type==='R'||p.type==='Q') for(const [dr,dc] of DIRS_R) ray(dr,dc,RANGE.R);
  if(p.type==='B'||p.type==='Q') for(const [dr,dc] of DIRS_B) ray(dr,dc,RANGE.B);
  if(p.type==='N') for(const [dr,dc] of KN) step(p.r+dr,p.c+dc);
  /* Classic pawn: one square forward if empty, captures ONLY diagonally forward. It cannot use
     step(), which allows capture-on-arrival — a pawn must not take what stands in front of it.
     White spawns on the far row, so forward is -1 for white. */
  if(p.type==='P'){
    const fwd = (p.side==='w') !== !!cfg.flip ? -1 : 1;
    const fr=p.r+fwd;
    if(inB(fr,p.c)&&!stationaryAt(fr,p.c)) push(fr,p.c);
    for(const dc of [-1,1]){
      const cc=p.c+dc;
      if(!inB(fr,cc)) continue;
      const occ=stationaryAt(fr,cc);
      if(occ&&occ.side!==p.side) push(fr,cc);
    }
  }
  if(p.type==='K') for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    if(dr||dc) step(p.r+dr,p.c+dc);
  }
  return res;
}
function isLegal(p,r,c){ return legalMoves(p).some(m=>m[0]===r&&m[1]===c); }

function startMove(p,r,c){
  const d=Math.hypot(r-p.r,c-p.c);
  /* An immediate move that supersedes a queued one to a different square: that arrow dissolves.
     The release of the queued move itself (same square) is not a cancel and gets nothing. */
  if(p.queued&&(p.queued[0]!==r||p.queued[1]!==c)) dropQueued(p,'replace');
  /* targetId: the enemy standing on the destination at launch, if any. A dodge is defined by
     it — the attacker arrives and that exact piece is alive and elsewhere. */
  const tgt=stationaryAt(r,c);
  p.move={fr:p.r,fc:p.c,start:now(),dur:Math.max(120,d/SPEED*1000),
          targetId:(tgt&&tgt.side!==p.side)?tgt.id:null};
  p.lastFrom=[p.r,p.c]; p.lastDur=p.move.dur;   // the trail needs these after move is nulled
  p.r=r; p.c=c; p.queued=null;
}
/* Every square a queued move will travel THROUGH, origin excluded, destination included.
   A knight has no path at all — it leaves one square and arrives on another with nothing in
   between — so the only square that can ever block it is where it is going. */
function movePath(p,r,c){
  if(p.type==='N') return [[r,c]];
  const steps=Math.max(Math.abs(r-p.r),Math.abs(c-p.c)), out=[];
  if(steps===0) return [[r,c]];
  for(let k=1;k<=steps;k++)
    out.push([Math.round(p.r+(r-p.r)*k/steps), Math.round(p.c+(c-p.c)*k/steps)]);
  return out;
}
/* Somebody landed. Any queued move whose path now runs through them is dead, and the arrow has
   to go NOW rather than at release: a premove that fires into a body is silently dropped by the
   isLegal re-check below, so the player watches a five-second cooldown run down on a plan that
   was already impossible and gets no hint of it.

   One exception, and it is the whole reason this is not just "cancel if blocked": an ENEMY
   landing on the DESTINATION is exactly what a capture premove is waiting for. Cancelling there
   would make it impossible to ever pre-aim at a square somebody is about to step onto, which is
   the most satisfying thing in the game. Anywhere else on the path, an enemy blocks the road and
   the premove dies. A FRIENDLY piece cancels wherever it lands, destination included — you
   cannot capture your own, so a teammate arriving is a wall in every case. */
/* Every way a queued order can end other than by firing goes through here, so the arrow never
   just blinks out. The effect keeps the arrow's geometry and fades it on wall time, and HOW it
   fades says why: 'replace' and 'cancel' dissolve (you changed your mind, with a small puff at
   the square you gave up), 'blocked' flickers white then red and retracts into a red burst at
   the destination (the game took the order from you). */
function dropQueued(p,reason){
  if(!p.queued) return;
  const [qr,qc]=p.queued;
  fx.push({kind:'arrowGone', pid:p.id, side:p.side, fr:p.r, fc:p.c, tr:qr, tc:qc,
           bowed:arrowBows(p.r,p.c,qr,qc), reason, t0:wall(), dur:reason==='blocked'?260:170});
  if(reason!=='replace'&&(p.side==='w'||enemyArrowsOn())){
    const [x,y]=center(qr,qc);
    fx.push({kind:'pop',x,y,col:reason==='blocked'?'#ff6a5c':'#dbe8ff',t0:wall(),dur:240});
  }
  p.queued=null;
}
function invalidatePremoves(lander){
  for(const p of pieces){
    if(!p.alive||!p.queued||p===lander) continue;
    const [qr,qc]=p.queued;
    for(const [sr,sc] of movePath(p,qr,qc)){
      if(sr!==lander.r||sc!==lander.c) continue;
      if(sr===qr&&sc===qc&&lander.side!==p.side) break;   // the capture it was aiming for
      dropQueued(p,'blocked');
      break;
    }
  }
}
/* ================= head-on collisions =================
   Two ENEMY pieces flying along the same line in opposite directions meet in the air. The one
   that has travelled further by the moment they meet wins; the other dies on the spot, and the
   winner flies on. Before this they passed through each other and swapped squares, which is
   the one thing a fight between two pieces on one file should never look like.

   Deliberately narrow. Pieces crossing at different angles never touch — every crossing on a
   board full of flight paths is not a crash — and a piece never collides with one moving the
   same way, because everything flies at one speed and nothing can overtake. A knight's flight
   is the straight segment between its squares, so knight into knight along exactly reversed
   L's counts, which is the case that was asked for by name. Friendly pieces still pass: a
   collision that killed one of your own would be a new way to lose material.

   The geometry is done in whole squares on the launch data, so "collinear" and "opposite" are
   exact integer tests rather than epsilon comparisons. The meeting time is solved in closed
   form — both positions are linear in time between launch and landing — and a pair collides
   only if that instant falls inside BOTH flights. That settles the trap case for free: a piece
   launching after the other has already passed its square gets a meeting time before its own
   launch, and is ignored. */
function headOn(a,b){
  const A=a.move, B=b.move;
  const dAr=a.r-A.fr, dAc=a.c-A.fc, dBr=b.r-B.fr, dBc=b.c-B.fc;
  if(dAr*dBc-dAc*dBr!==0) return null;                     // not parallel
  const oBr=B.fr-A.fr, oBc=B.fc-A.fc;
  if(dAr*oBc-dAc*oBr!==0) return null;                     // parallel, but a different line
  if(dAr*dBr+dAc*dBc>=0) return null;                      // the same way, or not moving
  const LA=Math.hypot(dAr,dAc), LB=Math.hypot(dBr,dBc);
  const s0B=(oBr*dAr+oBc*dAc)/LA;                          // b's launch square along a's axis
  /* Positions along a's axis on the SAME ease the renderer draws with. The constant-velocity
     model that was here put the meeting at the midpoint of two equal flights, when the screen
     already had both pieces past each other — an ease-out is 73% of the way at half time — so
     the loser died late, and on the wrong square. Eased distance is monotone in time, so the
     meeting is a bisection over the window in which both are in the air. */
  const eA=t=>LA*moveCurve(clamp01((t-A.start)/A.dur));
  const eB=t=>LB*moveCurve(clamp01((t-B.start)/B.dur));
  const gap=t=>eA(t)+eB(t)-s0B;                            // below zero while apart, zero when they meet
  let lo=Math.max(A.start,B.start), hi=Math.min(A.start+A.dur,B.start+B.dur);
  if(hi<=lo||gap(lo)>=0||gap(hi)<0) return null;           // never both in the air, already past, or one lands first
  for(let i=0;i<26;i++){ const m=(lo+hi)/2; if(gap(m)<0) lo=m; else hi=m; }
  const tStar=hi, travA=eA(tStar), travB=eB(tStar);
  return {t:tStar, travA, travB,
          r:Math.round(A.fr+dAr/LA*travA), c:Math.round(A.fc+dAc/LA*travA)};
}
/* The sweep. A slider whose flight passes OVER an enemy standing on its path kills it in
   passing — a piece that lands in the line of a rook already in the air has stepped into the
   blade, not behind it. Checked every tick against the mover's eased position, so the kill
   happens as the body crosses the square, not at landing. Stationary enemies only: two fliers
   on one line are a clash, a piece crossing the line in the air is untouched, and a piece that
   lands BEHIND the mover is safe. Knights have no path; the destination is the landing
   capture's business. */
function sweepPath(t){
  for(const p of pieces){
    if(!p.alive||!p.move||p.type==='N') continue;
    const A=p.move, dr=p.r-A.fr, dc=p.c-A.fc, L=Math.hypot(dr,dc); if(L<1.5) continue;
    const e=moveCurve(clamp01((t-A.start)/A.dur))*L, ur=dr/L, uc=dc/L;
    for(const q of pieces){
      if(q===p||!q.alive||q.move||q.side===p.side) continue;
      const qr=q.r-A.fr, qc=q.c-A.fc;
      if(Math.abs(qr*uc-qc*ur)>1e-6) continue;                 // not on the line
      const d=qr*ur+qc*uc;
      if(d<=0.5||d>=L-0.5) continue;                            // the origin or the destination: not a sweep
      if(e<d-0.30||e>d+0.55) continue;                          // the blade is not over it
      const king=q.type==='K';
      q.alive=false; q.move=null; q.queued=null; q.hp=0;
      flashAt(q.r,q.c,king); hitStop(king?180:90); sfxCapture(king); if(king) shake(S*0.12);
      logTactic('sweep',p.side,t); kitCredit(p.side);
      if(p.side==='w') calloutOver(q,'SWEPT!',TACT.mine,false);
      if(king&&!roundBreak){ endRound(q.side,t); return true; }
    }
  }
  return false;
}
function airCollisions(t){
  const fl=pieces.filter(p=>p.alive&&p.move);
  for(let i=0;i<fl.length;i++) for(let j=i+1;j<fl.length;j++){
    const a=fl[i], b=fl[j];
    if(a.side===b.side||!a.alive||!b.alive||!a.move||!b.move) continue;
    const h=headOn(a,b);
    if(!h||h.t>t) continue;
    /* Further travelled wins. The tie-break is who launched first, since they committed first;
       a dead heat on both, which only a test can manufacture, takes both. */
    let losers;
    if(h.travA>h.travB) losers=[b]; else if(h.travB>h.travA) losers=[a];
    else if(a.move.start<b.move.start) losers=[b]; else if(b.move.start<a.move.start) losers=[a];
    else losers=[a,b];
    const winner=losers.length===1?(losers[0]===a?b:a):null;
    let kW=false,kB=false;
    for(const L of losers){
      L.alive=false; L.move=null; L.queued=null; L.hp=0;
      L.r=h.r; L.c=h.c;                                    // it died where they met
      const king=L.type==='K';
      flashAt(h.r,h.c,king);
      if(king){ if(L.side==='w') kW=true; else kB=true; }
    }
    const anyKing=kW||kB;
    hitStop(anyKing?180:110); sfxCapture(anyKing); shake(S*(anyKing?0.12:0.06));
    logTactic('clash', winner?winner.side:'-', t); if(winner) kitCredit(winner.side);
    if(anyKing&&!roundBreak){
      if(kW&&kB) drawRound(t); else endRound(kW?'w':'b',t);
      return true;
    }
  }
  return false;
}
/* returns true if the move was accepted (started or queued) */
function issue(p,r,c){
  if(!isLegal(p,r,c)) return false;
  /* One square, one intention — and it applies whether this order fires NOW or is queued. The
     square is taken the moment anybody on your side commits to it, so a teammate's premove
     aimed there is already dead and its arrow has to go.
     This used to sit inside the queued branch only, which missed the commonest case in the
     game by a mile: you pre-aim a capture, get impatient, and take it with a piece that is off
     cooldown. That piece STARTS immediately, so nothing cleared the first arrow — it hung there
     pointing at a square your own piece was about to occupy, then got silently dropped when it
     finally released. The landing check catches it a second later; this catches it on the tap,
     which is when the player is actually looking. */
  for(const q of pieces)
    if(q!==p&&q.alive&&q.side===p.side&&q.queued&&q.queued[0]===r&&q.queued[1]===c) dropQueued(q,'cancel');
  p.castAt=wall();                                   // the surge runs from this instant
  if(!p.move&&now()>=p.cdEnd) startMove(p,r,c);
  else{
    if(p.queued&&(p.queued[0]!==r||p.queued[1]!==c)) dropQueued(p,'replace');   // re-aimed: the old one dissolves
    p.queued=[r,c];
  }
  return true;
}

/* ================= the wipe =================
   Between one board and the next — a round's end into the next round, a trial into the next or
   into its retry — the screen dips to dark and comes back, and the swap happens under the dark:
   no army snapping into new squares, no card resetting in plain view. Wall time, drawn last. */
let wipe=null;
function beginWipe(fn,dur){ wipe={t0:wall(), dur:dur||560, pending:fn, fired:false}; }
function wipeTick(){
  if(!wipe) return;
  const u=(wall()-wipe.t0)/wipe.dur;
  if(!wipe.fired&&u>=0.5){ wipe.fired=true; const fn=wipe.pending; wipe.pending=null; if(fn) fn(); }
  if(u>=1) wipe=null;
}
const wipeAlpha=()=>{ if(!wipe) return 0; const u=(wall()-wipe.t0)/wipe.dur; return u<0.5 ? u/0.5 : Math.max(0,1-(u-0.5)/0.5); };
function drawWipe(){ const a=wipeAlpha(); if(a<=0) return; ctx.fillStyle='rgba(10,6,18,'+a.toFixed(3)+')'; ctx.fillRect(0,0,W,H); }

/* ================= simulation ================= */
function update(){
  if(!started||gameOver) return;
  wipeTick();
  const t=now();
  /* Between rounds the board is frozen: the kill has landed, the point is on the banner, and
     nothing should move until the next round starts. */
  if(roundBreak){
    /* The campaign decides HERE as well as after the sweep, because a king kill calls endRound
       from the arrivals loop, the sweep or a collision and returns at once — a check placed
       after the sweep never sees it, and every later tick returns at this gate. */
    if(campaign.active) campaignDecide(t);
    if(t>=roundBreak){
      /* The break is over: dip to dark and swap under it — the next trial, its retry, or the
         next round — then the dip lifts on the new board. */
      if(!wipe) beginWipe(campaign.active&&campaign.decided ? ()=>campaignResolve(now()) : ()=>startRound(now()));
      wipeTick();
    }
    return;
  }
  /* Nothing runs during the count-in — not the spikes, not the bot. Starting the clocks here
     rather than in startRound is what makes "3-2-1" cost the round nothing. */
  if(countIn){
    if(t<countIn) return;
    countIn=0; goT=t;
    roundT0=t;
    if(campaign.active) campaignOnPlay(t);     // the trial clock and any staged cooldowns start NOW, not under the card
    botNext=t+400; botSnipe=0; lastBotMove=t;
  }
  /* Head-on collisions first, so a piece killed in the air never gets to land in the same tick. */
  if(airCollisions(t)) return;
  /* Then the sweep: a slider passing over an enemy standing on its path kills it as it goes. */
  if(sweepPath(t)) return;
  boltSweep(t);                                             // a slider takes the bolts it flies over
  // arrivals, in true landing order
  const arriving=pieces.filter(p=>p.alive&&p.move&&t>=p.move.start+p.move.dur)
    .sort((a,b)=>(a.move.start+a.move.dur)-(b.move.start+b.move.dur));
  for(const p of arriving){
    if(!p.alive) continue;      // load-bearing: p may have been wiped by an earlier arrival
    const mv=p.move;            // the tactics read targetId off this after move is nulled
    p.move=null; p.cdStart=t; p.cdEnd=t+COOLDOWN;
    for(const q of pieces){
      if(q!==p&&q.alive&&q.side!==p.side){
        if(q.move) continue;          // in the air it cannot be landed on: the only death in flight is the head-on clash
        const [qr,qc]=curSquare(q);
        if(qr===p.r&&qc===p.c){
          /* Citadel: the defender cannot be captured, so the ARRIVING piece dies instead.
             Break afterwards — a dead attacker cannot go on to kill others on this square. */
          /* Life: a 2 HP king survives its first capture and takes the attacker with it.
             A KING capturing a king pierces both points at once and walks away — the one
             exception, so a king duel is still decisive. */
          if(q.type==='K'&&q.hp>1&&p.type!=='K'){
            q.hp--;
            p.alive=false; p.move=null; p.queued=null;
            flashAt(p.r,p.c,true); hitStop(140); shake(S*0.08); sfxCapture(false);
            break;
          }
          q.alive=false; q.move=null; q.queued=null; q.hp=0;
          kitCredit(p.side);
          /* The hit lands: freeze the whole game for a beat with a flash on the square. A king
             kill freezes longer, flashes bigger and shakes the screen. Every fighting game does
             this, for exactly our problem — a one-frame kill needs felt weight. */
          const king = q.type==='K';
          flashAt(p.r,p.c,king);
          hitStop(king?180:90);
          sfxCapture(king);          // the king's death is the same patch with its envelopes opened
          if(king) shake(S*0.12);
          // the king falls, the round is over
          if(king&&!roundBreak){ endRound(q.side,t); return; }
        }
      }
    }
    /* AFTER the capture scan, and only if this piece survived it: a lander that died on arrival
       is blocking nothing. */
    if(p.alive){ invalidatePremoves(p); tacticsOnLanding(p,mv,t); collectBolt(p,t,'land'); }
  }
  /* Spikes. A piece IN FLIGHT is immune — the rule is "kills what stands on it", which makes a
     dash across a closing ring a real escape rather than a death sentence. It still dies on the
     next tick if it lands there. */
  const dRing=deadRing(t);
  if(dRing>=0){
    const nW=pieces.filter(p=>p.alive&&p.side==='w').length;
    const nB=pieces.filter(p=>p.alive&&p.side==='b').length;
    let kW=false,kB=false;
    for(const p of pieces){
      if(!p.alive||p.move) continue;
      if(ringOf[p.r*COLS+p.c]<=dRing){
        p.alive=false; p.move=null; p.queued=null;
        flashAt(p.r,p.c,false);       // flash only — 24 squares erupting must not stall the game
        if(p.type==='K'){ if(p.side==='w') kW=true; else kB=true; }
      }
    }
    if(kW||kB){
      if(kW&&kB){
        /* both kings spiked in the same sweep — decide on what was standing a moment ago,
           counted BEFORE the sweep, because afterwards both sides are at zero */
        if(nW!==nB) endRound(nW>nB?'b':'w',t); else drawRound(t);
      } else endRound(kW?'w':'b',t);
      return;
    }
  }
  /* Before the premove release, so a piece standing on a mark counts before its queued move
     carries it off. */
  if(campaign.active&&campaignTick(t)) return;
  // queued premoves fire the instant cooldown ends
  for(const p of pieces){
    if(p.alive&&p.queued&&!p.move&&t>=p.cdEnd){
      const [r,c]=p.queued;
      /* No flourish on release. The arrow retracting IS the release, and a ring expanding out of
         the base at the same moment read as a second, unrelated event. */
      if(isLegal(p,r,c)) startMove(p,r,c);
      else dropQueued(p,'blocked');
    }
  }
  /* Off cooldown: the moment one of your pieces can act again, stamped on wall time for the
     shine. After the premove release on purpose — a piece whose queued move fires on this tick
     is already moving, and the launch is its own feedback. Yours only: for the enemy the
     draining veil stays the tell, since a shine on their pieces would be free information. */
  for(const p of pieces){
    const cooling=p.alive&&p.cdEnd>t;
    if(p._cool&&!cooling&&p.alive&&!p.move&&p.side==='w') p.readyAt=wall();
    p._cool=cooling;
  }
  if(campaign.active) campaignScript(t);    // the scripted opponent is the bot's stand-in
  shrineTick(t);
  boltTick(t);
  bombTick(t);
  kitTick(t);
  botThink(t);
}
/* Paper, when a round lands. Fired from where the round RESOLVES rather than from the renderer,
   so it is edge-triggered by construction and cannot double up on a frame. The board is frozen
   for the round break, so this is the one moment in the game where a shower of particles
   competes with nothing at all. */
function confettiBurst(winner){
  if(!vibeOn('confetti')) return;
  const col = winner===null ? ['#ffe28a','#ffffff','#8fd0ff','#ff9a86']
            : winner==='w' ? ['#8fd0ff','#2d7fe8','#ffe28a','#ffffff']
                           : ['#ff9a86','#e0463a','#ffe28a','#ffffff'];
  for(let i=0;i<5;i++)
    emit({x:ox+S*COLS*(i+0.5)/5, y:oy-S*0.7, n:16, col,
          speed:S*1.5, angle:Math.PI/2, spread:2.1,
          gravity:S*5.5, drag:1.05, life:2.0, size:S*0.05, jitter:S*1.7});
}
/* The king has fallen: award the point, sweep the losing army so the kill reads, and hold the
   board still for a beat. Reaching WIN_POINTS ends the match instead. */
/* The chain reaction. A king's death takes its army with it, and the army FALLS rather than
   vanishes: each surviving piece of the losing side shatters in turn, nearest the king first,
   DOOM.gap apart, and the round's word appears once the last has gone. For the rules they are
   dead the instant the king is: the round break freezes the sim at its gate before anything
   can move, land, sweep, collide or fire, and input is refused, so nothing still standing can
   act. Only its picture lingers. Processed from the draw loop on wall time, so it plays under
   the end plaque too. */
const DOOM={lead:220, gap:140};
let doomed=[];
function scheduleDoom(sides,kr,kc){
  const w=wall(), list=pieces.filter(p=>p.alive&&sides.includes(p.side)&&!(p.r===kr&&p.c===kc&&p.type==='K'));
  list.sort((a,b)=>Math.hypot(a.r-kr,a.c-kc)-Math.hypot(b.r-kr,b.c-kc));
  list.forEach((p,i)=>{ p.queued=null; p.doomAt=w+DOOM.lead+i*DOOM.gap; doomed.push(p); });
  return DOOM.lead+list.length*DOOM.gap;
}
function processDoom(){
  if(!doomed.length) return;
  const w=wall();
  for(let i=doomed.length-1;i>=0;i--){
    const p=doomed[i];
    if(!p.alive){ doomed.splice(i,1); continue; }
    if(w<p.doomAt) continue;
    const [r,c]=curSquare(p);                       // it falls where its picture is
    p.r=r; p.c=c; p.move=null; p.alive=false; p.cdStart=0; p.cdEnd=0; p.hp=0;
    flashAt(r,c,false);
    doomed.splice(i,1);
  }
}
function endRound(loser,t){
  const winner = loser==='w' ? 'b' : 'w';
  /* In a trial that is not a match, a king kill decides the trial: no point on the HUD and no
     enemy confetti for a fail. campaignDecide picks it up at the gate and sets the hold. */
  const trial = campaign.active && !(campaign.level&&campaign.level.rounds);
  if(!trial) points[winner]++;
  const K=pieces.find(p=>p.side===loser&&p.type==='K');
  const cas=scheduleDoom([loser], K?K.r:ROWS/2, K?K.c:COLS/2);
  if(drag&&drag.p.side===loser) drag=null;
  if(selected&&selected.side===loser) selected=null;
  roundMsg={winner, t:t+cas}; if(!trial) confettiBurst(winner);
  if(points[winner]>=WIN_POINTS && !campaign.active) return endGame(winner);
  roundBreak = t+cas+ROUND_GAP;
}
/* Nobody's king survived and neither side was ahead — no point, run the round again. */
function drawRound(t){
  const cas=scheduleDoom(['w','b'], (ROWS-1)/2, (COLS-1)/2);
  drag=null; selected=null;
  roundMsg={winner:null, t:t+cas}; confettiBurst(null);
  roundBreak = t+cas+ROUND_GAP;
}
/* Both armies back to their start squares at full strength, and the spikes retract — a round
   is a clean slate, so neither survivors nor the closing ring carry over. */
function startRound(t){
  roundBreak=0; roundMsg=null; roundNo++;
  layoutArmies();
  stampEntrances(t);
  kitCarry(); shrineReset(); boltReset(); bombReset();
  countIn=t+COUNT_MS;    // the gate above starts every clock when this expires
  roundT0=countIn;
}
function endGame(winner){
  gameOver={winner,t:now()};
  /* VICTORY / DEFEAT rather than "You win! 🥋". The emoji rendered as a different picture on
     every platform and was the least baked thing on the screen. */
  document.getElementById('endTitle').textContent = winner==='w' ? 'VICTORY' : 'DEFEAT';
  paintPlaqueHero('endHero', false);
  const sub=document.getElementById('endSub');
  sub.innerHTML='';
  const pip=(side,on)=>{ const i=document.createElement('i');
    i.className='pip'+(on?' on '+side:''); return i; };
  for(let i=0;i<WIN_POINTS;i++) sub.appendChild(pip('w', i<points.w));
  const vs=document.createElement('span'); vs.textContent='vs'; sub.appendChild(vs);
  /* Mirrored, exactly as the HUD does it: their score grows out of their own end. */
  for(let i=0;i<WIN_POINTS;i++) sub.appendChild(pip('b', (WIN_POINTS-1-i)<points.b));
  endEl.classList.add('show');
}

/* ================= bot ================= */
const cheb=(r0,c0,r1,c1)=>Math.max(Math.abs(r0-r1),Math.abs(c0-c1));
function clearPath(r0,c0,r1,c1){
  const dr=Math.sign(r1-r0),dc=Math.sign(c1-c0);
  let r=r0+dr,c=c0+dc;
  while(r!==r1||c!==c1){ if(stationaryAt(r,c)||shrineBlocks(r,c)||bombBlocks(r,c)) return false; r+=dr;c+=dc; }
  return true;
}
function canAttackFrom(type,r0,c0,r,c,side){
  const dr=r-r0,dc=c-c0,adr=Math.abs(dr),adc=Math.abs(dc);
  if(!adr&&!adc) return false;
  const d=Math.max(adr,adc);
  switch(type){
    case 'K': return d<=1;
    case 'N': return adr*adc===2;
    case 'R': return (!dr||!dc)&&d<=RANGE.R&&clearPath(r0,c0,r,c);
    case 'B': return adr===adc&&d<=RANGE.B&&clearPath(r0,c0,r,c);
    case 'Q': return ((!dr||!dc)?d<=RANGE.R:(adr===adc&&d<=RANGE.B))&&clearPath(r0,c0,r,c);
    /* Without this the bot is blind to pawns and hangs pieces to them, silently. */
    case 'P': return adc===1 && dr===((side==='w') !== !!cfg.flip ? -1 : 1);
  }
  return false;
}
const canAttack=(p,r,c)=>canAttackFrom(p.type,p.r,p.c,r,c,p.side);
function attackedByPlayer(r,c){
  for(const p of pieces) if(p.alive&&p.side==='w'&&!p.move&&canAttack(p,r,c)) return true;
  return false;
}
/* what a bot piece of this type would threaten if it stood on (r,c) */
function threatFrom(type,r,c){
  let s=0;
  for(const q of pieces){
    if(!q.alive||q.side!=='w'||q.move) continue;
    if(canAttackFrom(type,r,c,q.r,q.c)) s += VAL[q.type]*7;
  }
  return s;
}
/* The king kill IS the round. Under the old gold rules this was a computed value that could go
   NEGATIVE — killing the king revived the victim's whole army, so it was often a bad trade. Now
   it ends the round outright and nothing outranks it. */
const KING_KILL=100000;
/* ================= how badly the bot plays =================
   Three dials rather than one difficulty number, because they produce different mistakes.
   HOLD is hesitation: a piece that comes off cooldown is not used for up to another second, so
   the bot is a beat behind you rather than perfectly reactive. Note it is timed from when the
   bot NOTICES the piece is free, not from the piece's last move — a delay measured from the
   move start would sit entirely inside the five-second cooldown and cost nothing at all.
   BLUNDER throws a whole decision away on a random legal move, which is what actually creates
   the openings you can see and it did not.
   KING_CARE scales how hard the bot's own king avoids danger. At full strength it hugged the
   back rank and never gave you a shot at it; turned down, it wanders into contested squares and
   loses rounds the way a human does. */
let BOT_HOLD_MIN=1400, BOT_HOLD_MAX=3600; // wait after a piece comes off cooldown
let BOT_CAD_MIN=700, BOT_CAD_SPAN=900;    // gap between decisions, whatever they are
let BOT_SNIPE=0.25;        // chance he takes a king shot the instant he sees it
let BOT_BLUNDER=0.40;      // decisions played as a random legal move instead
let BOT_KING_CARE=0.22;    // multiplier on every term that keeps its king safe
let BOT_NOISE=45;          // enough to reorder anything the terms nearly tie on
/* Three named settings over those six dials. They are not one difficulty number scaled three
   ways, because the dials produce DIFFERENT mistakes and a good opponent is one that makes the
   interesting ones: Hard keeps a real reaction delay (a third of a second minimum, up to
   ~1s) and still throws away one decision in ten, so it can be read and punished — it is fast
   and greedy rather than clairvoyant. What actually separates the three is how often the king
   shot lands and how well its own king looks after itself; those are the two things a player
   learns to exploit, in that order.
   Easy is unchanged from the tuning this build shipped with. */
const DIFFS=[
  {k:'easy',label:'Easy',  hold:[1400,3600], cad:[700,900], snipe:0.25, blunder:0.40, care:0.22, noise:45},
  {k:'med', label:'Medium',hold:[600,1700],  cad:[470,620], snipe:0.46, blunder:0.24, care:0.52, noise:28},
  {k:'hard',label:'Hard',  hold:[330,980],   cad:[250,390], snipe:0.72, blunder:0.10, care:0.86, noise:15}
];
function applyDiff(){
  const d=DIFFS[cfg.diff]||DIFFS[1];
  BOT_HOLD_MIN=d.hold[0]; BOT_HOLD_MAX=d.hold[1];
  BOT_CAD_MIN=d.cad[0];   BOT_CAD_SPAN=d.cad[1];
  BOT_SNIPE=d.snipe; BOT_BLUNDER=d.blunder; BOT_KING_CARE=d.care; BOT_NOISE=d.noise;
}
const botCad=t=>t+BOT_CAD_MIN+Math.random()*BOT_CAD_SPAN;
function nearestPlayerDist(r,c){
  let d=99;
  for(const p of pieces) if(p.alive&&p.side==='w') d=Math.min(d,cheb(r,c,p.r,p.c));
  return d;
}
function readyBots(){
  const t=now();
  const out=[];
  for(const p of pieces){
    if(!p.alive||p.side!=='b'||p.move) continue;
    if(t<p.cdEnd){ p.botHold=0; continue; }   // still cooling: the hesitation is not rolled yet
    /* Rolled once, the first tick the piece is seen free, and cleared again the moment it goes
       back on cooldown. Rolling it per tick would average out to no delay at all.
       There is a FLOOR now: a 0-1000ms roll came up under half a second half the time, which
       still read as the piece snapping off cooldown. */
    if(!p.botHold) p.botHold = t + BOT_HOLD_MIN + Math.random()*(BOT_HOLD_MAX-BOT_HOLD_MIN);
    if(t<p.botHold) continue;
    out.push(p);
  }
  return out;
}
function botThink(t){
  if(!botEnabled||roundBreak) return;                // the board is frozen between rounds
  /* Its bomb. Full, it throws after its hesitation at the square whose 3x3 holds the most of
     you and the least of it, if that is worth at least a minor piece. */
  if(BOMB.on&&kitOn()&&kit.b&&kit.b.bomb>=1){
    const k=kit.b;
    if(!k.bombHold) k.bombHold=t+BOT_HOLD_MIN+Math.random()*(BOT_HOLD_MAX-BOT_HOLD_MIN);
    if(t>=k.bombHold){
      const sq=botBombSquare(t);
      if(sq&&doBomb('b',sq[0],sq[1])){ lastBotMove=t; botNext=Math.max(botNext,t+400); return; }
      k.bombHold=t+700;
    }
  }
  /* Its card. Full, it spawns after the same hesitation its pieces roll, so a spawn never snaps
     in the instant the charge lands; hard bots roll short, easy ones long. */
  if(kitOn()&&kit.b&&kit.b.charge>=1&&!kit.b.full){
    const k=kit.b;
    if(!k.holdAt) k.holdAt=t+BOT_HOLD_MIN+Math.random()*(BOT_HOLD_MAX-BOT_HOLD_MIN);
    if(t>=k.holdAt){
      const sq=botSpawnSquare(k.next);
      if(sq&&doSpawn('b',sq[0],sq[1])){ lastBotMove=t; botNext=Math.max(botNext,t+400); return; }
      k.holdAt=t+600;
    }
  }
  const wK=pieces.find(p=>p.alive&&p.side==='w'&&p.type==='K');
  /* The king shot. This used to be unconditional — step into range of any ready piece and the
     round was simply over. That is the single harshest thing in the game for somebody who has
     not learned the ranges yet, because it ends the round from off-screen with no build-up. He
     now misses it more often than he takes it, which turns the same moment into a near miss you
     can feel and learn from. */
  if(t>=botSnipe){
    botSnipe=t+200;
    if(wK&&Math.random()<BOT_SNIPE) for(const p of readyBots()){
      if(isLegal(p,wK.r,wK.c)&&stationaryAt(wK.r,wK.c)===wK){
        startMove(p,wK.r,wK.c); p.botHold=0;
        lastBotMove=t; botNext=Math.max(botNext,t+1000); return;
      }
    }
  }
  if(t<botNext) return;
  /* A blunder is a whole turn thrown away, not a slightly worse score. Nudging weights only ever
     produces a bot that plays the same game a bit loosely; actually moving at random some of the
     time is what hands you a piece you can punish. */
  if(Math.random()<BOT_BLUNDER){
    const rb=readyBots();
    if(rb.length){
      const p=rb[Math.floor(Math.random()*rb.length)];
      const ms=legalMoves(p);
      if(ms.length){
        const m=ms[Math.floor(Math.random()*ms.length)];
        startMove(p,m[0],m[1]); p.botHold=0;
        lastBotMove=t; botNext=botCad(t);
        return;
      }
    }
  }
  let best=null,bestS=-1e9;
  /* The hunt gradient. Deleting the gold term removed the ONLY long-range attractor in this
     function — threat and capture terms are both zero-radius, so with nothing to reach the bot
     scored random noise, missed the >=10 gate, and shuffled once every 1.8s until the two
     armies collided by accident. On a 6x8 board that opening lasts forever. Closing on the
     enemy king replaces it, and it points at the actual win condition rather than a proxy. */
  for(const p of readyBots()){
    const aNow=attackedByPlayer(p.r,p.c);
    const threatNow=threatFrom(p.type,p.r,p.c);
    const dkNow=wK?cheb(p.r,p.c,wK.r,wK.c):0;
    for(const [r,c] of legalMoves(p)){
      let s=Math.random()*BOT_NOISE;
      const tgt=stationaryAt(r,c);
      if(tgt) s += VAL[tgt.type]*100 + (tgt.type==='K'?KING_KILL:0);
      /* A lit fuse: out of its 3x3 as it runs, never into one. */
      if(bombs.length) s += (bombDanger(p.r,p.c,t)-bombDanger(r,c,t))*450;
      /* Bolts: landing on one, or a slider's flight crossing some, is worth going for. */
      if(bolts.length){
        if(boltAt(r,c)) s+=48;
        if(p.type!=='N'&&p.type!=='K'){ const dr=r-p.r, dc=c-p.c, L=Math.max(Math.abs(dr),Math.abs(dc));
          for(let i=1;i<L;i++) if(boltAt(p.r+Math.sign(dr)*i,p.c+Math.sign(dc)*i)) s+=34; }
      }
      const aThere=attackedByPlayer(r,c);
      if(aNow&&!aThere) s+=VAL[p.type]*16;
      if(aThere) s -= tgt ? VAL[p.type]*12 : VAL[p.type]*30;
      /* Run from the closing ring. This is what finally moves the bot's king off its back rank:
         ring 0 is the outer border, so home is the FIRST square the spikes take. Scaled by how
         imminent each ring's eruption is, so early play is unaffected and the pull sharpens as
         the deadline nears — and crucially it does not reverse once the piece has stepped in. */
      s += (urgency(ringAt(p.r,p.c),t)-urgency(ringAt(r,c),t))*320;

      const closing = wK ? (dkNow-cheb(r,c,wK.r,wK.c)) : 0;
      if(p.type==='K'){
        /* Losing this king hands the round away outright, and the bot used to know it — it sat
           on its back rank behind a wall and you rarely got a shot. Scaled down by KING_CARE it
           still avoids walking onto a blade, but it drifts into contested ground and gives you
           the openings a real opponent does. */
        if(aThere) s-=600*BOT_KING_CARE;
        s += (nearestPlayerDist(r,c)-nearestPlayerDist(p.r,p.c))*14*BOT_KING_CARE - 6;
      }else{
        s += closing*30;                                   // press toward the enemy king
        s += threatFrom(p.type,r,c)-threatNow;
        if(aThere&&!tgt) s-=40;                            // but don't walk onto a defended square
        /* The hill's pull. It wants the queen, so the hill is worth a piece: stepping onto the
           ring scores like a capture, more when you are taking it (a contest freezes your
           timer), with a gradient toward it from anywhere; abandoning a running timer costs more
           than any capture but the king; once it holds the hill uncontested its other pieces
           stop piling on, and shuffling around the ring buys nothing. */
        if(shrineArmed(t)){
          const there=onRing(r,c), here=onRing(p.r,p.c);
          const holds=shrine.present.b, contested=shrine.present.w&&shrine.present.b;
          const dNow=Math.max(Math.abs(p.r-SR()),Math.abs(p.c-SC())), dThere=Math.max(Math.abs(r-SR()),Math.abs(c-SC()));
          if(there&&!here){ if(!holds||contested) s += 160 + (shrine.prog.w>0?120:0) - (aThere?120:0); else s += 8; }
          else if(!here&&!holds) s += (dNow-dThere)*22;
          if(here&&!there&&shrine.prog.b>0&&!contested&&!(tgt&&tgt.type==='K')) s -= 400;
          if(here&&there) s -= 30;
        }
      }
      if(s>bestS){bestS=s;best={p,r,c};}
    }
  }
  /* The anti-idle fallback. It has to move out with the cadence or it fires constantly and
     quietly undoes the hesitation above. */
  const forced = t-lastBotMove>3200;
  if(best&&(bestS>=10||(forced&&bestS>=-12))){
    startMove(best.p,best.r,best.c); best.p.botHold=0;
    lastBotMove=t; botNext=botCad(t);
  } else botNext=t+Math.min(300,BOT_CAD_MIN);
}

/* ================= input ================= */
function squareAt(x,y){
  const c=Math.floor((x-ox)/S), r=Math.floor((y-oy)/S);
  return inB(r,c)?{r,c}:null;
}
/* Which square a release actually means.
   The square under the pointer ALWAYS wins — what you point at is what you get.
   Only when that square is not a legal target do we round to the nearest legal one, measured
   by how far OUTSIDE that square you landed (not from its centre, which would let a big radius
   reach past a square you pointed at). That first rule is what makes a GENEROUS radius safe:
   the only thing rounding can ever do is turn a dead drop into the closest real move. SNAP at
   1.25 means anything within a square and a quarter of a legal edge rounds; further than that
   is clearly a cancel and stays one. */
function snapTarget(p,x,y){
  if(kitOn()&&y>oy+S*ROWS+S*0.3) return null;       // a piece dropped on the tray is a cancel, not a bottom-row move
  const fr=(y-oy)/S-0.5, fc=(x-ox)/S-0.5;
  const moves=legalMoves(p);
  const r0=Math.round(fr), c0=Math.round(fc);
  for(const m of moves) if(m[0]===r0&&m[1]===c0) return m;
  if(SNAP<=0) return null;
  let best=null,bd=SNAP;
  for(const m of moves){
    const dy=Math.max(0,Math.abs(fr-m[0])-0.5), dx=Math.max(0,Math.abs(fc-m[1])-0.5);
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<bd){bd=d;best=m;}
  }
  return best;
}
let hoverId=null;
function pressPiece(p,ptype){
  p.pressAt=wall();
  const R=pieceRect(p,now()); fx.push({kind:'pop',x:R.cx,y:R.footY-S*0.05,col:'#9cc4ff',t0:wall(),dur:240});
  /* Haptics only once the page has a user activation to spend; Chrome refuses (and logs) the
     call before the first completed tap, and a refused call is worse than none. */
  if(ptype!=='mouse'&&navigator.vibrate&&navigator.userActivation&&navigator.userActivation.hasBeenActive){ try{navigator.vibrate(8);}catch(_){} }
}
function beginDrag(p,e){
  drag={p,pid:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,
        ptype:e.pointerType,moved:false};
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  pressPiece(p,e.pointerType);
  hoverId=null; canvas.style.cursor = e.pointerType==='mouse' ? 'grabbing' : '';
}
function updateHover(x,y){
  let id=null, cur='';
  if(started&&!gameOver){
    if(chromeHit(x,y)) cur='pointer';
    else if(kitOn()&&kit.w&&trayHit(x,y)) cur=cardReady(trayHit(x,y))?'grab':'default';
    else if(!frozen()){
      const sq=squareAt(x,y); let p=sq?stationaryAt(sq.r,sq.c):null;
      if(!(p&&p.side==='w')) p=hitTall(x,y);
      if(p&&p.side==='w'&&p.alive&&!p.move){ id=p.id; cur='grab'; }
    }
  }
  if(id!==hoverId){ hoverId=id; if(id!==null){ const p=pieces.find(q=>q.id===id); if(p) p.hoverAt=wall(); } }
  canvas.style.cursor=cur;
}
canvas.addEventListener('pointerleave',()=>{ if(!drag){ hoverId=null; canvas.style.cursor=''; } });
/* Tall art means a piece's body covers part of the row above it, so a tap can land on a
   piece while pointing at someone else's square. The overhang test is APPENDED, never
   inserted ahead of the existing steps: a piece standing in the tapped square still wins
   first, and a legal destination for the current selection still wins second — resolved by
   snapTarget itself, so the 0.22-square forgiveness is untouched. Only what used to be a
   dead tap now falls through to "did I touch a piece's body". */
/* Live at all times — during the count-in, between rounds, on the result screen. Getting out to
   the menu is the one thing that must never be gated on the state of the match. */
function chromeHit(x,y){
  const G=bannerGeom();
  for(const k of ['home','snd']){
    const d=G[k], pad=Math.max(6,S*0.10);            // a thumb is wider than the disc
    if(Math.hypot(x-d.cx,y-d.cy)<=d.r+pad) return k;
  }
  return null;
}
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const hit=chromeHit(e.clientX,e.clientY);
  if(hit==='home'){ openSettings(); return; }
  if(hit==='snd'){ audioArm(); soundToggle(); return; }
  if(campaign.active&&campaign.waitTap&&!gameOver){ campaign.waitTap=false; countIn=now(); return; }   // the card has been read: play, now
  if(gameOver||drag||frozen()) return;
  if(kitOn()&&kit.w){
    /* Armed by a tap on a card: this tap places, or cancels. */
    if(kit.w.placing||kit.w.bombPlacing){
      const kind=kit.w.bombPlacing?'bomb':'spawn'; kit.w.placing=false; kit.w.bombPlacing=false;
      if(trayHit(e.clientX,e.clientY)) return;
      const sq=squareAt(e.clientX,e.clientY);
      if(sq){ if(kind==='bomb') doBomb('w',sq.r,sq.c); else doSpawn('w',sq.r,sq.c); }
      return;
    }
    const card=trayHit(e.clientX,e.clientY);
    if(card){ if(cardReady(card)) beginKitDrag(card,e); return; }
  }
  const sq=squareAt(e.clientX,e.clientY);
  if(!sq){
    const q=hitTall(e.clientX,e.clientY);
    if(q){beginDrag(q,e);return;}
    selected=null;return;
  }
  const p=stationaryAt(sq.r,sq.c);
  if(p&&p.side==='w'){ beginDrag(p,e); return; }
  /* Drag and drop only. There is no selected piece to tap a destination for — a tap on an
     empty square does nothing, and a tap on a piece's body starts a drag from it. */
  const q=hitTall(e.clientX,e.clientY);
  if(q){beginDrag(q,e);return;}
  selected=null;
});
canvas.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid){ if(!drag&&e.pointerType==='mouse') updateHover(e.clientX,e.clientY); return; }
  e.preventDefault();
  drag.x=e.clientX; drag.y=e.clientY;
  if(Math.hypot(drag.x-drag.sx,drag.y-drag.sy)>7) drag.moved=true;
});
canvas.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  e.preventDefault();
  const d=drag; drag=null; canvas.style.cursor='';
  if(d.spawn||d.bomb){ kitRelease(d,e.clientX,e.clientY); return; }
  if(gameOver||!d.p.alive){selected=null;return;}
  const x=e.clientX, y=e.clientY;
  const sq=squareAt(x,y);
  if(d.moved){
    if(sq&&sq.r===d.p.r&&sq.c===d.p.c){ dropQueued(d.p,'cancel'); selected=d.p; return; }
    const tgt=snapTarget(d.p,x,y);
    if(tgt&&issue(d.p,tgt[0],tgt[1])){ selected=null; return; }

    if(d.p.queued) dropQueued(d.p,'cancel');

/* ================= audio =================
   Everything is synthesised. The build ships as one file and an Artifact blocks external media
   outright, so there is nowhere a sample could come from. Web Audio also lets the king-kill cue
   be the SAME patch as an ordinary capture with its envelopes opened up, which is what makes it
   read as an amplified version of the hit rather than a different sound entirely. */
const AUDIO={ctx:null, master:null, comp:null, sfx:null, on:true, running:false};
try{ AUDIO.on = localStorage.getItem('kfcSound')!=='0'; }catch(e){}
let noiseBuf=null;
function audioInit(){
  if(AUDIO.ctx) return AUDIO.ctx;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  try{ AUDIO.ctx=new AC(); }catch(e){ return null; }
  const c=AUDIO.ctx;
  AUDIO.master=c.createGain(); AUDIO.master.gain.value=AUDIO.on?1:0;
  /* A limiter, not a mixing choice: five layers of the king-kill patch plus a bar of music can
     sum past 1.0, and everything above that hard-clips into crackle rather than getting louder.
     Threshold sits high enough that ordinary play never touches it. */
  AUDIO.comp=c.createDynamicsCompressor();
  AUDIO.comp.threshold.value=-3; AUDIO.comp.knee.value=4;
  AUDIO.comp.ratio.value=8; AUDIO.comp.attack.value=0.002; AUDIO.comp.release.value=0.15;
  AUDIO.master.connect(AUDIO.comp); AUDIO.comp.connect(c.destination);
  /* The track is mastered low: at unity it peaks around 0.29 and sits near 0.20, which is where
     the old synth bed sat and where the capture cues were balanced against. 0.85 keeps that
     relationship and leaves the limiter something to work with when a kill lands on a swell. */
  AUDIO.sfx=c.createGain();   AUDIO.sfx.gain.value=0.80;   AUDIO.sfx.connect(AUDIO.master);
  return c;
}
function noiseSrc(c){
  if(!noiseBuf){
    noiseBuf=c.createBuffer(1,Math.floor(c.sampleRate*1.2),c.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  const s=c.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s;
}
/* exponentialRampToValueAtTime cannot reach or start from zero, hence the 1e-4 floors. */
const EPS=0.0001;
let lastHitAt=-1e9;
function sfxCapture(big){
  const c=AUDIO.ctx; if(!c||!AUDIO.on) return;
  const t=c.currentTime, out=AUDIO.sfx;
  /* Two kills can land on the same tick. Without this they sum and clip into a click, which
     reads as a bug rather than as a double kill. */
  const near=t-lastHitAt<0.045;
  if(near&&!big) return;
  lastHitAt=t;
  const amp=big?0.72:0.5;
  // 1. transient — the crack of the impact
  const nz=noiseSrc(c), nf=c.createBiquadFilter(), ng=c.createGain();
  nf.type='bandpass'; nf.frequency.value=big?1150:2100; nf.Q.value=0.8;
  ng.gain.setValueAtTime(EPS,t);
  ng.gain.exponentialRampToValueAtTime(0.85*amp,t+0.005);
  ng.gain.exponentialRampToValueAtTime(EPS,t+(big?0.34:0.12));
  nz.connect(nf); nf.connect(ng); ng.connect(out);
  nz.start(t); nz.stop(t+(big?0.42:0.18));
  // 2. body — the weight behind it
  const o=c.createOscillator(), og=c.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(big?185:165,t);
  o.frequency.exponentialRampToValueAtTime(big?34:50,t+(big?0.40:0.15));
  og.gain.setValueAtTime(EPS,t);
  og.gain.exponentialRampToValueAtTime(0.95*amp,t+0.008);
  og.gain.exponentialRampToValueAtTime(EPS,t+(big?0.60:0.20));
  o.connect(og); og.connect(out); o.start(t); o.stop(t+(big?0.66:0.24));
  // 3. blade — a short metallic ring so it lands as a strike, not a drum
  for(const f of [880,1320]){
    const b=c.createOscillator(), bg=c.createGain();
    b.type='triangle';
    b.frequency.setValueAtTime(f,t);
    b.frequency.exponentialRampToValueAtTime(f*0.72,t+0.1);
    bg.gain.setValueAtTime(EPS,t);
    bg.gain.exponentialRampToValueAtTime(0.20*amp,t+0.004);
    bg.gain.exponentialRampToValueAtTime(EPS,t+0.13);
    b.connect(bg); bg.connect(out); b.start(t); b.stop(t+0.15);
  }
  if(!big) return;
  // 4. the king only: a sub that keeps falling, and a minor stab under it
  const sub=c.createOscillator(), sg=c.createGain();
  sub.type='sine';
  sub.frequency.setValueAtTime(70,t); sub.frequency.exponentialRampToValueAtTime(26,t+0.9);
  sg.gain.setValueAtTime(EPS,t); sg.gain.exponentialRampToValueAtTime(0.55,t+0.02);
  sg.gain.exponentialRampToValueAtTime(EPS,t+1.05);
  sub.connect(sg); sg.connect(out); sub.start(t); sub.stop(t+1.1);
  for(const semi of [0,3,7]){
    const st=c.createOscillator(), stg=c.createGain(), lp=c.createBiquadFilter();
    st.type='sawtooth'; st.frequency.value=110*Math.pow(2,semi/12);
    lp.type='lowpass';
    lp.frequency.setValueAtTime(2600,t+0.02);
    lp.frequency.exponentialRampToValueAtTime(420,t+0.75);
    stg.gain.setValueAtTime(EPS,t+0.02);
    stg.gain.exponentialRampToValueAtTime(0.18,t+0.06);
    stg.gain.exponentialRampToValueAtTime(EPS,t+0.85);
    st.connect(lp); lp.connect(stg); stg.connect(out);
    st.start(t+0.02); st.stop(t+0.9);
  }
}
