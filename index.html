  /* Was #161512, a warm near-black, while the canvas painted a cool one — three different
     blacks nobody notices at black and everybody notices once the sky has a hue. */
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2f8fe6;
    position:fixed;top:0;left:0;right:0;bottom:0;inset:0;
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  #game{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;}
  #err{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#7a1f1f;color:#fff;
    font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:10px 12px;white-space:pre-wrap;}
  /* The splash owns the first paint. It sits above the script in the HTML, so it is on screen
     before any of the game has parsed, and it leaves only when the title scene under it is
     complete. font-display:block keeps its wordmark invisible until Cinzel has decoded, so it
     appears set, never swapped. */
  /* The boot screen: the first paint, and the only thing on screen until BEGIN. Nothing on it
     depends on the width of the art, so a frame that settles late moves nothing but a centred
     logo by a hair. Navy ground, the logo, a progress bar that fills on the real load, then the
     button — whose tap is also the gesture that unlocks audio. */
  #splash{position:fixed;inset:0;z-index:50;background:linear-gradient(#27468a,#152d63 55%,#0b1226);overflow:hidden;transition:opacity .45s ease-out;}
  #splash.out{opacity:0;pointer-events:none;}
  #splash .boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    padding:0 24px calc(4vh + env(safe-area-inset-bottom));}
  #splash .logo{width:min(72vw,320px);height:auto;display:block;
    filter:drop-shadow(0 6px 0 rgba(8,16,36,.55)) drop-shadow(0 12px 24px rgba(0,0,0,.35));}
  #splash .bar{width:min(58vw,250px);height:10px;border-radius:5px;background:rgba(8,16,36,.7);box-sizing:border-box;
    box-shadow:0 0 0 2px #141b33, 0 0 0 4px rgba(255,226,138,.35), 0 3px 0 4px rgba(11,18,38,.5);overflow:hidden;transition:opacity .3s;}
  #splash .bar i{display:block;height:100%;width:100%;border-radius:5px;background:linear-gradient(90deg,#ffe28a,#f4b73a);
    transform-origin:left center;transform:scaleX(0);transition:transform .2s linear;}
  #splash #begin{opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .35s ease-out,transform .35s ease-out;
    margin-top:-6px;padding:14px 44px;border:3px solid #141b33;border-radius:14px;cursor:pointer;touch-action:manipulation;
    font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:24px;letter-spacing:.06em;
    color:#ffffff;text-shadow:-1.5px -1.5px 0 #141b33,1.5px -1.5px 0 #141b33,-1.5px 1.5px 0 #141b33,1.5px 1.5px 0 #141b33,0 3px 0 #0b1226;
    background:linear-gradient(rgba(255,255,255,.40),rgba(255,255,255,0) 42%),linear-gradient(#ffe28a,#f4b73a 55%,#e0951c);
    box-shadow:0 5px 0 #0b1226, inset 0 -3px 0 rgba(0,0,0,.14);}
  #splash #begin:active{transform:translateY(3px)!important;box-shadow:0 2px 0 #0b1226, inset 0 -3px 0 rgba(0,0,0,.14);}
  #splash.ready .bar{opacity:0;}
  #splash.ready #begin{opacity:1;pointer-events:auto;transform:none;}
  /* The menu sits low, under the title scene's hero, and dims the screen only where it needs
     contrast: the hero above stays lit. */
  #setup{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;display:none;z-index:30;
    flex-direction:column;align-items:center;justify-content:flex-start;padding:16px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(rgba(8,16,36,0) 52%,rgba(8,16,36,.35) 74%,rgba(8,16,36,.62) 100%);
    overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;}
  #setup.show{display:flex;}
  /* THE PLAQUE. The rim is the card's own background and the stone is a ::before inset into it,
     rather than a wrapper element — the card's children are staggered by :nth-child on open, and
     wrapping them would collapse that stagger to a single item. ::before is not a child, so the
     stagger is untouched. ::after carries the four corner studs as radial gradients. */
  /* The top margin is the title's room: the card and the wordmark above it centre as one group. */
  /* The menu: a navy sheet at the foot of the art with a gold rim and an ink outline — the
     logo's own palette. margin-top:auto sinks it to the bottom while the column still scrolls
     when a short screen needs it. */
  /* The card sits at the foot of the visible screen, centred; by the time it is seen the boot
     screen has already held the viewport still. */
  #setup .card{position:relative;box-sizing:border-box;width:100%;max-width:344px;margin:auto auto 0;
    border-radius:16px;padding:20px 20px 16px;
    background:linear-gradient(#27468a,#152d63 55%,#10224c);
    border:3px solid #ffd45a;
    box-shadow:0 0 0 2px #141b33, 0 8px 0 2px #0b1226, 0 18px 50px rgba(0,0,0,.5);}
  #setup .card::before{content:'';position:absolute;inset:0;border-radius:12px;pointer-events:none;
    background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,0) 30%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
  #setup .card::after{content:'';position:absolute;inset:0;border-radius:12px;pointer-events:none;
    background:
      radial-gradient(circle 3.4px at 12px 12px,#ffe9a0 55%,#7a4d10 60%,transparent 64%),
      radial-gradient(circle 3.4px at calc(100% - 12px) 12px,#ffe9a0 55%,#7a4d10 60%,transparent 64%),
      radial-gradient(circle 3.4px at 12px calc(100% - 12px),#ffe9a0 55%,#7a4d10 60%,transparent 64%),
      radial-gradient(circle 3.4px at calc(100% - 12px) calc(100% - 12px),#ffe9a0 55%,#7a4d10 60%,transparent 64%);}
  #setup .card>*{position:relative;z-index:1;}
  /* Engraved: a dark drop below and a light catch above is what reads as cut into metal. */
  #setup h1{margin:0 0 6px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:27px;
    color:#e8c86a;letter-spacing:.6px;text-wrap:balance;text-align:center;
    text-shadow:0 2px 0 rgba(8,5,14,.85), 0 -1px 0 rgba(255,246,214,.22);}
  #setup .row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07);}
  #setup .lbl{font-size:15px;color:#a9c4ea;}
  /* The label over the difficulty tabs is a plate caption, not body text. */
  #setup .diffwrap .lbl{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:11.5px;
    letter-spacing:.16em;text-transform:uppercase;color:#dcb35a;}
  #setup .step{display:flex;align-items:center;gap:2px;}
  #setup .step button{width:38px;height:38px;border:0;border-radius:9px;background:rgba(255,255,255,.09);
    color:#e8e2d6;font-size:20px;line-height:1;cursor:pointer;touch-action:manipulation;}
  #setup .step button:active{background:rgba(255,255,255,.24);}
  #setup .val{min-width:62px;text-align:center;font-size:15px;font-weight:700;color:#fff;
    font-variant-numeric:tabular-nums;}
  #setup .seg{display:flex;gap:6px;}
  /* Unselected: a socket cut into the stone with a dark brass rim. Selected: blue enamel in a
     bright brass rim with a gloss band — the same enamel the king's portrait well used. */
  #setup .seg button{padding:9px 14px;border:2px solid #0f2048;border-radius:9px;
    background:rgba(8,16,36,.55);box-sizing:border-box;
    color:#a9c4ea;font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:14px;
    letter-spacing:.04em;cursor:pointer;touch-action:manipulation;}
  #setup .seg button.on{border-color:#141b33;color:#ffffff;
    background:linear-gradient(rgba(255,255,255,.30),rgba(255,255,255,0) 42%),
               linear-gradient(#5db4ff,#2d7fe8 55%,#1c4fb8);
    box-shadow:0 3px 0 #0b1226;
    text-shadow:-1px -1px 0 #141b33,1px -1px 0 #141b33,-1px 1px 0 #141b33,1px 1px 0 #141b33,0 2px 0 #0b1226;}
  /* Three across in a 300px column with a badge stacked over the word. min-width:0 lets the
     flex items actually shrink to a third each. */
  #setup .seg.pick3 button{flex:1;min-width:0;padding:9px 3px 8px;font-size:12.5px;
    display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1.1;}
  #setup .seg.pick3 button canvas{display:block;pointer-events:none;}
  /* The one thing on the card you are meant to touch, so it gets the full column rather than
     sharing a row with its label. */
  #setup .diffwrap{margin:2px 0 2px;}
  #setup .diffwrap .lbl{display:block;margin:0 0 8px;}
  #setup .seg.diff button{flex:1;min-width:0;padding:12px 4px;font-size:13.5px;}
  #setup .plabel{font-size:12px;letter-spacing:.10em;text-transform:uppercase;color:#8d877d;
    font-weight:700;margin:14px 0 6px;}
  #setup .pdesc{font-size:12.5px;color:#b3ada2;margin:6px 0 2px;min-height:32px;line-height:1.35;}
  /* The rules sit above the two pickers, so they are the first thing read and the last thing
     in the way — hanging markers keep the wrapped second line aligned under the first rather
     than under the bullet. */
  /* A hairline under the list, not just a gap. These four lines are what you READ; everything
     below them is what you DO, and the two want visibly separating rather than merely spacing
     apart — a gap alone reads as loose layout, a rule reads as a decision. */
  #setup .rules{margin:12px 0 16px;padding:0 0 14px;list-style:none;
    border-bottom:1px solid rgba(220,179,90,.42);}
  #setup .rules li{position:relative;padding:0 0 0 18px;margin:0 0 7px;
    font-size:13.5px;line-height:1.45;color:#e6dfd0;}
  #setup .rules li:last-child{margin-bottom:0;}
  /* A brass lozenge rather than a grey dot: a square on its corner, which is the same mark the
     plaque's studs imply and costs nothing but a rotation. */
  #setup .rules li::before{content:'';position:absolute;left:2px;top:6px;
    width:6px;height:6px;border-radius:1px;background:#dcb35a;transform:rotate(45deg);}
  /* The Start slab. Rounded corners AND a gradient rim need the padding-box trick: the brass
     layer is painted to the border box and shows through a transparent border, while the enamel
     and its gloss are clipped to the padding box. A plain border colour would be flat brass. */
  /* The two doors, in the logo's language: white chunky words with an ink outline on enamel,
     an ink rim, a solid drop that presses in. Blue for the sandbox. */
  #start{margin-top:18px;width:100%;padding:14px 13px;border:3px solid #141b33;
    border-radius:14px;cursor:pointer;touch-action:manipulation;
    font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:23px;letter-spacing:.04em;
    color:#ffffff;text-shadow:-1.5px -1.5px 0 #141b33,1.5px -1.5px 0 #141b33,-1.5px 1.5px 0 #141b33,1.5px 1.5px 0 #141b33,0 3px 0 #0b1226;
    background:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,0) 42%),linear-gradient(#5db4ff,#2d7fe8 55%,#1c4fb8);
    box-shadow:0 5px 0 #0b1226, inset 0 -3px 0 rgba(0,0,0,.18);}
  #start:active{transform:translateY(3px);box-shadow:0 2px 0 #0b1226, inset 0 -3px 0 rgba(0,0,0,.18);}
  /* The campaign is the front door now, so it gets the gold enamel; free play keeps the blue. */
  /* Gold for the campaign: the front door, the loudest thing on the sheet. */
  #campaign{margin-top:18px;width:100%;padding:14px 13px;border:3px solid #141b33;
    border-radius:14px;cursor:pointer;touch-action:manipulation;
    font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:23px;letter-spacing:.04em;
    color:#ffffff;text-shadow:-1.5px -1.5px 0 #141b33,1.5px -1.5px 0 #141b33,-1.5px 1.5px 0 #141b33,1.5px 1.5px 0 #141b33,0 3px 0 #0b1226;
    background:linear-gradient(rgba(255,255,255,.40),rgba(255,255,255,0) 42%),linear-gradient(#ffe28a,#f4b73a 55%,#e0951c);
    box-shadow:0 5px 0 #0b1226, inset 0 -3px 0 rgba(0,0,0,.14);}
  #campaign:active{transform:translateY(3px);box-shadow:0 2px 0 #0b1226, inset 0 -3px 0 rgba(0,0,0,.14);}
  #campaign + #start{margin-top:10px;}
  /* The title card: a title, one line, the campaign; a rule; one line, the final battle and
     its difficulty. The lines are set small and warm so the two gold buttons stay the loudest
     things on the card. */
  #setup p.lead{margin:0 0 12px;font-size:13.5px;line-height:1.45;color:#cfcac0;text-align:center;text-wrap:balance;}
  #setup hr.rule{border:0;height:2px;margin:16px 0 12px;
    background:linear-gradient(90deg,rgba(255,212,90,0),rgba(255,212,90,.85),rgba(255,212,90,0));}
  #campaign{margin-top:2px;}
  #start{margin-top:2px;}
  #setup .diffwrap{margin:14px 0 0;}
  .ghost{margin-left:8px;font-size:15px;padding:11px 20px;border-radius:12px;border:0;
    background:rgba(255,255,255,.1);color:#cfcac0;font-weight:600;cursor:pointer;touch-action:manipulation;}
  .ghost:active{background:rgba(255,255,255,.2);}
  button:focus-visible{outline:2px solid #f0d9b5;outline-offset:2px;}
  /* The in-game chrome is CANVAS now, not DOM. Two brass discs flanking the scoreboard in the
     top strip, drawn by the same code and lit by the same light as everything else on the
     plate. The pair used to be a pill and a speaker floating under the board, which cost 48px
     of height for two controls nobody looks at twice — and being DOM they had to be positioned
     from JS every frame to survive the iOS URL-bar animation. On the canvas that problem does
     not exist. */
  #end,#hand{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(8,16,36,.62);z-index:10;}
  #end.show,#hand.show{display:flex;}
  #hand .panel{min-width:270px;}
  /* The chapter plaque: a small brass eyebrow (CHAPTER n) over the word, then the way on. */
  #hand .panel .eyebrow{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:11.5px;letter-spacing:.2em;color:#ffe28a;
    margin:-8px 0 2px;text-align:center;}
  #hand .panel .gone{display:none!important;}
  #hand .panel button+button{margin-top:8px;}
  /* THE CAMPAIGN: the rail. A page over the sky — a title, a scrolling route, one forward
     action pinned at the foot. The route is a vertical brass line with a medallion per chapter
     and a stop per trial; the line is lit as far as you have come, your king stands beside the
     next stop, and a chapter you have not reached folds into a locked count. Chapter III is a
     dark medallion that says coming soon. Everything sits in a phone-wide column, so on a wide
     screen it is the same page in the middle. */
  #path{position:fixed;inset:0;display:none;flex-direction:column;background:rgba(8,16,36,.74);z-index:10;}
  #path.show{display:flex;}
  #path .ptop{flex:none;height:calc(52px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
    display:flex;align-items:center;justify-content:center;
    font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:20px;letter-spacing:.04em;color:#ffffff;
    text-shadow:-1.5px -1.5px 0 #141b33,1.5px -1.5px 0 #141b33,-1.5px 1.5px 0 #141b33,1.5px 1.5px 0 #141b33,0 3px 0 #0b1226;}
  #path .pscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;touch-action:pan-y;}
  #path .rail{position:relative;width:100%;max-width:430px;margin:0 auto;padding:4px 16px 14px 0;box-sizing:border-box;}
  #path .rail .line{position:absolute;left:40px;top:0;bottom:0;width:8px;border-radius:4px;background:#1b2c5a;box-shadow:0 0 0 2px #0b1226;}
  /* A chapter's heading: a brass plate across the rail (the line passes behind it), the chapter
     in spaced capitals over its name in ink, its line beneath, and the count in a dark pill. A
     chapter not reached is dimmed; the one to come is darker still. */
  #path .plate{position:relative;margin:8px 16px 8px 14px;padding:9px 14px 9px 16px;border-radius:12px;display:flex;align-items:center;gap:12px;
    background:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,0) 45%),linear-gradient(#ffe28a,#f4b73a);
    box-shadow:0 0 0 3px #141b33, 0 5px 0 3px #0b1226;}
  #path .plate::after{content:'';position:absolute;inset:0;border-radius:12px;pointer-events:none;
    background:radial-gradient(circle 3px at 10px 10px,#fff1c2 55%,#7a4d10 60%,transparent 64%),radial-gradient(circle 3px at calc(100% - 10px) 10px,#fff1c2 55%,#7a4d10 60%,transparent 64%),
      radial-gradient(circle 3px at 10px calc(100% - 10px),#fff1c2 55%,#7a4d10 60%,transparent 64%),radial-gradient(circle 3px at calc(100% - 10px) calc(100% - 10px),#fff1c2 55%,#7a4d10 60%,transparent 64%);}
  /* The chapter's illustration fills the plate's right half behind a gold fade, so the words
     stay on gold and the picture reads as the place. */
  #path .plate{min-height:86px;overflow:hidden;}
  #path .plate .ill{position:absolute;right:0;top:0;height:100%;width:62%;object-fit:cover;object-position:right center;display:block;}
  #path .plate .fade{position:absolute;inset:0;background:linear-gradient(90deg,#f6c247 0 40%,rgba(246,194,71,0) 74%);}
  #path .plate .t,#path .plate .pr{position:relative;}
  #path .plate.soon{filter:saturate(.7) brightness(.8);}
  #path .plate.locked{filter:saturate(.75) brightness(.85);}
  #path .plate .t{flex:1;min-width:0;}
  #path .plate .eb{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:10px;letter-spacing:.22em;color:#6b4a12;}
  #path .plate .nm{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:22px;letter-spacing:.02em;color:#3a2400;line-height:1.1;}
  #path .plate .sb{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:11.5px;color:#6b4a12;margin-top:2px;}
  #path .plate .pr{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:11px;color:#ffe28a;background:#141b33;border-radius:11px;padding:4px 10px;
    box-shadow:0 0 0 2px #f4b73a;white-space:nowrap;flex:none;}
  #path .plate.locked{filter:saturate(.5) brightness(.72);}
  #path .plate.soon{filter:saturate(.25) brightness(.5);}
  /* A stop is a button, so it is tappable and focusable like the rows were. */
  #path .stop{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 4px 0 32px;margin:0;
    border:0;background:transparent;box-shadow:none;text-shadow:none;transform:none;text-align:left;cursor:pointer;touch-action:manipulation;}
  #path .stop:active{transform:none;}
  #path .stop i{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:10.5px;
    background:#1b2c5a;border:2.5px solid #2f4a8a;color:#8fa6d6;box-shadow:0 0 0 3px #0b1226;box-sizing:border-box;}
  #path .stop .nm{flex:1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:13px;letter-spacing:.06em;color:#8fa6d6;}
  #path .stop .st{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:10px;letter-spacing:.12em;color:#ffe28a;padding-right:2px;}
  #path .stop.done i{background:linear-gradient(#ffe28a,#f4b73a);border-color:#7a4d10;color:#3a2400;font-size:12px;}
  #path .stop.done .nm{color:#ffffff;}
  #path .stop.done .st{opacity:.8;}
  #path .stop.locked{cursor:default;}
  /* The next stop: the whole row becomes the enamel, rimmed in gold, its disc gold. */
  #path .stop.next{height:56px;margin:2px 0;}
  #path .stop.next .pill{position:absolute;left:24px;right:0;top:4px;bottom:4px;border-radius:12px;pointer-events:none;
    background:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,0) 42%),linear-gradient(#5db4ff,#2d7fe8 55%,#1c4fb8);
    box-shadow:0 0 0 2px #ffd45a, 0 0 0 4px #141b33, 0 5px 0 4px #0b1226;}
  #path .stop.next i{position:relative;width:32px;height:32px;margin-left:-4px;border-color:#ffffff;color:#3a2400;
    font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:15px;
    background:linear-gradient(#ffe28a,#f4b73a);box-shadow:0 0 0 3px #141b33;}
  #path .stop.next .nm{position:relative;font-family:'Lilita One',system-ui,sans-serif;font-weight:400;color:#ffffff;font-size:17px;letter-spacing:.03em;text-shadow:-1px -1px 0 #141b33,1px -1px 0 #141b33,-1px 1px 0 #141b33,1px 1px 0 #141b33,0 2px 0 #0b1226;}
  #path .stop.next .st{position:relative;background:rgba(255,255,255,.18);border-radius:6px;padding:5px 9px;color:#ffffff;margin-right:6px;}
  #path .stop.next:active .pill{transform:translateY(2px);box-shadow:0 0 0 2px #ffd45a, 0 0 0 4px #141b33, 0 2px 0 4px #0b1226;}
  #path .fold{display:flex;align-items:center;gap:10px;padding:4px 0 6px 76px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:10.5px;letter-spacing:.14em;color:#8fa6d6;}
  /* The padlock, chunky, in CSS: a thick shackle, a broad body, a keyhole. */
  #path .lock{position:relative;width:24px;height:28px;flex:none;}
  #path .lock::before{content:'';position:absolute;left:5px;top:0;width:14px;height:15px;border:4px solid #c78a1f;border-bottom:0;
    border-radius:9px 9px 0 0;box-sizing:border-box;}
  #path .lock::after{content:'';position:absolute;left:0;top:11px;width:24px;height:17px;background:#c78a1f;border-radius:4px;}
  #path .lock b{position:absolute;z-index:1;left:9px;top:15px;width:6px;height:6px;border-radius:50%;background:#0b1226;}
  #path .lock b::after{content:'';position:absolute;left:1px;top:4px;width:4px;height:6px;background:#0b1226;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%);}
  #path .pbar{flex:none;display:flex;gap:10px;align-items:center;width:100%;max-width:430px;margin:0 auto;box-sizing:border-box;
    padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(8,16,36,0),rgba(8,16,36,.9) 40%);}
  #path #toMenuPath{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid #141b33;background:linear-gradient(#27468a,#10224c);
    display:grid;place-items:center;padding:0;margin:0;box-shadow:0 4px 0 #0b1226;cursor:pointer;touch-action:manipulation;}
  #path #toMenuPath svg{width:22px;height:22px;display:block;}
  #path #toMenuPath:active{transform:translateY(2px);box-shadow:0 2px 0 #0b1226;}
  /* One clear forward action, in the same enamel as the menu's sandbox button. */
  #path #pathPlay{flex:1;margin:0;padding:13px 10px;border:3px solid #141b33;border-radius:14px;cursor:pointer;touch-action:manipulation;
    font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:18px;letter-spacing:.04em;
    color:#ffffff;text-shadow:-1.5px -1.5px 0 #141b33,1.5px -1.5px 0 #141b33,-1.5px 1.5px 0 #141b33,1.5px 1.5px 0 #141b33,0 3px 0 #0b1226;
    background:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,0) 42%),linear-gradient(#5db4ff,#2d7fe8 55%,#1c4fb8);
    box-shadow:0 5px 0 #0b1226, inset 0 -3px 0 rgba(0,0,0,.18);}
  #path #pathPlay:active{transform:translateY(3px);box-shadow:0 2px 0 #0b1226, inset 0 -3px 0 rgba(0,0,0,.18);}
  /* The handoff's way on: the next chapter, in the campaign's gold. */
  #hand .panel #handNext{background:linear-gradient(rgba(255,255,255,.40),rgba(255,255,255,0) 42%),linear-gradient(#ffe28a,#f4b73a 55%,#e0951c);box-shadow:0 5px 0 #0b1226, inset 0 -3px 0 rgba(0,0,0,.14);}
  #hand .panel #handNext.gone{display:none;}
  /* The plaque: the same navy sheet as the menu, gold rim, ink outline, gold studs. */
  .panel{position:relative;box-sizing:border-box;max-width:calc(100vw - 32px);border-radius:16px;padding:24px 28px 20px;text-align:center;
    background:linear-gradient(#27468a,#152d63 55%,#10224c);
    border:3px solid #ffd45a;
    box-shadow:0 0 0 2px #141b33, 0 8px 0 2px #0b1226, 0 18px 50px rgba(0,0,0,.5);}
  .panel::before{content:'';position:absolute;inset:0;border-radius:12px;pointer-events:none;
    background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,0) 30%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
  .panel::after{content:'';position:absolute;inset:0;border-radius:12px;pointer-events:none;
    background:
      radial-gradient(circle 3.4px at 12px 12px,#ffe9a0 55%,#7a4d10 60%,transparent 64%),
      radial-gradient(circle 3.4px at calc(100% - 12px) 12px,#ffe9a0 55%,#7a4d10 60%,transparent 64%),
      radial-gradient(circle 3.4px at 12px calc(100% - 12px),#ffe9a0 55%,#7a4d10 60%,transparent 64%),
      radial-gradient(circle 3.4px at calc(100% - 12px) calc(100% - 12px),#ffe9a0 55%,#7a4d10 60%,transparent 64%);}
  .panel>*{position:relative;z-index:1;}
  /* The plaque's hero: a strip cut from the splash, ink-rimmed in gold. */
  .panel .hero{display:block;width:100%;height:auto;border-radius:10px;border:2px solid #141b33;box-shadow:0 0 0 2px #ffd45a;margin:0 0 14px;}
  .panel h1{margin:0 0 14px;font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:36px;
    color:#ffffff;letter-spacing:.03em;text-shadow:-1.5px -1.5px 0 #141b33,1.5px -1.5px 0 #141b33,-1.5px 1.5px 0 #141b33,1.5px 1.5px 0 #141b33,0 3px 0 #0b1226;}
  /* The result reads in the game's own instrument. "Rounds 3 - 1" in grey was a scoreboard from
     a different product; three lit counters against one is the same object the HUD carries. */
  .pips{display:flex;align-items:center;justify-content:center;gap:5px;margin:0 0 20px;}
  .pips i{display:block;width:30px;height:18px;border-radius:9px;box-sizing:border-box;
    background:rgba(8,16,36,.55);border:2px solid #0f2048;}
  .pips i.on{border-color:#141b33;}
  .pips i.on.w{background:linear-gradient(rgba(255,255,255,.30),rgba(255,255,255,0) 42%),
                          linear-gradient(#8fd0ff,#2d7fe8 45%);}
  .pips i.on.b{background:linear-gradient(rgba(255,255,255,.30),rgba(255,255,255,0) 42%),
                          linear-gradient(#ff9a86,#e0463a 45%);}
  .pips span{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:13px;
    color:#ffe28a;margin:0 7px;}
  .panel button{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:19px;
    letter-spacing:.03em;padding:12px 30px;border:3px solid #141b33;border-radius:14px;
    color:#ffffff;cursor:pointer;touch-action:manipulation;text-shadow:-1.5px -1.5px 0 #141b33,1.5px -1.5px 0 #141b33,-1.5px 1.5px 0 #141b33,1.5px 1.5px 0 #141b33,0 3px 0 #0b1226;
    background:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,0) 42%),linear-gradient(#5db4ff,#2d7fe8 55%,#1c4fb8);
    box-shadow:0 5px 0 #0b1226, inset 0 -3px 0 rgba(0,0,0,.18);}
  .panel button:active{transform:translateY(3px);
    box-shadow:0 2px 0 #0b1226, inset 0 -3px 0 rgba(0,0,0,.18);}
  /* ---- transitions ----
     Every screen used to appear as a display:none -> flex cut. Keyframes restart each time the
     .show class lands, so the same rules serve every open. Children are staggered so a screen
     ASSEMBLES rather than appears — that stagger is most of what reads as production value. */
  @media (prefers-reduced-motion:no-preference){
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    @keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.965)}to{opacity:1;transform:none}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes popIn{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
    @keyframes slideDown{from{opacity:0;transform:translateY(-34px)}to{opacity:1;transform:none}}
    @keyframes slideUp{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
    /* The first open: the card is simply there when the splash lifts. The stagger is for later
       returns to the menu. */
    #setup.first.show,#setup.first.show .card,#setup.first.show .card>*{animation:none!important;}
    #setup.show{animation:fadeIn .26s ease-out both;}
    #setup.show .card{animation:cardIn .36s cubic-bezier(.2,.9,.25,1) both;}
    #setup.show .card>*{animation:rise .4s cubic-bezier(.2,.9,.25,1) both;}
    #setup.show .card>:nth-child(1){animation-delay:.06s}  #setup.show .card>:nth-child(2){animation-delay:.11s}
    #setup.show .card>:nth-child(3){animation-delay:.16s}  #setup.show .card>:nth-child(4){animation-delay:.20s}
    #setup.show .card>:nth-child(5){animation-delay:.24s}  #setup.show .card>:nth-child(6){animation-delay:.28s}
    #setup.show .card>:nth-child(7){animation-delay:.32s}  #setup.show .card>:nth-child(8){animation-delay:.36s}
    #setup.show .card>:nth-child(9){animation-delay:.40s}  #setup.show .card>:nth-child(10){animation-delay:.44s}
    /* The result: backdrop fades, the panel springs in with a little overshoot. */
    #end.show,#path.show,#hand.show{animation:fadeIn .32s ease-out both;}
    #end.show .panel,#hand.show .panel{animation:popIn .46s cubic-bezier(.2,1.25,.3,1) .08s both;}
  }

  #setup .diffwrap .lbl{color:#a9c4ea;}
</style>

/* ===== ANALYTICS =====

   the destination today. The loader is injected from here, and only when the page is on a real

   on (and turns on GA4's DebugView) for checking. gtag() exists before the library arrives, so
   calls queue in dataLayer; if an ad blocker stops the loader nothing throws and nothing is
   sent. Every event carries how the player actually plays — touch or mouse — which is a more
   honest mobile/desktop split than the browser's device category alone. */
const GA_ID='G-PZZVHH4TBT';                       // GA4 → Admin → Data streams → Web → Measurement ID
const TRACK_FORCE=/[#&]track\b/.test(location.hash);
const TRACK_ON=TRACK_FORCE||(/^https?:$/.test(location.protocol)&&!/^(localhost|127\.|10\.|192\.168\.)/.test(location.hostname));

function gtag(){ dataLayer.push(arguments); }
